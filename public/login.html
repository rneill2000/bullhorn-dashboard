<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in · Anura Connect</title>
<link rel="icon" href="/fulllogo.jpg">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#0E2E47;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
main{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:100%;max-width:400px;background:#fff;color:#0f172a;border-radius:16px;padding:36px 32px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.logo{display:block;width:120px;height:auto;border-radius:8px;margin:0 auto 18px}
h1{margin:0 0 6px;font-size:22px;text-align:center;letter-spacing:-.01em}
p{margin:0 0 24px;color:#64748b;text-align:center;font-size:15px;line-height:1.5}
a.btn{display:block;text-align:center;padding:14px 18px;border-radius:12px;background:#176087;color:#fff;text-decoration:none;font-weight:600;font-size:16px}
a.btn:hover{background:#0E2E47}
.err{margin-top:16px;padding:10px 12px;border-radius:10px;background:#fef2f2;color:#b91c1c;font-size:14px;display:none}
.foot{margin-top:22px;text-align:center;font-size:12px;color:#94a3b8}
</style>
</head>
<body>
<main>
  <div class="card">
    <img class="logo" src="/fulllogo.jpg" alt="Anura Connect">
    <h1>Anura Connect Dashboard</h1>
    <p>Internal tool. Sign in with your Bullhorn account to continue.</p>
    <a class="btn" id="go" href="/auth/login">Sign in with Bullhorn</a>
    <div class="err" id="err"></div>
    <div class="foot">Access is limited to Anura Connect staff with an active Bullhorn login.</div>
  </div>
</main>
<script>
(function(){
  var q=new URLSearchParams(location.search);
  var next=q.get("next"); if(next && next.charAt(0)==="/" && next.indexOf("//")!==0) document.getElementById("go").href="/auth/login?next="+encodeURIComponent(next);
  var e=q.get("error"); if(e){ var el=document.getElementById("err"); el.textContent=e==="expired"?"Your session expired — please sign in again.":e; el.style.display="block"; }
})();
</script>
</body>
</html>
