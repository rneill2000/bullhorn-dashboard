<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Anura Connect Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0A2239; --blue:#176087; --sky:#53A2BE; --ink:#1A2533; --muted:#566B7A; --line:#D7E1E8; --fog:#EEF3F6; --paper:#fff; --ok:#1F7A55;
  --display:Poppins, "Trebuchet MS", system-ui, sans-serif; --serif:"Source Sans 3", "Segoe UI", system-ui, sans-serif; --sans:"Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--fog);font-size:16px;line-height:1.5}
a{color:var(--blue)}
a:focus-visible,button:focus-visible{outline:3px solid var(--sky);outline-offset:2px;border-radius:4px}
img{display:block}

.top{background:var(--paper);border-bottom:1px solid var(--line)}
.top-inner{max-width:1120px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.top img{height:34px;width:auto}
.brand{display:flex;align-items:center;gap:14px}
.brand .sys{max-height:40px;max-width:200px;object-fit:contain}
.brand .x{width:1px;height:28px;background:var(--line)}
.brand .anura{height:28px}
.back{display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:600;text-decoration:none;margin-bottom:12px}
.back::before{content:"←"}
.top .shared{font-size:14px;color:var(--muted);text-align:right}
.top .shared b{color:var(--ink);font-weight:600}

.context{max-width:1120px;margin:0 auto;padding:28px 24px 0}
.context h1{font-family:var(--display);font-weight:800;font-size:clamp(24px,3.2vw,34px);line-height:1.15;letter-spacing:-.02em;color:var(--navy)}
.context h1 span{color:var(--blue)}
.tabs{display:flex;gap:4px;margin-top:18px;border-bottom:1px solid var(--line)}
.tabs button{font:inherit;font-size:15px;font-weight:600;color:var(--muted);background:none;border:0;padding:10px 14px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--navy);border-bottom-color:var(--blue)}

.main-in{max-width:1120px;margin:0 auto;padding:28px 24px 64px}

/* The badge — the one loud thing on the page. */
.layout{display:grid;grid-template-columns:300px 1fr;gap:40px;align-items:start}
.badge{position:sticky;top:20px;background:var(--paper);border-radius:16px;box-shadow:0 28px 60px -24px rgba(7,24,42,.45),0 1px 0 var(--line);overflow:hidden}
.badge .slot{width:54px;height:9px;border-radius:9px;background:var(--fog);box-shadow:inset 0 1px 2px rgba(7,24,42,.25);margin:14px auto 0}
.badge .face{padding:18px 26px 0;text-align:center}
.photo{width:152px;height:182px;margin:0 auto;border-radius:10px;background:var(--fog);object-fit:cover;border:1px solid var(--line)}
.initials{display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:50px;color:var(--blue)}
.badge h2{font-family:var(--display);font-weight:800;font-size:25px;line-height:1.15;margin-top:16px;letter-spacing:-.02em;color:var(--navy)}
.badge .headline{font-size:14px;color:var(--muted);margin-top:6px}
.badge .role{margin-top:14px;font-weight:600;color:var(--blue);font-size:15px}
.badge .certs{list-style:none;margin-top:6px;font-size:13px;color:var(--ink)}
.badge .certs li{padding:2px 0}
.facts{margin:20px 26px 0;border-top:1px solid var(--line);padding-top:14px;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.facts dt{color:var(--muted)}
.facts dd{font-weight:600;text-align:right}
.facts dd.quiet{font-weight:400;color:var(--muted)}
.badge .actions{padding:18px 26px 22px;display:grid;gap:8px}
.btn{display:block;text-align:center;font:inherit;font-weight:600;font-size:16px;padding:11px 14px;border-radius:10px;text-decoration:none;cursor:pointer;border:1px solid transparent}
.btn.primary{background:var(--blue);color:#fff}
.btn.primary:hover{background:var(--navy)}
.btn.plain{background:var(--paper);color:var(--blue);border-color:var(--line)}
.btn.plain:hover{border-color:var(--sky)}
.badge .band{background:var(--navy);color:#fff;font-size:12px;letter-spacing:.04em;padding:8px 26px;display:flex;justify-content:space-between}
.badge .band span:last-child{color:#A9C7D6}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

.story section{padding:0 0 34px;margin-bottom:34px;border-bottom:1px solid var(--line)}
.story section:last-child{border-bottom:0;margin-bottom:0}
.story h3{font-family:var(--display);font-size:19px;font-weight:700;color:var(--navy);margin-bottom:14px;letter-spacing:-.01em}
.prose{font-size:19px;line-height:1.6;max-width:66ch}
.prose p+p{margin-top:12px}
.culture{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 32px}
.culture .q{font-size:14px;color:var(--muted);margin-bottom:4px}
.culture .a{font-size:18px;line-height:1.5}
.ref + .ref{margin-top:26px}
.ref blockquote{font-size:18px;line-height:1.6;border-left:3px solid var(--sky);padding-left:18px;max-width:66ch}
.ref .who{margin-top:10px;padding-left:21px;font-size:14px;color:var(--muted)}
.ref .who b{color:var(--ink);font-weight:600}
.ref .rehire{color:var(--ok);font-weight:600}
/* Highlights: pull quotes, the reference's own words */
.highlights .pull{margin:0 0 24px;padding:6px 0 0 40px;position:relative;max-width:62ch}
.highlights .pull::before{content:"“";position:absolute;left:0;top:-4px;font-family:var(--display);font-weight:800;font-size:56px;line-height:1;color:var(--sky)}
.highlights blockquote{font-family:var(--display);font-weight:600;font-size:21px;line-height:1.45;letter-spacing:-.01em;color:var(--navy)}
.highlights figcaption{margin-top:8px;font-size:14px;color:var(--muted)}
/* Culture corner: a little like a dating profile, kept professional */
.facts-row{list-style:none;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.facts-row li{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:7px 14px;display:flex;gap:8px;align-items:baseline;font-size:14px}
.facts-row .k{color:var(--muted);font-size:12.5px}
.facts-row .v{font-weight:600;color:var(--ink)}
.prompts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.prompt{background:var(--paper);border-radius:16px;padding:18px 20px 20px;box-shadow:0 1px 0 var(--line);border-top:4px solid var(--sky)}
.prompt:nth-child(4n+2){border-top-color:var(--blue)}
.prompt:nth-child(4n+3){border-top-color:var(--navy)}
.prompt:nth-child(4n+4){border-top-color:#8FC3D6}
.prompt .q{font-family:var(--display);font-size:13px;font-weight:600;color:var(--blue);margin-bottom:8px}
.prompt .a{font-size:19px;line-height:1.45;color:var(--ink)}
/* Documents */
.docs{list-style:none;background:var(--paper);border-radius:12px;box-shadow:0 1px 0 var(--line);margin-bottom:16px}
.docs li{display:flex;align-items:center;gap:14px;padding:13px 16px;border-bottom:1px solid var(--fog)}
.docs li:last-child{border-bottom:0}
.doc-kind{font-size:12px;font-weight:600;color:var(--blue);background:#E7F1F6;border-radius:6px;padding:3px 8px;white-space:nowrap}
.doc-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc-acts{display:flex;gap:6px;font-size:14px;font-weight:600}
.doc-acts a{display:inline-flex;align-items:center;min-height:36px;padding:0 10px;border-radius:8px}
.doc-acts a:hover{background:var(--fog)}
.new{display:inline-block;margin-left:8px;font-family:var(--sans);font-size:11.5px;font-weight:700;letter-spacing:.02em;color:#fff;background:var(--blue);border-radius:999px;padding:2px 8px;vertical-align:middle}
.compare .standout{font-size:14px;font-style:italic;color:var(--navy);margin-top:6px;max-width:34ch}
.resume-frame{width:100%;height:880px;border:1px solid var(--line);border-radius:10px;background:var(--paper)}

.compare{background:var(--paper);border-radius:16px;box-shadow:0 1px 0 var(--line);overflow:hidden}
.compare table{width:100%;border-collapse:collapse;font-size:15px}
.compare th{text-align:left;font-size:13px;font-weight:600;color:var(--muted);padding:14px 18px;border-bottom:1px solid var(--line);background:#F7FAFB}
.compare td{padding:16px 18px;border-bottom:1px solid var(--line);vertical-align:top}
.compare tr:last-child td{border-bottom:0}
.compare .who{display:flex;gap:14px;align-items:center}
.compare .mini{width:48px;height:56px;border-radius:7px;object-fit:cover;background:var(--fog);border:1px solid var(--line);flex-shrink:0}
.compare .mini.initials{font-size:20px}
.compare .name{font-family:var(--display);font-weight:700;font-size:16px;color:var(--navy)}
.compare .sub{font-size:13px;color:var(--muted)}
.compare .rate,.compare .nowrap{white-space:nowrap}
.compare .rate{font-weight:700}
.compare .open{white-space:nowrap}
.compare .open .btn{padding:8px 14px;font-size:14px}
.compare-note{font-size:14px;color:var(--muted);margin-top:14px}

.contact{max-width:1120px;margin:0 auto;padding:0 24px 56px}
.contact-inner{background:var(--navy);color:#fff;border-radius:16px;padding:26px 28px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.contact h2{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.01em}
.contact p{color:#C9DCE6;font-size:15px;margin-top:4px}
.contact p a{color:#fff}
.contact .reach{display:flex;flex-wrap:wrap;gap:4px 18px}
.contact .reach a{white-space:nowrap;display:inline-flex;align-items:center;min-height:32px}
.contact .btn.primary{background:#fff;color:var(--navy)}
.contact .btn.primary:hover{background:var(--fog)}

.closed{max-width:560px;margin:72px auto;background:var(--paper);border-radius:14px;padding:36px;box-shadow:0 1px 0 var(--line)}
.closed h1{font-family:var(--display);font-weight:800;font-size:28px;margin-bottom:10px;color:var(--navy)}
.closed p{color:var(--muted)}
.closed p+p{margin-top:10px}
.loading{text-align:center;color:var(--muted);padding:80px 0}
.preview-bar{position:sticky;top:0;z-index:30;background:var(--navy);color:#C9DCE6;font-size:14px;padding:10px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.preview-bar b{color:#fff;font-weight:600}
.preview-bar .acts{display:flex;gap:8px}
.preview-bar .btn{padding:7px 14px;font-size:14px}
.preview-bar .btn.plain{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
.preview-bar .btn.primary{background:#fff;color:var(--navy)}

/* Recruiter editor: a panel beside the live Card, so every change is seen as the client will see it. */
.editor{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--paper);border-left:1px solid var(--line);box-shadow:-18px 0 40px -28px rgba(7,24,42,.6);z-index:40;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s ease}
body.editing .editor{transform:none}
@media (min-width:1100px){body.editing #app,body.editing .top,body.editing .preview-bar{margin-right:440px}}
.editor header{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.editor header h2{font-family:var(--display);font-weight:700;font-size:20px;color:var(--navy)}
.editor .x{background:none;border:0;font-size:24px;line-height:1;color:var(--muted);cursor:pointer;padding:4px 8px}
.editor .body{overflow:auto;padding:6px 22px 22px;flex:1}
.editor fieldset{border:0;padding:16px 0;border-bottom:1px solid var(--line)}
.editor fieldset:last-child{border-bottom:0}
.editor legend{font-size:13px;font-weight:700;color:var(--blue);padding:0;margin-bottom:2px}
.editor legend + div label,.editor legend + .ph{margin-top:6px}
.editor label{display:block;font-size:13px;font-weight:600;color:var(--ink);margin:10px 0 4px}
.editor input,.editor textarea{width:100%;font:inherit;font-size:15px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;color:var(--ink);background:#fff;resize:vertical}
.editor textarea{font-size:16px;line-height:1.5}
.editor input:focus,.editor textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(23,96,135,.15)}
.editor .note{font-size:13px;color:var(--muted);margin-top:6px}
.editor .ph{display:flex;gap:14px;align-items:center}
.editor .ph img,.editor .ph .initials{font-family:var(--display);width:72px;height:86px;border-radius:8px;object-fit:cover;border:1px solid var(--line);background:var(--fog);font-size:26px}
.editor .ph .btns{display:flex;gap:8px;flex-wrap:wrap}
.editor .ph .btn{padding:7px 12px;font-size:14px}
.editor .ref{border:1px solid var(--line);border-radius:10px;padding:4px 12px 12px;margin-top:10px}
.editor .ref .row{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.editor .ref .row b{font-size:13px}
.editor .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.editor .chip{font:inherit;font-size:13px;background:var(--fog);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:6px 11px;cursor:pointer}
.editor .chip:hover{border-color:var(--sky);background:#fff}
.editor select.pick{width:100%;margin-top:10px;font:inherit;font-size:14px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
.editor .linkish{min-height:32px;padding:0 6px;background:none;border:0;color:#B42318;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.editor footer{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:12px;align-items:center;background:#F7FAFB}
.editor footer .status{font-size:13px;color:var(--muted);flex:1}
.editor footer .status.bad{color:#B42318}
.editor .locked{font-size:13px;color:var(--muted);background:var(--fog);border-radius:8px;padding:10px 12px;margin-top:12px}

@media (max-width:860px){
  .layout{grid-template-columns:minmax(0,1fr);gap:28px}
  .badge{position:static;max-width:420px;margin:0 auto;width:100%}
  .culture,.prompts{grid-template-columns:1fr}
  .highlights blockquote{font-size:20px}
  .resume-frame{display:none}
  .prose{font-size:18px}
  .compare thead{display:none}
  .compare table,.compare tbody,.compare tr,.compare td{display:block;width:100%}
  .compare tr{padding:14px 16px;border-bottom:1px solid var(--line)}
  .compare td{border:0;padding:4px 0}
  .compare td[data-label]::before{content:attr(data-label) ": ";color:var(--muted)}
  .compare .open{padding-top:10px}
  .top .shared{display:none}
}
@media (max-width:480px){
  .top-inner,.context,.main-in,.contact{padding-left:16px;padding-right:16px}
}
@media print{
  .top,.tabs,.contact,.badge .actions,.resume-frame{display:none}
  body{background:#fff}
  .badge{position:static;box-shadow:none;border:1px solid var(--line)}
}
@media (prefers-reduced-motion:no-preference){
  .badge{animation:lift .5s cubic-bezier(.2,.7,.2,1) both}
  @keyframes lift{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand" id="brand"><img class="anura" src="https://images.squarespace-cdn.com/content/v1/671fb0d9fec6997ddc5025cd/79107203-ad2e-4d39-96a6-5faa3f2f70bf/fulllogo_transparent_nobuffer.png" alt="Anura Connect"></div>
    <div class="shared" id="shared"></div>
  </div>
</header>
<main id="app"><p class="loading">Loading…</p></main>

<script>
(function () {
  "use strict";
  var token = (location.pathname.match(/^\/card\/([a-z]+)/) || [])[1] || "";
  var previewId = (location.pathname.match(/^\/cards\/preview\/(\d+)/) || [])[1] || "";
  var sysPath = location.pathname.match(/^\/h\/([a-z]+)\/c\/([a-z]+)/);
  var api = previewId ? "/api/cards/preview/" + previewId : (sysPath ? "/api/hs-public/" + sysPath[1] + "/card/" + sysPath[2] : "/api/card-public/" + token);
  var app = document.getElementById("app");
  var data = null, photoBust = 0;

  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (attrs[k] == null || attrs[k] === false) return;
      if (k === "class") n.className = attrs[k];
      else if (k === "text") n.textContent = attrs[k];
      else if (k.indexOf("on") === 0) n.addEventListener(k.slice(2), attrs[k]);
      else n.setAttribute(k, attrs[k]);
    });
    (kids || []).forEach(function (c) { if (c != null && c !== false) n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return n;
  }
  function first(name) { return String(name || "").split(/\s+/)[0] || "this candidate"; }
  function initials(name) { return String(name || "?").split(/\s+/).filter(Boolean).slice(0, 2).map(function (p) { return p[0].toUpperCase(); }).join(""); }
  function paragraphs(text) {
    return String(text || "").split(/\n{2,}|\n(?=\s*[-•*]\s)/).map(function (p) { return p.trim(); }).filter(Boolean).map(function (p) {
      var node = el("p");
      p.split("\n").forEach(function (line, i) { if (i) node.appendChild(el("br")); node.appendChild(document.createTextNode(line.replace(/^\s*[-•*]\s*/, "• "))); });
      return node;
    });
  }
  function photo(c, cls) {
    if (c.hasPhoto) return el("img", { class: cls, src: api + "/photo/" + c.id + (photoBust ? "?v=" + photoBust : ""), alt: "Photo of " + c.name, loading: "lazy" });
    return el("div", { class: cls + " initials", "aria-hidden": "true", text: initials(c.name) });
  }
  function contactFirst() { return first(data.contact.name); }
  function interviewHref(c) {
    var subject = "Interview: " + c.name + (data.job.title ? " for " + data.job.title : "");
    var body = "Hi " + contactFirst() + ",\n\nI'd like to interview " + c.name + (data.job.title ? " for the " + data.job.title + " role" : "") + ".\n\nTimes that work for me:\n\n\nThanks,";
    return "mailto:" + encodeURIComponent(data.contact.email || "") + "?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(body);
  }

  function seen(page) {
    var fired = false;
    function fire() {
      if (fired || document.visibilityState !== "visible") return;
      fired = true;
      fetch(api + "/seen", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ page: page }), keepalive: true }).catch(function () {});
    }
    setTimeout(fire, 3000);
    document.addEventListener("visibilitychange", function () { setTimeout(fire, 3000); });
  }

  function closedPage(body) {
    var c = body.contact || {};
    var role = body.job && body.job.title ? "the " + body.job.title + " role" : "this role";
    var msg = body.state === "missing"
      ? "This link isn't valid. Check that the whole link was copied from the email."
      : "This Card was shared for " + role + ", which is no longer open, so it has been closed.";
    app.innerHTML = "";
    app.appendChild(el("div", { class: "closed" }, [
      el("h1", { text: body.state === "missing" ? "Link not found" : "This Card is closed" }),
      el("p", { text: msg }),
      c.email ? el("p", {}, ["To see this candidate again, contact ", el("a", { href: "mailto:" + c.email, text: c.name || c.email }), c.phone ? " at " + c.phone : "", "."]) : null,
    ]));
  }

  function badge(c) {
    var facts = el("dl", { class: "facts" }, [
      el("dt", { text: "Available" }), el("dd", { class: c.availability ? "" : "quiet", text: c.availability || "Ask " + contactFirst() }),
      el("dt", { text: "Location" }), el("dd", { class: c.location ? "" : "quiet", text: c.location || "Ask " + contactFirst() }),
      el("dt", { text: "Bill rate" }), el("dd", { class: c.rate ? "" : "quiet", text: c.rate || "Ask " + contactFirst() }),
    ]);
    var actions = el("div", { class: "actions" }, [
      data.contact.email ? el("a", { class: "btn primary", href: interviewHref(c), text: "Request an interview" }) : null,
      c.resumeName ? el("a", { class: "btn plain", href: api + "/resume/" + c.id + "?download=1", text: "Download résumé" }) : null,
    ]);
    return el("aside", { class: "badge", "aria-label": c.name + " at a glance" }, [
      el("div", { class: "slot", "aria-hidden": "true" }),
      el("div", { class: "face" }, [
        photo(c, "photo"),
        el("h2", { text: c.name }),
        c.headline ? el("p", { class: "headline", text: c.headline }) : null,
        c.epicRole ? el("p", { class: "role", text: c.epicRole }) : null,
        c.certs.length ? el("ul", { class: "certs", "aria-label": "Epic certifications" }, c.certs.map(function (x) { return el("li", { text: x }); })) : null,
      ]),
      facts,
      actions,

      whyMe: edit.whyMe, availability: edit.availability, location: edit.location, references: edit.references,
      highlights: edit.highlights.filter(function (h) { return String(h.quote || "").trim(); }),
      documents: edit.documents.map(function (d) { return { fileId: d.fileId, kind: d.kind }; }),
    })
      .then(function () { return put("/api/cards/candidate/" + edit.candidateId + "/live", profile); })
      .then(function () { editDirty = false; setEditStatus("Saved. The client's Card shows this now."); var keep = edit; setTimeout(function () { if (!editDirty) load(); }, 600); data.editable = JSON.parse(JSON.stringify(keep)); })
      .catch(function (e) {
        var msg = e.message;
        if (Array.isArray(e.errors)) msg = e.errors[0];
        else if (e.errors) {
          var k = Object.keys(e.errors)[0];
          var f = (edit.schema || []).filter(function (x) { return x.key === k; })[0];
          msg = (f ? f.label.replace(/…$/, "") + ": " : "") + String(e.errors[k]).replace(/\s*Your recruiter[^.]*\./, "");
        }
        setEditStatus(msg || e.message, true);
      });
  }

  window.addEventListener("beforeunload", function (e) { if (editDirty) { e.preventDefault(); e.returnValue = ""; } });

  function shared() {
    var s = document.getElementById("shared");
    s.innerHTML = "";
    if (data && data.contact && data.contact.name) s.appendChild(el("span", {}, ["Shared by ", el("b", { text: data.contact.name })]));
  }

  function load() {
    var hash = location.hash.slice(1);
    var other = (hash.match(/^c=([a-z]+)$/) || [])[1];
    var url = other ? api + "/c/" + other : api;
    fetch(url, { headers: { Accept: "application/json" } }).then(function (r) {
      return r.json().then(function (body) { return { status: r.status, body: body }; });
    }).then(function (res) {
      if (res.status === 401) { location.href = "/login?next=" + encodeURIComponent(location.pathname); return; }
      if (res.status === 429) { app.innerHTML = '<p class="loading">Too many requests. Try again in a minute.</p>'; return; }
      if (res.body.state !== "active") { data = res.body; shared(); closedPage(res.body); return; }
      data = res.body;
      shared();
      brandHeader();
      render();
      if (previewId) recruiterBar();
      seen(location.hash === "#compare" ? "compare" : (other ? "card:" + other : "card"));
    }).catch(function () {
      app.innerHTML = '<p class="loading">This page didn\'t load. Check your connection and refresh.</p>';
    });
  }

  window.addEventListener("hashchange", function () {
    if (!data || data.state !== "active") return load();
    var hash = location.hash.slice(1);
    if (hash === "compare") { render(); seen("compare"); return; }
    if (hash === "resume") { render(); return; }
    var other = (hash.match(/^c=([a-z]+)$/) || [])[1];
    if ((other || data.sent) !== data.card.id) load(); else render();
  });
  load();
})();
</script>
</body>
</html>
