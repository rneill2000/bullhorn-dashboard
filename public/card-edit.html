<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Your Anura Connect Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{--navy:#0E2E47;--blue:#176087;--sky:#53A2BE;--ink:#102331;--muted:#566B7A;--line:#D7E1E8;--fog:#EEF3F6;--paper:#fff;--bad:#B42318;--ok:#1F7A55;
  --serif:"Source Serif 4",Georgia,serif;--sans:"Public Sans",-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);color:var(--ink);background:var(--fog);font-size:16px;line-height:1.5}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.top{background:var(--paper);border-bottom:1px solid var(--line)}
.top-inner{max-width:1040px;margin:0 auto;padding:14px 24px}
.top img{height:34px}
.wrap{max-width:1040px;margin:0 auto;padding:28px 24px 64px;display:grid;grid-template-columns:1fr 300px;gap:40px;align-items:start}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(24px,3vw,32px);line-height:1.2}
.lede{color:var(--muted);margin-top:8px;max-width:60ch}
.note{margin-top:18px;padding:14px 16px;border-radius:10px;font-size:15px}
.note.warn{background:#FFF6E5;border:1px solid #F5D9A8}
.note.done{background:#E9F6EF;border:1px solid #BFE3CF}
form{margin-top:26px}
fieldset{border:0;margin-bottom:30px}
legend{font-size:14px;font-weight:700;color:var(--blue);margin-bottom:12px}
.field{margin-bottom:18px}
.field label{display:block;font-weight:600;font-size:15px}
.field .hint{font-size:13px;color:var(--muted)}
.field textarea,.field input{width:100%;margin-top:6px;font:inherit;font-family:var(--serif);font-size:17px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);resize:vertical}
.field textarea:focus,.field input:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px rgba(23,96,135,.15)}
.field .meta{display:flex;justify-content:space-between;font-size:13px;margin-top:4px;color:var(--muted)}
.field.has-error textarea,.field.has-error input{border-color:var(--bad)}
.field .err{color:var(--bad)}
.photo-row{display:flex;gap:18px;align-items:center}
.photo-row .ph{width:96px;height:114px;border-radius:9px;object-fit:cover;background:var(--paper);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:34px;color:var(--blue)}
.btn{display:inline-block;font:inherit;font-weight:600;font-size:15px;padding:10px 16px;border-radius:8px;cursor:pointer;border:1px solid var(--line);background:var(--paper);color:var(--blue);text-decoration:none}
.btn:hover{border-color:var(--sky)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:var(--navy)}
.btn[disabled]{opacity:.55;cursor:default}
.btn.link{border:0;background:none;padding:6px 0;color:var(--muted);font-weight:500;text-decoration:underline}
.submit-row{display:flex;gap:16px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:22px}
.status{font-size:14px;color:var(--muted)}
input[type=file]{position:absolute;left:-9999px}

/* live preview: the same badge clients see */
.preview{position:sticky;top:20px}
.preview .label{font-size:13px;color:var(--muted);margin-bottom:8px}
.badge{background:var(--paper);border-radius:14px;box-shadow:0 1px 0 var(--line),0 12px 32px -18px rgba(14,46,71,.45);overflow:hidden;text-align:center}
.badge .slot{width:54px;height:9px;border-radius:9px;background:var(--fog);box-shadow:inset 0 1px 2px rgba(14,46,71,.25);margin:14px auto 0}
.badge .face{padding:16px 24px 20px}
.badge .bp{width:132px;height:158px;margin:0 auto;border-radius:10px;object-fit:cover;background:var(--fog);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:46px;color:var(--blue)}
.badge h2{font-family:var(--serif);font-weight:600;font-size:23px;margin-top:14px;line-height:1.15}
.badge .headline{font-size:14px;color:var(--muted);margin-top:6px;min-height:1em}
.badge .role{margin-top:12px;font-weight:600;color:var(--blue);font-size:14px}
.badge .certs{font-size:13px;margin-top:4px}
.badge .band{background:var(--navy);color:#fff;font-size:12px;padding:8px 24px;display:flex;justify-content:space-between}
.badge .band span:last-child{color:var(--sky)}
.closed{max-width:560px;margin:72px auto;background:var(--paper);border-radius:14px;padding:36px}
.closed h1{margin-bottom:10px}
.closed p{color:var(--muted)}
.loading{text-align:center;color:var(--muted);padding:80px 0}
@media (max-width:860px){.wrap{grid-template-columns:1fr}.preview{position:static;order:-1;max-width:340px;margin:0 auto;width:100%}}
@media (max-width:480px){.wrap,.top-inner{padding-left:16px;padding-right:16px}}
</style>
</head>
<body>
<header class="top"><div class="top-inner"><img src="https://images.squarespace-cdn.com/content/v1/671fb0d9fec6997ddc5025cd/79107203-ad2e-4d39-96a6-5faa3f2f70bf/fulllogo_transparent_nobuffer.png" alt="Anura Connect"></div></header>
<div id="app"><p class="loading">Loading…</p></div>
<script>
(function () {
  "use strict";
  var token = (location.pathname.match(/\/card-edit\/([a-z]+)/) || [])[1] || "";
  var api = "/api/card-edit/" + token;
  var app = document.getElementById("app");
  var state = null, saveTimer = null, photoVersion = Date.now();

  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (attrs[k] == null || attrs[k] === false) return;
      if (k === "class") n.className = attrs[k];
      else if (k === "text") n.textContent = attrs[k];
      else if (k.indexOf("on") === 0) n.addEventListener(k.slice(2), attrs[k]);
      else n.setAttribute(k, attrs[k]);
    });
    (kids || []).forEach(function (c) { if (c != null && c !== false) n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return n;
  }
  function $(id) { return document.getElementById(id); }
  function initials(name) { return String(name || "?").split(/\s+/).filter(Boolean).slice(0, 2).map(function (p) { return p[0].toUpperCase(); }).join(""); }
  function recruiter() { return state.recruiter || "your recruiter"; }

  function photoNode(cls) {
    if (state.hasPhoto) return el("img", { class: cls, src: api + "/photo?v=" + photoVersion, alt: "Your photo" });
    return el("div", { class: cls, "aria-hidden": "true", text: initials(state.candidate.name) });
  }

  function closed() {
    app.innerHTML = "";
    app.appendChild(el("div", { class: "closed" }, [
      el("h1", { text: "This link has expired" }),
      el("p", { text: "Edit links last two weeks. Ask your Anura Connect recruiter for a new one." }),
    ]));
  }

  function setStatus(text) { var s = $("status"); if (s) s.textContent = text; }

  function showErrors(errors) {
    state.errors = errors || {};
    state.schema.forEach(function (f) {
      var wrap = $("f-" + f.key), err = $("e-" + f.key);
      if (!wrap) return;
      var msg = state.errors[f.key] || "";
      wrap.classList.toggle("has-error", !!msg);
      err.textContent = msg;
    });
    var blocked = Object.keys(state.errors).length > 0;
    $("send").disabled = blocked;
  }

  function save() {
    clearTimeout(saveTimer);
    setStatus("Saving…");
    return fetch(api, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(state.fields) })
      .then(function (r) { return r.json().then(function (b) { return { ok: r.ok, status: r.status, b: b }; }); })
      .then(function (res) {
        if (res.status === 410) return closed();
        if (!res.ok) { setStatus(res.b.error || "Not saved. Check your connection."); return; }
        showErrors(res.b.errors);
        state.status = res.b.status;
        setStatus("Saved");
        doneNote(false);
      }).catch(function () { setStatus("Not saved. Check your connection."); });
  }

  function queueSave() { clearTimeout(saveTimer); setStatus("Editing…"); saveTimer = setTimeout(save, 800); }

  function updatePreview() {
    $("pv-headline").textContent = state.fields.headline || "";
    var pv = $("pv-photo");
    var fresh = photoNode("bp");
    fresh.id = "pv-photo";
    pv.replaceWith(fresh);
    var mine = $("my-photo");
    var freshMine = photoNode("ph");
    freshMine.id = "my-photo";
    mine.replaceWith(freshMine);
    $("rm-photo").style.display = state.hasPhoto ? "" : "none";
  }

  /* Shrink on the phone before upload: a 12MP camera photo becomes ~150KB. */
  function resize(file) {
    return new Promise(function (resolve, reject) {
      var img = new Image();
      var url = URL.createObjectURL(file);
      img.onload = function () {
        var max = 900, w = img.naturalWidth, h = img.naturalHeight;
        var scale = Math.min(1, max / Math.max(w, h));
        var c = document.createElement("canvas");
        c.width = Math.round(w * scale); c.height = Math.round(h * scale);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        c.toBlob(function (b) { b ? resolve(b) : reject(new Error("That photo couldn't be read.")); }, "image/jpeg", 0.86);
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error("Use a JPG, PNG or WebP photo.")); };
      img.src = url;
    });
  }

  function upload(file) {
    if (!file) return;
    setStatus("Uploading photo…");
    resize(file).then(function (blob) {
      return fetch(api + "/photo", { method: "POST", headers: { "Content-Type": "image/jpeg" }, body: blob });
    }).then(function (r) { return r.json().then(function (b) { return { ok: r.ok, b: b }; }); })
      .then(function (res) {
        if (!res.ok) { setStatus(res.b.error || "Photo not saved."); return; }
        state.hasPhoto = true; photoVersion = Date.now(); state.status = "editing";
        updatePreview(); setStatus("Photo saved"); doneNote(false);
      }).catch(function (e) { setStatus(e.message || "Photo not saved."); });
  }

  function removePhoto() {
    fetch(api + "/photo", { method: "DELETE" }).then(function (r) { if (r.ok) { state.hasPhoto = false; state.status = "editing"; updatePreview(); setStatus("Photo removed"); doneNote(false); } });
  }

  function submit(e) {
    e.preventDefault();
    clearTimeout(saveTimer);
    save().then(function () {
      if (Object.keys(state.errors || {}).length) return;
      return fetch(api + "/submit", { method: "POST" }).then(function (r) { return r.json().then(function (b) { return { ok: r.ok, b: b }; }); })
        .then(function (res) {
          if (!res.ok) { showErrors(res.b.errors); setStatus(res.b.error || "Not sent."); return; }
          state.status = "submitted"; doneNote(true); setStatus("");
        });
    });
  }

  function doneNote(show) {
    var n = $("done");
    if (!n) return;
    var on = show || state.status === "submitted";
    n.style.display = on ? "" : "none";
    $("send").textContent = state.status === "submitted" ? "Send the update to " + recruiter() : "Send to " + recruiter() + " for review";
  }

  function field(f) {
    var value = state.fields[f.key] || "";
    var input = f.max <= 90
      ? el("input", { id: "i-" + f.key, type: "text", maxlength: String(f.max), value: value })
      : el("textarea", { id: "i-" + f.key, rows: f.max > 400 ? "6" : "3", maxlength: String(f.max) }, [value]);
    var count = el("span", { text: value.length + " / " + f.max });
    input.addEventListener("input", function () {
      state.fields[f.key] = input.value;
      count.textContent = input.value.length + " / " + f.max;
      if (f.key === "headline") $("pv-headline").textContent = input.value;
      queueSave();
    });
    return el("div", { class: "field", id: "f-" + f.key }, [
      el("label", { for: "i-" + f.key, text: f.label }),
      f.hint ? el("div", { class: "hint", text: f.hint }) : null,
      input,
      el("div", { class: "meta" }, [el("span", { class: "err", id: "e-" + f.key, role: "status" }), count]),
    ]);
  }

  function render() {
    var c = state.candidate;
    var expires = new Date(state.expiresAt).toLocaleDateString("en-US", { month: "long", day: "numeric" });
    var file = el("input", { type: "file", id: "file", accept: "image/jpeg,image/png,image/webp", onchange: function (e) { upload(e.target.files[0]); e.target.value = ""; } });
    var about = state.schema.filter(function (f) { return !f.culture; });
    var culture = state.schema.filter(function (f) { return f.culture; });
    app.innerHTML = "";
    app.appendChild(el("div", { class: "wrap" }, [
      el("div", {}, [
        el("h1", { text: "Hi " + (c.firstName || "there") + ", this is your Anura Connect Card" }),
        el("p", { class: "lede", text: "It's the page hiring managers see when we put you forward for a role: your photo, a few lines in your own words, and your résumé. Nothing here goes to a client until " + recruiter() + " reviews it." }),
        state.reviewNote ? el("div", { class: "note warn" }, [el("b", { text: recruiter() + " asked for a change: " }), state.reviewNote]) : null,
        el("div", { class: "note done", id: "done", style: "display:none" }, ["Sent. " + recruiter() + " will look it over before it goes to any client. You can keep editing until " + expires + "."]),
        el("form", { onsubmit: submit, novalidate: "" }, [
          el("fieldset", {}, [
            el("legend", { text: "Your photo" }),
            el("div", { class: "photo-row" }, [
              (function () { var p = photoNode("ph"); p.id = "my-photo"; return p; })(),
              el("div", {}, [
                el("button", { type: "button", class: "btn", text: state.hasPhoto ? "Change photo" : "Add your photo", onclick: function () { $("file").click(); } }), file,
                el("div", {}, [el("button", { type: "button", class: "btn link", id: "rm-photo", onclick: removePhoto, text: "Remove photo", style: state.hasPhoto ? "" : "display:none" })]),
                el("p", { class: "hint", style: "font-size:13px;color:var(--muted);margin-top:4px", text: "A clear, recent headshot. Your LinkedIn photo is perfect." }),
              ]),
            ]),
          ]),
          el("fieldset", {}, [el("legend", { text: "About you" })].concat(about.map(field))),
          el("fieldset", {}, [el("legend", { text: "Culture corner" }), el("p", { class: "hint", style: "font-size:14px;color:var(--muted);margin:-6px 0 14px", text: "Answer any you like. Skipped ones don't show." })].concat(culture.map(field))),
          el("p", { class: "hint", style: "font-size:14px;color:var(--muted);margin-bottom:18px", text: "Leave out phone numbers, emails, links and pay. Your recruiter handles those with the client." }),
          el("div", { class: "submit-row" }, [
            el("button", { type: "submit", class: "btn primary", id: "send", text: "Send to " + recruiter() + " for review" }),
            el("span", { class: "status", id: "status", "aria-live": "polite" }),
          ]),
        ]),
      ]),
      el("div", { class: "preview" }, [
        el("p", { class: "label", text: "What a hiring manager sees" }),
        el("div", { class: "badge" }, [
          el("div", { class: "slot", "aria-hidden": "true" }),
          el("div", { class: "face" }, [
            (function () { var p = photoNode("bp"); p.id = "pv-photo"; return p; })(),
            el("h2", { text: c.name }),
            el("p", { class: "headline", id: "pv-headline", text: state.fields.headline || "" }),
            c.epicRole ? el("p", { class: "role", text: c.epicRole }) : null,
            c.certs.length ? el("p", { class: "certs", text: c.certs.join(", ") }) : null,
          ]),
          el("div", { class: "band", "aria-hidden": "true" }, [el("span", { text: "Anura Connect" }), el("span", { text: "Epic consultant" })]),
        ]),
      ]),
    ]));
    doneNote(false);
    showErrors(state.initialErrors);
  }

  fetch(api).then(function (r) { return r.json().then(function (b) { return { status: r.status, b: b }; }); })
    .then(function (res) {
      if (res.status !== 200 || res.b.state !== "active") return closed();
      state = res.b; state.errors = {}; state.initialErrors = res.b.errors || {};
      render();
    }).catch(function () { app.innerHTML = '<p class="loading">This page didn\'t load. Check your connection and refresh.</p>'; });
})();
</script>
</body>
</html>
