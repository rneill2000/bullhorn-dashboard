<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Your Anura Connect Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0A2239;--blue:#176087;--sky:#53A2BE;--ink:#1A2533;--muted:#5B6E7D;--line:#DCE5EC;--fog:#F2F6F9;--paper:#fff;--bad:#B42318;--ok:#1F7A55;
  --display:Poppins,"Trebuchet MS",system-ui,sans-serif;--sans:"Source Sans 3","Segoe UI",system-ui,-apple-system,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);color:var(--ink);background:var(--fog);font-size:17px;line-height:1.5}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
button{font:inherit;cursor:pointer}

.top{background:var(--paper);border-bottom:1px solid var(--line)}
.top-inner{max-width:1080px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;justify-content:space-between}
.top img{height:40px;width:auto}
.saved{font-size:14px;color:var(--muted);min-height:1em}

.page{max-width:1080px;margin:0 auto;padding:36px 24px 80px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,320px);gap:48px;align-items:start}
.hello h1{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.15;letter-spacing:-.02em;color:var(--navy)}
.hello p{color:var(--muted);margin-top:8px;max-width:52ch}

.progress{display:flex;gap:6px;margin:28px 0 14px}
.stepcount{display:none;font-size:14px;font-weight:700;color:var(--blue);margin:22px 0 -18px}
.progress button{flex:1;background:none;border:0;padding:10px 0;margin:-10px 0;text-align:left;min-height:24px}
.progress .bar{display:block;height:5px;border-radius:5px;background:var(--line);transition:background .2s}
.progress .lbl{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-top:8px}
.progress .done .bar{background:var(--sky)}
.progress .now .bar{background:var(--blue)}
.progress .now .lbl{color:var(--navy)}

.step{background:var(--paper);border-radius:18px;box-shadow:0 28px 60px -32px rgba(7,24,42,.35),0 1px 0 var(--line);padding:32px 34px 26px}
.step h2{font-family:var(--display);font-weight:700;font-size:23px;letter-spacing:-.01em;color:var(--navy)}
.step .sub{color:var(--muted);margin-top:4px}
.step .body{margin-top:24px}
.step .nav{display:flex;justify-content:space-between;align-items:center;margin-top:30px;padding-top:20px;border-top:1px solid var(--fog)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:16px;padding:12px 22px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--blue);text-decoration:none;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--sky)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:var(--navy);border-color:var(--navy)}
.btn[disabled]{opacity:.5;cursor:default}
.btn.text{border:0;background:none;padding:12px 4px;color:var(--muted)}
.btn.text:hover{color:var(--ink)}

/* step 1: photo */
.photo-step{display:flex;gap:30px;align-items:center;flex-wrap:wrap}
.slot{width:168px;height:200px;border-radius:16px;overflow:hidden;flex-shrink:0;background:var(--fog);border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:48px;color:var(--sky)}
.slot.has{border:0;box-shadow:0 12px 28px -16px rgba(7,24,42,.5)}
.slot img{width:100%;height:100%;object-fit:cover}
.photo-acts{display:flex;flex-direction:column;gap:10px;min-width:220px}
.photo-acts .fine{font-size:14px;color:var(--muted)}
.notice{margin-top:18px;padding:12px 14px;border-radius:10px;font-size:15px}
.notice.warn{background:#FFF4E0;color:#7A4B00}
.notice.good{background:#E6F4EC;color:var(--ok)}

/* fields */
.field{margin-bottom:20px}
.field label{display:block;font-weight:700;font-size:15px;margin-bottom:6px}
.field input,.field textarea{width:100%;font:inherit;font-size:17px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);resize:vertical}
.field input::placeholder,.field textarea::placeholder{color:#9AAAB6}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px rgba(23,96,135,.12)}
.field .meta{display:flex;justify-content:space-between;font-size:13px;margin-top:5px;min-height:18px}
.field .count{color:var(--muted);visibility:hidden}
.field .count.near{visibility:visible}
.field .err,.err{color:var(--bad);font-size:14px}
.field.bad input,.field.bad textarea{border-color:var(--bad)}

/* step 3: culture corner */
.counter{font-size:14px;font-weight:600;color:var(--blue);margin-bottom:12px}
.tiles{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.tile{border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:14px 16px;text-align:left;font-size:15px;font-weight:600;color:var(--ink);display:flex;justify-content:space-between;gap:10px;align-items:center;transition:border-color .15s,background .15s}
.tile:hover{border-color:var(--sky);background:#F7FBFD}
.tile .plus{font-family:var(--display);font-weight:700;color:var(--sky);font-size:20px;line-height:1}
.tile[disabled]{opacity:.45;cursor:default}
.answer{grid-column:1/-1;border-radius:14px;background:var(--fog);padding:16px 18px 6px;border-top:4px solid var(--sky)}
.answer:nth-child(4n+2){border-top-color:var(--blue)}
.answer:nth-child(4n+3){border-top-color:var(--navy)}
.answer .head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.answer .head b{font-family:var(--display);font-weight:600;font-size:15px;color:var(--navy)}
.answer .rm{background:none;border:0;color:var(--muted);font-size:14px;text-decoration:underline;min-height:32px;padding:0 6px}
.answer .field{margin-bottom:8px}
.answer textarea{background:var(--paper)}
h3.minor{font-family:var(--display);font-weight:700;font-size:17px;color:var(--navy);margin:30px 0 4px}
.minor-sub{font-size:15px;color:var(--muted);margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px dashed #B8C8D4;background:var(--paper);border-radius:999px;padding:8px 14px;font-size:15px;color:var(--blue);font-weight:600}
.chip:hover{border-style:solid;border-color:var(--sky)}
.fact{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.fact .k{width:150px;flex-shrink:0;font-weight:700;font-size:15px}
.fact input{flex:1;min-width:0;font:inherit;font-size:16px;padding:9px 12px;border:1px solid var(--line);border-radius:999px}
.fact input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px rgba(23,96,135,.12)}
.fact .x{background:none;border:0;color:var(--muted);font-size:20px;line-height:1;min-width:36px;min-height:36px}

/* step 4 + preview: the Card */
.badge{background:var(--paper);border-radius:16px;box-shadow:0 28px 60px -28px rgba(7,24,42,.45),0 1px 0 var(--line);overflow:hidden;text-align:center}
.badge .slotline{width:52px;height:8px;border-radius:8px;background:var(--fog);box-shadow:inset 0 1px 2px rgba(7,24,42,.2);margin:14px auto 0}
.badge .face{padding:16px 22px 20px}
.badge .bp{width:118px;height:140px;margin:0 auto;border-radius:12px;object-fit:cover;background:var(--fog);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:38px;color:var(--sky)}
.badge .nm{font-family:var(--display);font-weight:800;font-size:21px;letter-spacing:-.02em;color:var(--navy);margin-top:14px;line-height:1.15}
.badge .hl{font-size:15px;color:var(--muted);margin-top:4px;min-height:1.2em}
.badge .role{font-weight:700;color:var(--blue);font-size:15px;margin-top:10px}
.badge .certs{font-size:14px}
.badge .band{background:var(--navy);color:#fff;font-size:12px;padding:8px 22px;display:flex;justify-content:space-between}
.badge .band span:last-child{color:#A9C7D6}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.pv-label{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:10px}
.pv-extra{margin-top:16px}
.pv-facts{display:flex;flex-wrap:wrap;gap:6px}
.pv-facts span{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px}
.pv-facts b{font-weight:600}
.pv-prompt{margin-top:12px;background:var(--paper);border-radius:12px;padding:12px 14px;border-top:3px solid var(--sky);font-size:15px}
.pv-prompt .q{font-size:12px;font-weight:700;color:var(--blue);font-family:var(--display)}
.preview{position:sticky;top:24px}

.review{display:grid;grid-template-columns:240px 1fr;gap:28px;align-items:start}
.review .story h3{font-family:var(--display);font-weight:700;font-size:15px;color:var(--navy);margin:0 0 6px}
.review .story > div{margin-bottom:18px}
.review .story p{color:var(--ink)}
.review .empty{color:#9AAAB6;font-style:italic}
.review .grid{display:grid;grid-template-columns:1fr;gap:8px}
.sent{text-align:center;padding:12px 0 4px}
.sent .check{width:56px;height:56px;border-radius:50%;background:#E6F4EC;color:var(--ok);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-family:var(--display);font-weight:800;font-size:26px}
.sent h2{margin-bottom:6px}

.closed{max-width:520px;margin:80px auto;background:var(--paper);border-radius:18px;padding:36px;text-align:center;box-shadow:0 1px 0 var(--line)}
.closed h1{font-family:var(--display);font-weight:800;font-size:24px;color:var(--navy);margin-bottom:8px}
.closed p{color:var(--muted)}
.loading{text-align:center;color:var(--muted);padding:100px 0}
input[type=file]{position:absolute;left:-9999px}

@media (max-width:900px){
  .page{grid-template-columns:minmax(0,1fr);gap:24px;padding:24px 16px 60px}
  .preview{display:none}
  .step{padding:24px 20px 20px}
  .tiles{grid-template-columns:minmax(0,1fr)}
  .review{grid-template-columns:1fr}
  .review .badge{max-width:300px;margin:0 auto}
  .fact .k{width:110px}
  .hello h1{font-size:25px}
  .progress .lbl{display:none}
  .stepcount{display:block}
  .step .nav{position:sticky;bottom:0;background:var(--paper);margin:24px -20px -20px;padding:12px 20px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);border-radius:0 0 18px 18px;z-index:5}
  .step .nav .btn.primary{flex:1;max-width:260px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="top-inner">
  <img src="https://images.squarespace-cdn.com/content/v1/671fb0d9fec6997ddc5025cd/79107203-ad2e-4d39-96a6-5faa3f2f70bf/fulllogo_transparent_nobuffer.png" alt="Anura Connect">
  <span class="saved" id="saved" aria-live="polite"></span>
</div></header>
<main id="app"><p class="loading">Loading…</p></main>
<script>
(function () {
  "use strict";
  var token = (location.pathname.match(/\/card-edit\/([a-z]+)/) || [])[1] || "";
  var api = "/api/card-edit/" + token;
  var app = document.getElementById("app");
  var S = null, saveTimer = null, photoV = Date.now(), step = 1, openPrompts = [], openFacts = [];
  var STEPS = ["Photo", "About you", "Culture corner", "Review"];
  var PROMPT_EX = {
    outside: "e.g. Coaching my daughter's hockey team and losing at trivia night.",
    team: "e.g. Asks the question everyone's thinking in the go-live huddle.",
    why: "e.g. A small build change can save a nurse ten minutes every shift.",
    golive: "e.g. 3 a.m., labels printing upside down, and a lab director who brought donuts anyway.",
    goodat: "e.g. Reading a crowded whiteboard from across the room.",
    askme: "e.g. The time I trained 40 super users in one weekend.",
    saturday: "e.g. Farmers market, a long bike ride, and a Badgers game.",
    advice: "e.g. Ask the person doing the work before you build anything.",
    proud: "e.g. Cut our lab's specimen relabels in half.",
    fun: "e.g. I've driven to every Big Ten stadium.",
  };
  var EX = {
    headline: "e.g. Beaker analyst who's happiest at the lab bench",
    intro: "e.g. I build Epic the way the people using it actually work. My best fixes usually come from an afternoon next to a nurse or a tech, not a design session.",
  };

  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      var v = attrs[k];
      if (v == null || v === false) return;
      if (k === "class") n.className = v;
      else if (k === "text") n.textContent = v;
      else if (k.indexOf("on") === 0) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v);
    });
    (kids || []).forEach(function (c) { if (c != null && c !== false) n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return n;
  }
  function $(id) { return document.getElementById(id); }
  function initials(n) { return String(n || "?").split(/\s+/).filter(Boolean).slice(0, 2).map(function (p) { return p[0].toUpperCase(); }).join(""); }
  function recruiter() { return S.recruiter || "your recruiter"; }
  function schema(kind) { return S.schema.filter(function (f) { return f.kind === kind; }); }
  function setSaved(t) { $("saved").textContent = t || ""; }

  /* ── saving ── */
  function save() {
    clearTimeout(saveTimer);
    setSaved("Saving…");
    return fetch(api, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(S.fields) })
      .then(function (r) { return r.json().then(function (b) { return { r: r, b: b }; }); })
      .then(function (x) {
        if (x.r.status === 410) return closed();
        if (!x.r.ok) { setSaved(x.b.error || "Not saved. Check your connection."); return; }
        S.errors = x.b.errors || {}; S.status = x.b.status;
        setSaved("All changes saved");
        paintErrors();
      }).catch(function () { setSaved("Not saved. Check your connection."); });
  }
  function queue() { clearTimeout(saveTimer); setSaved("Saving…"); saveTimer = setTimeout(save, 700); }

  function paintErrors() {
    S.schema.forEach(function (f) {
      var e = $("e-" + f.key), w = $("w-" + f.key);
      if (e) e.textContent = (S.errors || {})[f.key] || "";
      if (w) w.classList.toggle("bad", !!(S.errors || {})[f.key]);
    });
    var pe = $("e-_prompts"); if (pe) pe.textContent = (S.errors || {})._prompts || "";
    var send = $("send"); if (send) send.disabled = Object.keys(S.errors || {}).length > 0;
    var why = $("send-why"); if (why) why.textContent = Object.keys(S.errors || {}).length ? "Fix the highlighted answers first. Leave out phone numbers, emails, links and pay." : "";
  }

  /* ── one input ── */
  function field(f, opts) {
    opts = opts || {};
    var v = S.fields[f.key] || "";
    var input = f.max > 90
      ? el("textarea", { id: "i-" + f.key, rows: opts.rows || (f.max > 400 ? "5" : "3"), maxlength: String(f.max), placeholder: opts.placeholder || "", "aria-label": opts.aria || null }, [v])
      : el("input", { id: "i-" + f.key, type: "text", maxlength: String(f.max), value: v, placeholder: opts.placeholder || "", "aria-label": opts.aria || null });
    var count = el("span", { class: "count", text: v.length + " / " + f.max });
    function upd() { count.textContent = input.value.length + " / " + f.max; count.classList.toggle("near", input.value.length > f.max * 0.8); }
    upd();
    input.addEventListener("input", function () { S.fields[f.key] = input.value; upd(); queue(); preview(); });
    return el("div", { class: "field", id: "w-" + f.key }, [
      opts.noLabel ? null : el("label", { for: "i-" + f.key, text: opts.label || f.label }),
      input,
      el("div", { class: "meta" }, [el("span", { class: "err", id: "e-" + f.key }), count]),
    ]);
  }

  /* ── photo ── */
  function photoEl(cls) {
    if (S.hasPhoto) return el("div", { class: cls + " has" }, [el("img", { src: api + "/photo?v=" + photoV, alt: "Your photo" })]);
    return el("div", { class: cls, "aria-hidden": "true", text: initials(S.candidate.name) });
  }
  function shrink(file) {
    return new Promise(function (resolve, reject) {
      var img = new Image(), url = URL.createObjectURL(file);
      img.onload = function () {
        var k = Math.min(1, 900 / Math.max(img.naturalWidth, img.naturalHeight));
        var c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
        c.toBlob(function (b) { b ? resolve(b) : reject(new Error("That photo couldn't be read.")); }, "image/jpeg", 0.86);
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error("Use a JPG, PNG or WebP photo.")); };
      img.src = url;
    });
  }
  function upload(file) {
    if (!file) return;
    setSaved("Uploading photo…");
    shrink(file).then(function (b) { return fetch(api + "/photo", { method: "POST", headers: { "Content-Type": "image/jpeg" }, body: b }); })
      .then(function (r) { return r.json().then(function (b) { if (!r.ok) throw new Error(b.error || "Photo not saved."); }); })
      .then(function () { S.hasPhoto = true; S.photoNote = ""; photoV = Date.now(); S.status = "editing"; setSaved("Photo saved"); draw(); })
      .catch(function (e) { setSaved(e.message); });
  }
  function removePhoto() {
    fetch(api + "/photo", { method: "DELETE" }).then(function (r) { if (r.ok) { S.hasPhoto = false; S.photoNote = ""; setSaved("Photo removed"); draw(); } });
  }

  /* ── steps ── */
  function stepPhoto() {
    var file = el("input", { type: "file", id: "file", "aria-label": "Photo file", accept: "image/jpeg,image/png,image/webp", onchange: function (e) { upload(e.target.files[0]); e.target.value = ""; } });
    var mismatch = S.photoNote && /match/.test(S.photoNote);
    return [
      el("h2", { text: "Add your photo" }),
      el("p", { class: "sub", text: "People remember a face. A clear, recent headshot works best." }),
      el("div", { class: "body" }, [
        el("div", { class: "photo-step" }, [
          photoEl("slot"),
          el("div", { class: "photo-acts" }, [
            el("button", { type: "button", class: "btn primary", text: S.hasPhoto ? "Upload a different photo" : "Upload a photo", onclick: function () { $("file").click(); } }), file,
            S.linkedinEnabled ? el("a", { class: "btn", href: "/card-edit/" + token + "/linkedin", text: "Use my LinkedIn photo" }) : null,
            S.hasPhoto ? el("button", { type: "button", class: "btn text", text: "Remove photo", onclick: removePhoto }) : null,
            S.linkedinEnabled ? el("p", { class: "fine", text: "LinkedIn shares only a small version, so a photo from your phone will look sharper." }) : null,
          ]),
        ]),
        mismatch ? el("div", { class: "notice warn", text: "That photo came from a LinkedIn account with a different name. If it isn't you, remove it and try again." }) : null,
        S.photoNote && /Small photo/.test(S.photoNote) ? el("div", { class: "notice warn", text: "LinkedIn only sent us a small version, so it may look blurry. If you have a sharper headshot on your phone or computer, upload that instead." }) : null,
      ]),
    ];
  }
  function stepAbout() {
    var a = schema("about");
    return [
      el("h2", { text: "Introduce yourself" }),
      el("p", { class: "sub", text: "Two short things a hiring manager reads first. Write it the way you'd say it." }),
      el("div", { class: "body" }, a.map(function (f) { return field(f, { placeholder: EX[f.key] || "", rows: f.key === "intro" ? "5" : null }); })),
    ];
  }
  function stepCulture() {
    var max = S.maxPrompts || 4;
    var prompts = schema("prompt");
    var shown = prompts.filter(function (f) { return String(S.fields[f.key] || "").trim() || openPrompts.indexOf(f.key) >= 0; });
    var left = prompts.filter(function (f) { return shown.indexOf(f) < 0; });
    var tiles = el("div", { class: "tiles" }, shown.map(function (f) {
      return el("div", { class: "answer" }, [
        el("div", { class: "head" }, [el("b", { text: f.label }), el("button", { type: "button", class: "rm", text: "Remove", onclick: function () {
          S.fields[f.key] = ""; openPrompts = openPrompts.filter(function (k) { return k !== f.key; }); queue(); draw();
        } })]),
        field(f, { noLabel: true, rows: "3", aria: f.label, placeholder: PROMPT_EX[f.key] || "" }),
      ]);
    }).concat(left.map(function (f) {
      return el("button", { type: "button", class: "tile", disabled: shown.length >= max ? "" : null, onclick: function () {
        openPrompts.push(f.key); draw(); var t = $("i-" + f.key); if (t) t.focus();
      } }, [el("span", { text: f.label }), el("span", { class: "plus", "aria-hidden": "true", text: "+" })]);
    })));
    var facts = schema("fact");
    var factShown = facts.filter(function (f) { return String(S.fields[f.key] || "").trim() || openFacts.indexOf(f.key) >= 0; });
    var factLeft = facts.filter(function (f) { return factShown.indexOf(f) < 0; });
    return [
      el("h2", { text: "Culture corner" }),
      el("p", { class: "sub", text: "The part that makes you more than a résumé. Pick up to " + max + " prompts and answer like you'd tell a new teammate." }),
      el("div", { class: "body" }, [
        el("p", { class: "counter", text: shown.length + " of " + max + " picked" }),
        tiles,
        el("p", { class: "err", id: "e-_prompts" }),
        el("h3", { class: "minor", text: "Quick facts" }),
        el("p", { class: "minor-sub", text: "Short ones. They show as little tags on your Card." }),
        el("div", {}, factShown.map(function (f) {
          var input = el("input", { type: "text", id: "i-" + f.key, maxlength: String(f.max), value: S.fields[f.key] || "", "aria-label": f.label });
          input.addEventListener("input", function () { S.fields[f.key] = input.value; queue(); preview(); });
          return el("div", {}, [
            el("div", { class: "fact", id: "w-" + f.key }, [el("span", { class: "k", text: f.label }), input,
              el("button", { type: "button", class: "x", "aria-label": "Remove " + f.label, text: "×", onclick: function () {
                S.fields[f.key] = ""; openFacts = openFacts.filter(function (k) { return k !== f.key; }); queue(); draw();
              } })]),
            el("p", { class: "err", id: "e-" + f.key }),
          ]);
        })),
        factLeft.length ? el("div", { class: "chips" }, factLeft.map(function (f) {
          return el("button", { type: "button", class: "chip", text: "+ " + f.label, onclick: function () { openFacts.push(f.key); draw(); var t = $("i-" + f.key); if (t) t.focus(); } });
        })) : null,
      ]),
    ];
  }
  function stepReview() {
    if (S.status === "submitted") {
      var until = new Date(S.expiresAt).toLocaleDateString("en-US", { month: "long", day: "numeric" });
      return [el("div", { class: "sent" }, [
        el("div", { class: "check", "aria-hidden": "true", text: "✓" }),
        el("h2", { text: "Sent to " + recruiter() }),
        el("p", { class: "sub", text: "They'll look it over before it goes to any client. You can still make changes until " + until + "; just send it again." }),
      ])];
    }
    var f = S.fields;
    var answered = schema("prompt").filter(function (p) { return f[p.key]; });
    return [
      el("h2", { text: "Look it over" }),
      el("p", { class: "sub", text: "This is what a hiring manager sees. Nothing goes to a client until " + recruiter() + " reviews it." }),
      S.reviewNote ? el("div", { class: "notice warn" }, [el("b", { text: recruiter() + " asked for a change: " }), S.reviewNote]) : null,
      el("div", { class: "body review" }, [
        badge(),
        el("div", { class: "story" }, [
          el("div", {}, [el("h3", { text: "In your words" }), f.intro ? el("p", { text: f.intro }) : el("p", { class: "empty", text: "Not filled in yet" })]),
          el("div", {}, [el("h3", { text: "Culture corner" }), answered.length ? el("div", { class: "grid" }, answered.map(function (p) {
            return el("div", { class: "pv-prompt" }, [el("div", { class: "q", text: p.label }), el("div", { text: f[p.key] })]);
          })) : el("p", { class: "empty", text: "No prompts picked yet" })]),
          factsEl(),
        ]),
      ]),
    ];
  }

  function factsEl() {
    var fs = schema("fact").filter(function (x) { return S.fields[x.key]; });
    if (!fs.length) return null;
    return el("div", { class: "pv-facts" }, fs.map(function (x) { return el("span", {}, [x.label + " ", el("b", { text: S.fields[x.key] })]); }));
  }
  function badge() {
    var c = S.candidate;
    var ph = S.hasPhoto ? el("img", { class: "bp", src: api + "/photo?v=" + photoV, alt: "" }) : el("div", { class: "bp", text: initials(c.name) });
    return el("div", { class: "badge" }, [
      el("div", { class: "slotline", "aria-hidden": "true" }),
      el("div", { class: "face" }, [ph,
        el("p", { class: "nm", text: c.name }),
        el("p", { class: "hl", id: "pv-hl", text: S.fields.headline || "" }),
        c.epicRole ? el("p", { class: "role", text: c.epicRole }) : null,
        c.certs.length ? el("p", { class: "certs", text: c.certs.join(", ") }) : null,
      ]),
      el("div", { class: "band", "aria-hidden": "true" }, [el("span", { text: "Anura Connect" }), el("span", { text: "Epic consultant" })]),
    ]);
  }

  function preview() {
    var box = $("preview");
    if (!box) return;
    box.innerHTML = "";
    var first = schema("prompt").filter(function (p) { return S.fields[p.key]; })[0];
    box.appendChild(el("p", { class: "pv-label", text: "What a hiring manager sees" }));
    box.appendChild(badge());
    var extra = el("div", { class: "pv-extra" }, [factsEl(), first ? el("div", { class: "pv-prompt" }, [el("div", { class: "q", text: first.label }), el("div", { text: S.fields[first.key] })]) : null]);
    box.appendChild(extra);
  }

  function go(n) { step = Math.max(1, Math.min(4, n)); history.replaceState(null, "", location.pathname + "#step=" + step); draw(); window.scrollTo(0, 0); }

  function draw() {
    var c = S.candidate;
    var body = [stepPhoto, stepAbout, stepCulture, stepReview][step - 1]();
    var nav;
    if (step < 4) {
      var label = step === 1 && !S.hasPhoto ? "Skip for now" : "Continue";
      nav = el("div", { class: "nav" }, [
        step > 1 ? el("button", { type: "button", class: "btn text", text: "Back", onclick: function () { go(step - 1); } }) : el("span"),
        el("button", { type: "button", class: "btn primary", text: label, onclick: function () { save(); go(step + 1); } }),
      ]);
    } else if (S.status !== "submitted") {
      nav = el("div", { class: "nav" }, [
        el("button", { type: "button", class: "btn text", text: "Back", onclick: function () { go(3); } }),
        el("div", { style: "text-align:right" }, [
          el("button", { type: "button", class: "btn primary", id: "send", text: "Send to " + recruiter(), onclick: submit }),
          el("p", { class: "err", id: "send-why", style: "margin-top:8px;max-width:340px" }),
        ]),
      ]);
    } else {
      nav = el("div", { class: "nav" }, [el("button", { type: "button", class: "btn text", text: "Keep editing", onclick: function () { S.status = "editing"; go(1); } }), el("span")]);
    }
    app.innerHTML = "";
    app.appendChild(el("div", { class: "page" }, [
      el("div", {}, [
        el("div", { class: "hello" }, [
          el("h1", { text: "Let's set up your Card, " + (c.firstName || "there") + "." }),
          el("p", { text: "It's the one-page profile hiring managers see when Anura puts you forward. About five minutes." }),
        ]),
        el("p", { class: "stepcount", "aria-hidden": "true", text: "Step " + step + " of 4: " + STEPS[step - 1] }),
        el("nav", { class: "progress", "aria-label": "Step " + step + " of 4" }, STEPS.map(function (s, i) {
          var n = i + 1;
          return el("button", { type: "button", "aria-label": "Step " + n + ": " + s, class: n < step ? "done" : (n === step ? "now" : ""), "aria-current": n === step ? "step" : null, onclick: function () { save(); go(n); } },
            [el("span", { class: "bar" }), el("span", { class: "lbl", text: s })]);
        })),
        el("section", { class: "step", "aria-label": STEPS[step - 1] }, body.concat([nav])),
      ]),
      el("aside", { class: "preview", id: "preview" }),
    ]));
    preview();
    paintErrors();
  }

  function submit() {
    clearTimeout(saveTimer);
    save().then(function () {
      if (Object.keys(S.errors || {}).length) return;
      return fetch(api + "/submit", { method: "POST" }).then(function (r) { return r.json().then(function (b) { return { r: r, b: b }; }); })
        .then(function (x) {
          if (!x.r.ok) { S.errors = x.b.errors || S.errors; paintErrors(); setSaved(x.b.error || "Not sent."); return; }
          S.status = "submitted"; setSaved(""); draw();
        });
    });
  }

  function closed() {
    app.innerHTML = "";
    app.appendChild(el("div", { class: "closed" }, [
      el("h1", { text: "This link has expired" }),
      el("p", { text: "Edit links last two weeks. Ask your Anura Connect recruiter for a new one." }),
    ]));
  }

  fetch(api).then(function (r) { return r.json().then(function (b) { return { r: r, b: b }; }); })
    .then(function (x) {
      if (x.r.status !== 200 || x.b.state !== "active") return closed();
      S = x.b; S.errors = x.b.errors || {};
      var m = location.hash.match(/step=(\d)/);
      step = m ? Number(m[1]) : (S.status === "submitted" ? 4 : 1);
      var li = new URLSearchParams(location.search).get("li");
      if (li) {
        step = 1;
        history.replaceState(null, "", location.pathname + "#step=1");
        setSaved({
          ok: "LinkedIn photo added",
          othername: "Photo added from a LinkedIn account with a different name",
          nophoto: "Your LinkedIn profile has no photo. Upload one instead.",
          cancel: "LinkedIn sign-in cancelled",
          off: "LinkedIn isn't connected yet. Upload a photo instead.",
          error: "LinkedIn didn't send the photo. Try again or upload one.",
        }[li] || "");
      }
      draw();
    }).catch(function () { app.innerHTML = '<p class="loading">This page didn\'t load. Check your connection and refresh.</p>'; });
})();
</script>
</body>
</html>
