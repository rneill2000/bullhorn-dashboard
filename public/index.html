function eField(name, label, value, type) {
  type = type || "text";
  var val = (value === null || value === undefined) ? "" : value;
  return '<div class="edit-field"><label for="edit-' + name + '">' + esc(label) + '</label>' +
    '<input type="' + type + '" id="edit-' + name + '" value="' + esc(String(val)) + '"></div>';
}

function eFieldSelect(name, label, value, options) {
  var h = '<div class="edit-field"><label for="edit-' + name + '">' + esc(label) + '</label><select id="edit-' + name + '">';
  options.forEach(function(o) {
    var optVal = Array.isArray(o) ? o[0] : o;
    var optLabel = Array.isArray(o) ? o[1] : o;
    var sel = (String(value) === String(optVal)) ? ' selected' : '';
    h += '<option value="' + esc(optVal) + '"' + sel + '>' + esc(optLabel || "(none)") + '</option>';
  });
  h += '</select></div>';
  return h;
}

function formatDateForInput(dateStr) {
  if (!dateStr || dateStr === "—") return "";
  try {
    var d = new Date(dateStr);
    if (isNaN(d.getTime())) return "";
    return d.toISOString().split("T")[0];
  } catch(e) { return ""; }
}

function saveCandidateProfile(candidateId) {
  var btn = document.getElementById("edit-save-btn");
  if (!btn) return;
  btn.textContent = "Saving...";
  btn.disabled = true;

  // Collect all field values
  var fields = [
    "firstName","lastName","middleName","nickName","occupation","companyName",
    "status","employeeType","email","email2","phone","phone2","phone3","mobile",
    "address1","address2","city","state","zip",
    "customText1","customText2","customText3","customText4","customText5",
    "customText6","customText7","customText8","customText9","customText10",
    "salary","hourlyRate","dayRate","dateAvailable","willRelocate","travelLimit",
    "educationDegree","source"
  ];

  var updates = {};
  fields.forEach(function(f) {
    var el = document.getElementById("edit-" + f);
    if (!el) return;
    var val = el.value.trim();

    // Skip empty values (don't overwrite with blank unless it was already empty)
    if (val === "") return;

    // Type conversions
    if (f === "willRelocate") {
      updates[f] = (val === "true");
    } else if (f === "salary" || f === "hourlyRate" || f === "dayRate" || f === "travelLimit") {
      var num = parseFloat(val);
      if (!isNaN(num)) updates[f] = num;
    } else if (f === "dateAvailable") {
      updates[f] = new Date(val).getTime();
    } else {
      updates[f] = val;
    }
  });

  // Owner (association field — sent as ownerId)
  var ownerSel = document.getElementById("edit-ownerId");
  if (ownerSel && ownerSel.value) {
    updates.ownerId = parseInt(ownerSel.value);
  }

  // Text blocks
  var tb1 = document.getElementById("edit-customTextBlock1");
  if (tb1) updates.customTextBlock1 = tb1.value;
  var desc = document.getElementById("edit-description");
  if (desc) updates.description = desc.value;

  apiFetch("candidates/" + candidateId + "/update", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(updates)
  }).then(function(r) {
    if (r.success) {
      // Show success briefly, then reload the profile
      btn.textContent = "Saved!";
      btn.style.background = "#16a34a";
      setTimeout(function() {
        openDetail(candidateId, {});
      }, 800);
    } else {
      btn.textContent = "Error: " + (r.error || "Unknown");
      btn.style.background = "#ef4444";
      btn.disabled = false;
      setTimeout(function() { btn.textContent = "Save Changes"; btn.style.background = "#16a34a"; }, 3000);
    }
  }).catch(function(e) {
    btn.textContent = "Error saving";
    btn.style.background = "#ef4444";
    btn.disabled = false;
    setTimeout(function() { btn.textContent = "Save Changes"; btn.style.background = "#16a34a"; }, 3000);
  });
}

// ── DETAIL PANEL ACTIONS ──
function showAddNoteForm() {
  var el = document.getElementById("detail-add-note");
  if(el) { el.style.display = "block"; el.scrollIntoView({behavior:"smooth"}); }
}

function submitNote() {
  var c = window._lastDetailCandidate;
  if(!c) return;
  var action = document.getElementById("note-action-select").value;
  var comments = document.getElementById("note-comments-input").value;
  if(!comments.trim()) { alert("Please enter note text"); return; }

  var btn = event.target;
  btn.textContent = "Saving...";
  btn.disabled = true;

  apiFetch("candidates/" + c.id + "/notes", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ action: action, comments: comments })
  }).then(function(r) {
    btn.textContent = "Saved!";
    btn.style.background = "#16a34a";
    document.getElementById("note-comments-input").value = "";
    // Refresh the detail panel after a beat
    setTimeout(function() { openDetail(c.id, c); }, 800);
  }).catch(function(e) {
    btn.textContent = "Error";
    btn.style.background = "#dc2626";
    alert("Failed to save note: " + e.message);
    setTimeout(function() { btn.textContent = "Save Note"; btn.disabled = false; btn.style.background = "#16a34a"; }, 2000);
  });
}

function showSubmitForm() {
  var el = document.getElementById("detail-submit-job");
  if(el) { el.style.display = "block"; el.scrollIntoView({behavior:"smooth"}); }
  // Pre-populate submission notes template with candidate data
  var c = window._lastDetailCandidate;
  var ta = document.getElementById("submit-comments-input");
  if (c && ta && !ta.value.trim()) {
    var name = ((c.firstName || "") + " " + (c.lastName || "")).trim();
    var avail = c.available || "";
    var pay = c.hourlyRate ? "$" + c.hourlyRate + "/hr" : (c.salaryLow ? "$" + Number(c.salaryLow).toLocaleString() : "");
    ta.value = "Candidate Name: " + name + "\nWhy Me: \nAvailability Date: " + avail + "\nPay Rate: " + pay + "\nBill Rate: ";
  }
  // Also pre-fill the availability date field if we have it
  if (c && c.available) {
    var ad = document.getElementById("submit-avail-date");
    if (ad && !ad.value) {
      // Try to parse the date into YYYY-MM-DD for the date input
      try {
        var parsed = new Date(c.available);
        if (!isNaN(parsed.getTime())) {
          ad.value = parsed.toISOString().split("T")[0];
        }
      } catch(e) {}
    }
  }
  // Pre-fill pay rate if available
  if (c && c.hourlyRate) {
    var pr = document.getElementById("submit-pay-rate");
    if (pr && !pr.value) pr.value = c.hourlyRate;
  }
  // Load team members for notify picker & reset tagged list
  window._notifyTagged = [];
  window._notifyUsers = [];
  var taggedEl = document.getElementById("notify-tagged");
  if (taggedEl) taggedEl.innerHTML = "";
  var searchEl = document.getElementById("notify-search");
  if (searchEl) searchEl.value = "";
  apiFetch("users").then(function(r) {
    window._notifyUsers = (r.data || []).filter(function(u) { return u.email; });
    renderNotifyDropdown(window._notifyUsers);
  }).catch(function() {});
  // Load open jobs into the dropdown
  var sel = document.getElementById("submit-job-select");
  if(sel) {
    sel.innerHTML = '<option value="">Loading jobs...</option>';
    apiFetch("jobs?status=Accepting+Candidates").then(function(r) {
      var jobs = r.data || [];
      if(jobs.length === 0) {
        // Try "Open" as fallback
        return apiFetch("jobs?status=Open").then(function(r2) { return r2.data || []; });
      }
      return jobs;
    }).then(function(jobs) {
      var opts = '<option value="">Select a job...</option>';
      jobs.forEach(function(j) {
        opts += '<option value="'+j.id+'">'+esc(j.title||"Job #"+j.id)+' — '+esc(j.client||"")+(j.status?' ['+esc(j.status)+']':'')+'</option>';
      });
      sel.innerHTML = opts;
    }).catch(function(e) {
      sel.innerHTML = '<option value="">Failed to load jobs</option>';
    });
  }
}

function renderNotifyDropdown(users) {
  var dd = document.getElementById("notify-dropdown");
  if (!dd) return;
  var h = "";
  users.forEach(function(u) {

function filterNotifyUsers() {

    return u.name.toLowerCase().indexOf(q) !== -1 || u.email.toLowerCase().indexOf(q) !== -1;
  });
  renderNotifyDropdown(filtered);
  var dd = document.getElementById("notify-dropdown");
  if (dd) dd.classList.add("show");
}

function showNotifyDropdown() {
  var dd = document.getElementById("notify-dropdown");
  if (dd) { renderNotifyDropdown(window._notifyUsers || []); dd.classList.add("show"); }
}

function tagNotifyUser(userId) {
  var user = (window._notifyUsers || []).find(function(u) { return u.id === userId; });
  if (!user) return;
  if (!window._notifyTagged) window._notifyTagged = [];
  if (window._notifyTagged.some(function(t) { return t.id === userId; })) return;
  window._notifyTagged.push(user);
  renderTaggedChips();
  renderNotifyDropdown(window._notifyUsers || []);
  var inp = document.getElementById("notify-search");
  if (inp) inp.value = "";
}

function removeNotifyTag(userId) {
  window._notifyTagged = (window._notifyTagged || []).filter(function(t) { return t.id !== userId; });
  renderTaggedChips();
  renderNotifyDropdown(window._notifyUsers || []);
}

function renderTaggedChips() {
  var el = document.getElementById("notify-tagged");
  if (!el) return;
  var h = "";
  (window._notifyTagged || []).forEach(function(u) {
    h += '<span class="tagged-chip"><span>' + esc(u.name) + '</span><span class="chip-x" onclick="removeNotifyTag(' + u.id + ')">×</span></span>';

  el.innerHTML = h;
}

function confirmSubmitToJob() {
  var c = window._lastDetailCandidate;
  if(!c) return;
  var jobSel = document.getElementById("submit-job-select");
  var jobId = jobSel.value;
  var jobText = jobSel.options[jobSel.selectedIndex] ? jobSel.options[jobSel.selectedIndex].text : "";
  var payRate = document.getElementById("submit-pay-rate").value.trim();
  var billRate = document.getElementById("submit-bill-rate").value.trim();
  var availDate = document.getElementById("submit-avail-date").value;
  var comments = document.getElementById("submit-comments-input").value;
  if(!jobId) { alert("Please select a job"); return; }

  var confEl = document.getElementById("submit-confirmation");
  var btn = document.getElementById("submit-job-btn");
  // Show confirmation summary
  var summary = '<div style="font-weight:600;margin-bottom:8px;color:#7c3aed">Please confirm submission:</div>';
  summary += '<div><strong>Candidate:</strong> ' + esc((c.firstName||"") + " " + (c.lastName||"")) + '</div>';
  summary += '<div><strong>Job:</strong> ' + esc(jobText) + '</div>';
  if(payRate) summary += '<div><strong>Pay Rate:</strong> $' + esc(payRate) + '/hr</div>';
  if(billRate) summary += '<div><strong>Bill Rate:</strong> $' + esc(billRate) + '/hr</div>';
  if(payRate && billRate) {
    var margin = parseFloat(billRate) - parseFloat(payRate);
    summary += '<div><strong>Margin:</strong> $' + margin.toFixed(2) + '/hr</div>';
  }
  if(availDate) summary += '<div><strong>Availability:</strong> ' + new Date(availDate + "T00:00:00").toLocaleDateString() + '</div>';
  if(comments) summary += '<div><strong>Notes:</strong> ' + esc(comments) + '</div>';
  var tagged = window._notifyTagged || [];
  if(tagged.length > 0) {
    summary += '<div><strong>Notify:</strong> ' + tagged.map(function(u) { return esc(u.name); }).join(", ") + '</div>';
  }
  confEl.innerHTML = summary;
  confEl.style.display = "block";

  btn.textContent = "Confirm & Submit";
  btn.onclick = function() { executeSubmitToJob(jobId, payRate, billRate, availDate, comments); };
}

function executeSubmitToJob(jobId, payRate, billRate, availDate, comments) {
  var c = window._lastDetailCandidate;
  if(!c) return;
  var btn = document.getElementById("submit-job-btn");
  btn.textContent = "Submitting...";
  btn.disabled = true;

  // Build full comments with rates/availability
  var fullComments = "";
  if(payRate) fullComments += "Pay Rate: $" + payRate + "/hr\n";
  if(billRate) fullComments += "Bill Rate: $" + billRate + "/hr\n";
  if(payRate && billRate) fullComments += "Margin: $" + (parseFloat(billRate) - parseFloat(payRate)).toFixed(2) + "/hr\n";
  if(availDate) fullComments += "Availability: " + new Date(availDate + "T00:00:00").toLocaleDateString() + "\n";
  if(comments) fullComments += "\n" + comments;

  var notifyUsers = (window._notifyTagged || []).map(function(u) { return { id: u.id, name: u.name, email: u.email }; });
  apiFetch("submissions", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ candidateId: c.id, jobId: parseInt(jobId), payRate: payRate, billRate: billRate, availDate: availDate, comments: fullComments.trim(), notifyUsers: notifyUsers })
  }).then(function(r) {
    var confEl = document.getElementById("submit-confirmation");
    var msg = '<div style="color:#16a34a;font-weight:600">✅ Candidate submitted successfully!</div>';
    if (r.notifications && r.notifications.length > 0) {
      var allSent = r.notifications.every(function(n) { return n.success; });
      msg += '<div style="margin-top:6px;font-size:12px;color:#64748b">';
      if (allSent) {
        msg += '📧 Notified: ' + r.notifications.map(function(n) { return n.user; }).join(", ");
      } else {
        r.notifications.forEach(function(n) {
          msg += '<div>' + (n.success ? '✅' : '⚠️') + ' ' + n.user + (n.success ? ' — notified' : ' — notification failed') + '</div>';
        });
      }
      msg += '</div>';
    }
    confEl.innerHTML = msg;
    btn.textContent = "Submitted!";
    btn.style.background = "#16a34a";
    // Reset form after a beat and refresh
    setTimeout(function() {
      document.getElementById("submit-pay-rate").value = "";
      document.getElementById("submit-bill-rate").value = "";
      document.getElementById("submit-avail-date").value = "";
      document.getElementById("submit-comments-input").value = "";
      window._notifyTagged = [];
      confEl.style.display = "none";
      openDetail(c.id, c);
    }, 1500);
  }).catch(function(e) {
    btn.textContent = "Error — Try Again";
    btn.style.background = "#dc2626";
    alert("Failed to submit: " + e.message);
    setTimeout(function() { btn.textContent = "Confirm & Submit"; btn.disabled = false; btn.style.background = "#7c3aed"; }, 2000);
  });
}

/* ═══ SUBMITTAL TRACKER ═══ */
var _stFrom = "";
var _stTo = "";
var _stData = null;
var _stFilter = { client: [], status: [], recruiter: [] };
var _stSort = { col: "dateAddedRaw", dir: "desc" };
var _stReportUsers = []; // tagged users for report

function renderSubTracker(data) {
  _stData = data;
  var h = '';

  // ── Date range picker + Send Report button ──
  h += '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px">';
  h += '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">';
  h += '<label style="font-size:12px;font-weight:600;color:#64748b">From</label>';
  h += '<input type="date" id="st-from" value="' + (_stFrom || "") + '" onchange="stDateChange()" style="padding:5px 8px;border:1px solid #e2e8f0;border-radius:6px;font-size:12px;font-family:inherit" />';
  h += '<label style="font-size:12px;font-weight:600;color:#64748b">To</label>';
  h += '<input type="date" id="st-to" value="' + (_stTo || "") + '" onchange="stDateChange()" style="padding:5px 8px;border:1px solid #e2e8f0;border-radius:6px;font-size:12px;font-family:inherit" />';
  if (_stFrom || _stTo) h += '<button onclick="stClearDates()" style="padding:5px 10px;border:1px solid #e2e8f0;border-radius:6px;background:#fff;color:#64748b;font-size:11px;cursor:pointer;font-family:inherit">Clear</button>';
  h += '</div>';
  h += '<div style="display:flex;gap:8px">';
  h += '<button onclick="exportSubTracker()" style="padding:6px 12px;border-radius:6px;border:1px solid #e2e8f0;background:#fff;color:#176087;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit">Export CSV</button>';
  h += '<button onclick="openReportModal()" style="padding:6px 12px;border-radius:6px;border:none;background:#176087;color:#fff;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit">📧 Send Report</button>';
  h += '</div></div>';

  // ── KPI Cards ──
  h += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px">';
  h += stKpiCard(data.total, "Total Submissions", "#176087", "#e0f2fe");
  h += stKpiCard(data.active + data.interviews, "Active / In Process", "#7c3aed", "#ede9fe");
  h += stKpiCard(data.interviews, "In Interviews", "#0891b2", "#ecfeff");
  h += stKpiCard(data.wins, "Wins (Accepted/Placed)", "#16a34a", "#f0fdf4");
  h += stKpiCard(data.losses, "Losses", "#ef4444", "#fef2f2");
  h += stKpiCard(data.winRate + "%", "Win Rate", data.winRate >= 50 ? "#16a34a" : data.winRate >= 25 ? "#f59e0b" : "#ef4444", data.winRate >= 50 ? "#f0fdf4" : data.winRate >= 25 ? "#fffbeb" : "#fef2f2");
  h += '</div>';

  // ── Charts row ──
  h += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px">';

  // Client acceptance rates bar chart
  h += '<div style="background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:16px">';
  h += '<h4 style="margin:0 0 12px;font-size:14px;color:#0E2E47">Client Acceptance Rates</h4>';
  var clients = (data.clientRates || []).filter(function(c) { return c.total >= 2; }).slice(0, 10);
  if (clients.length === 0) {
    h += '<div style="color:#94a3b8;font-size:13px;padding:16px 0;text-align:center">Not enough data yet</div>';
  } else {
    var maxTotal = Math.max.apply(null, clients.map(function(c) { return c.total; }));
    clients.forEach(function(c) {
      var pct = maxTotal > 0 ? Math.round((c.total / maxTotal) * 100) : 0;
      var winPct = c.total > 0 ? Math.round((c.wins / c.total) * 100) : 0;
      var lossPct = c.total > 0 ? Math.round((c.losses / c.total) * 100) : 0;
      h += '<div style="margin-bottom:8px">';
      h += '<div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px">';
      h += '<span style="font-weight:600;color:#0E2E47">' + esc(c.client.length > 25 ? c.client.substring(0, 25) + '…' : c.client) + '</span>';
      h += '<span style="color:#64748b">' + c.total + ' subs · ' + (c.acceptRate !== null ? c.acceptRate + '% win' : 'pending') + '</span>';
      h += '</div>';
      h += '<div style="height:14px;border-radius:4px;background:#f1f5f9;overflow:hidden;display:flex">';
      if (c.wins > 0) h += '<div style="width:' + winPct + '%;background:#16a34a;height:100%"></div>';
      if (c.losses > 0) h += '<div style="width:' + lossPct + '%;background:#ef4444;height:100%"></div>';
      var activePct = 100 - winPct - lossPct;
      if (activePct > 0) h += '<div style="width:' + activePct + '%;background:#bae6fd;height:100%"></div>';
      h += '</div></div>';
    });
    h += '<div style="display:flex;gap:12px;margin-top:8px;font-size:10px;color:#64748b">';
    h += '<span><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:#16a34a;margin-right:3px"></span>Won</span>';
    h += '<span><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:#ef4444;margin-right:3px"></span>Lost</span>';
    h += '<span><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:#bae6fd;margin-right:3px"></span>Active</span>';
    h += '</div>';
  }
  h += '</div>';

  // Time-to-fill chart
  h += '<div style="background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:16px">';
  h += '<h4 style="margin:0 0 12px;font-size:14px;color:#0E2E47">Avg. Days in Stage</h4>';
  var stages = data.avgStageTimes || {};
  var stageOrder = ["Internally Submitted", "Client Submission", "First Interview", "Second Interview", "Third Interview", "Offer Extended"];
  var hasStageData = stageOrder.some(function(s) { return stages[s] !== undefined; });
  if (!hasStageData) {
    h += '<div style="color:#94a3b8;font-size:13px;padding:16px 0;text-align:center">Not enough data yet</div>';
  } else {
    var maxDays = Math.max.apply(null, stageOrder.map(function(s) { return stages[s] || 0; })) || 1;
    stageOrder.forEach(function(s) {
      var days = stages[s];
      if (days === undefined) return;
      var pct = Math.round((days / maxDays) * 100);
      var colors = subPipeStatusColor(s);
      h += '<div style="margin-bottom:8px">';
      h += '<div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px">';
      h += '<span style="font-weight:600;color:#0E2E47">' + esc(s) + '</span>';
      h += '<span style="color:' + colors.color + ';font-weight:700">' + days + ' day' + (days !== 1 ? 's' : '') + '</span>';
      h += '</div>';
      h += '<div style="height:14px;border-radius:4px;background:#f1f5f9;overflow:hidden">';
      h += '<div style="width:' + pct + '%;background:' + colors.color + ';height:100%;border-radius:4px;opacity:.7"></div>';
      h += '</div></div>';
    });
  }
  h += '</div>';
  h += '</div>';

  // ── Filters row (multi-select) ──
  h += '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:flex-start">';

  // Client filter
  var clientNames = [];
  (data.submissions || []).forEach(function(s) { if (s.client && clientNames.indexOf(s.client) === -1) clientNames.push(s.client); });
  clientNames.sort();
  h += stMultiSelect("client", "Clients", clientNames, _stFilter.client);

  // Status filter
  var statusList = [];
  (data.submissions || []).forEach(function(s) { if (s.status && statusList.indexOf(s.status) === -1) statusList.push(s.status); });
  h += stMultiSelect("status", "Statuses", statusList, _stFilter.status);

  // Recruiter filter
  var recruiters = [];
  (data.submissions || []).forEach(function(s) { if (s.submittedBy && recruiters.indexOf(s.submittedBy) === -1) recruiters.push(s.submittedBy); });
  recruiters.sort();
  h += stMultiSelect("recruiter", "Recruiters", recruiters, _stFilter.recruiter);

  // Clear all filters
  if (_stFilter.client.length || _stFilter.status.length || _stFilter.recruiter.length) {
    h += '<button onclick="stClearFilters()" style="padding:5px 10px;border:1px solid #e2e8f0;border-radius:6px;background:#fff;color:#ef4444;font-size:11px;cursor:pointer;font-family:inherit;white-space:nowrap">✕ Clear Filters</button>';
  }
  h += '<div style="font-size:12px;color:#64748b;margin-left:auto;white-space:nowrap;align-self:center" id="st-showing-count"></div>';
  h += '</div>';

  // ── Submissions table ──
  h += '<div style="overflow-x:auto"><table class="data-table" id="st-table"><thead><tr>';
  var cols = [
    { key: "candidateName", label: "Candidate" },
    { key: "jobTitle", label: "Job" },
    { key: "client", label: "Client" },
    { key: "status", label: "Status" },
    { key: "submittedBy", label: "Recruiter" },
    { key: "dateAdded", label: "Submitted", sortKey: "dateAddedRaw" },
    { key: "dateModified", label: "Updated", sortKey: "dateModifiedRaw" },
  ];
  cols.forEach(function(c) {
    var sk = c.sortKey || c.key;
    var arrow = "";
    if (_stSort.col === sk) arrow = _stSort.dir === "asc" ? " ▲" : " ▼";
    h += '<th onclick="sortSubTracker(\'' + sk + '\')" style="cursor:pointer;white-space:nowrap">' + c.label + arrow + '</th>';
  });
  h += '</tr></thead><tbody id="st-tbody">';
  h += stBuildRows(data.submissions || []);
  h += '</tbody></table></div>';

  // ── Report modal (hidden) ──
  h += '<div id="st-report-modal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:1000;align-items:center;justify-content:center">';
  h += '<div style="background:#fff;border-radius:12px;padding:24px;max-width:480px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,.2)">';
  h += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">';
  h += '<h3 style="margin:0;color:#0E2E47">Send Submission Report</h3>';
  h += '<span style="cursor:pointer;font-size:20px;color:#94a3b8" onclick="closeReportModal()">✕</span>';
  h += '</div>';
  h += '<div style="margin-bottom:12px;font-size:13px;color:#64748b">Send a styled email report with current metrics and active submissions to selected colleagues.</div>';
  h += '<div class="tag-picker" id="report-tag-picker" style="margin-bottom:12px">';
  h += '<label class="tag-picker-label">Recipients</label>';
  h += '<input type="text" class="tag-picker-input" id="report-search" placeholder="Search team members..." oninput="filterReportUsers()" onfocus="showReportDropdown()" />';
  h += '<div class="tag-picker-dropdown" id="report-dropdown"></div>';
  h += '<div class="tagged-users" id="report-tagged"></div>';
  h += '</div>';
  h += '<div id="report-send-status" style="display:none;margin-bottom:12px;padding:10px;border-radius:8px;font-size:13px"></div>';
  h += '<div style="display:flex;gap:8px;justify-content:flex-end">';
  h += '<button onclick="closeReportModal()" style="padding:8px 16px;border-radius:6px;border:1px solid #e2e8f0;background:#fff;color:#64748b;font-size:13px;cursor:pointer;font-family:inherit">Cancel</button>';
  h += '<button id="report-send-btn" onclick="sendSubReport()" style="padding:8px 16px;border-radius:6px;border:none;background:#176087;color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit">Send Report</button>';
  h += '</div></div></div>';

  return h;
}

function stKpiCard(value, label, color, bg) {
  return '<div style="padding:14px;border-radius:10px;background:' + bg + ';border:1px solid ' + color + '22;text-align:center">'
    + '<div style="font-size:28px;font-weight:800;color:' + color + ';line-height:1">' + value + '</div>'
    + '<div style="font-size:11px;font-weight:600;color:#64748b;margin-top:6px">' + label + '</div></div>';
}

function stBuildRows(subs) {
  // Apply filters
  var filtered = subs.filter(function(s) {
    if (_stFilter.client.length && _stFilter.client.indexOf(s.client) === -1) return false;
    if (_stFilter.status.length && _stFilter.status.indexOf(s.status) === -1) return false;
    if (_stFilter.recruiter.length && _stFilter.recruiter.indexOf(s.submittedBy) === -1) return false;
    return true;
  });
  // Sort
  filtered.sort(function(a, b) {
    var ak = a[_stSort.col], bk = b[_stSort.col];
    if (typeof ak === "string") ak = ak.toLowerCase();
    if (typeof bk === "string") bk = bk.toLowerCase();
    if (ak < bk) return _stSort.dir === "asc" ? -1 : 1;
    if (ak > bk) return _stSort.dir === "asc" ? 1 : -1;
    return 0;
  });
  // Update count
  setTimeout(function() {
    var el = document.getElementById("st-showing-count");
    if (el) el.textContent = "Showing " + filtered.length + " of " + subs.length;
  }, 0);
  if (filtered.length === 0) return '<tr><td colspan="7" style="text-align:center;padding:32px;color:#94a3b8">No submissions match filters</td></tr>';
  var h = "";
  var statuses = (_stData && _stData.statuses) ? _stData.statuses : [];
  filtered.forEach(function(s) {
    var colors = subPipeStatusColor(s.status);
    h += '<tr>';
    h += '<td><span class="name-link" onclick="openDetail(' + s.candidateId + ')">' + esc(s.candidateName) + '</span></td>';
    h += '<td>' + esc(s.jobTitle) + '</td>';
    h += '<td>' + esc(s.client) + '</td>';
    // Inline editable status dropdown
    h += '<td><select onchange="stUpdateStatus(' + s.id + ', this.value, this)" style="padding:3px 8px;border:1px solid ' + colors.border + ';border-radius:6px;background:' + colors.bg + ';color:' + colors.color + ';font-size:11px;font-weight:600;font-family:inherit;cursor:pointer;max-width:180px">';
    statuses.forEach(function(st) {
      h += '<option value="' + esc(st) + '"' + (s.status === st ? ' selected' : '') + '>' + esc(st) + '</option>';
    });
    if (statuses.indexOf(s.status) === -1) {
      h += '<option value="' + esc(s.status) + '" selected>' + esc(s.status) + '</option>';
    }
    h += '</select></td>';
    h += '<td>' + esc(s.submittedBy) + '</td>';
    h += '<td>' + esc(s.dateAdded) + '</td>';
    h += '<td>' + esc(s.dateModified) + '</td>';
    h += '</tr>';
  });
  return h;
}

function stUpdateStatus(subId, newStatus, selectEl) {
  var note = prompt("Add a note for this status change (optional):");
  // Update the dropdown color immediately
  var colors = subPipeStatusColor(newStatus);
  selectEl.style.background = colors.bg;
  selectEl.style.color = colors.color;
  selectEl.style.borderColor = colors.border;

  apiFetch("submissions/" + subId + "/status", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ status: newStatus, comments: note || "" })
  }).then(function(r) {
    if (r.success && _stData) {
      // Update local data
      (_stData.submissions || []).forEach(function(s) {
        if (s.id === subId) { s.status = newStatus; s.dateModified = new Date().toLocaleDateString(); s.dateModifiedRaw = Date.now(); }
      });
    } else if (!r.success) {
      alert("Failed to update status");
      loadPage();
    }
  }).catch(function(e) {
    alert("Error updating status: " + e.message);
    loadPage();
  });
}

function stMultiSelect(key, label, options, selected) {
  var id = "st-ms-" + key;
  var h = '<div style="position:relative;display:inline-block">';
  var count = selected.length;
  var btnLabel = count === 0 ? "All " + label : count + " " + label;
  var btnStyle = count > 0
    ? "padding:6px 10px;border:1px solid #176087;border-radius:6px;font-size:12px;font-family:inherit;cursor:pointer;background:#e0f2fe;color:#176087;font-weight:600;white-space:nowrap"
    : "padding:6px 10px;border:1px solid #e2e8f0;border-radius:6px;font-size:12px;font-family:inherit;cursor:pointer;background:#fff;color:#334155;white-space:nowrap";
  h += '<button onclick="stToggleDropdown(\'' + key + '\')" style="' + btnStyle + '">' + esc(btnLabel) + ' ▾</button>';
  h += '<div id="' + id + '-dd" style="display:none;position:absolute;top:100%;left:0;z-index:100;background:#fff;border:1px solid #e2e8f0;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.12);min-width:200px;max-height:280px;overflow-y:auto;margin-top:4px;padding:4px 0">';
  options.forEach(function(opt) {
    var isOn = selected.indexOf(opt) !== -1;
    var optStyle = isOn
      ? "display:flex;align-items:center;gap:8px;padding:7px 12px;cursor:pointer;font-size:12px;background:#e0f2fe;color:#176087;font-weight:600"
      : "display:flex;align-items:center;gap:8px;padding:7px 12px;cursor:pointer;font-size:12px;color:#334155";
    var check = isOn ? "☑" : "☐";
    h += '<div style="' + optStyle + '" onclick="stToggleFilter(\'' + key + '\',\'' + esc(opt).replace(/'/g, "\\'") + '\')" onmouseover="this.style.background=\'#f1f5f9\'" onmouseout="this.style.background=\'' + (isOn ? '#e0f2fe' : '#fff') + '\'">';
    h += '<span style="font-size:14px">' + check + '</span> ' + esc(opt) + '</div>';
  });
  h += '</div></div>';
  return h;
}

function stToggleDropdown(key) {
  var dd = document.getElementById("st-ms-" + key + "-dd");
  if (!dd) return;
  // Close all other dropdowns first
  ["client","status","recruiter"].forEach(function(k) {
    if (k !== key) {
      var other = document.getElementById("st-ms-" + k + "-dd");
      if (other) other.style.display = "none";
    }
  });
  dd.style.display = dd.style.display === "none" ? "block" : "none";
}

function stToggleFilter(key, value) {
  var arr = _stFilter[key];
  var idx = arr.indexOf(value);
  if (idx === -1) arr.push(value);
  else arr.splice(idx, 1);
  // Re-render the whole tracker to update chips, table, and counts
  if (_stData) document.getElementById("content").innerHTML = renderSubTracker(_stData);
  // Re-open the dropdown after re-render
  setTimeout(function() {
    var dd = document.getElementById("st-ms-" + key + "-dd");
    if (dd) dd.style.display = "block";
  }, 10);
}

function stClearFilters() {
  _stFilter.client = [];
  _stFilter.status = [];
  _stFilter.recruiter = [];
  if (_stData) document.getElementById("content").innerHTML = renderSubTracker(_stData);
}

// Close multi-select dropdowns when clicking outside
document.addEventListener("click", function(e) {
  if (!e.target.closest("[id^='st-ms-']") && !e.target.closest("[onclick*='stToggleDropdown']")) {
    ["client","status","recruiter"].forEach(function(k) {
      var dd = document.getElementById("st-ms-" + k + "-dd");
      if (dd) dd.style.display = "none";
    });
  }
});

function stApplyFilters() {
  // Called on date change — filters are now handled via stToggleFilter
  var tbody = document.getElementById("st-tbody");
  if (tbody && _stData) tbody.innerHTML = stBuildRows(_stData.submissions || []);
}

function sortSubTracker(col) {
  if (_stSort.col === col) {
    _stSort.dir = _stSort.dir === "asc" ? "desc" : "asc";
  } else {
    _stSort.col = col;
    _stSort.dir = "asc";
  }
  if (_stData) document.getElementById("content").innerHTML = renderSubTracker(_stData);
}

function stDateChange() {
  _stFrom = (document.getElementById("st-from") || {}).value || "";
  _stTo = (document.getElementById("st-to") || {}).value || "";

// ── Report Modal (reuses user list pattern) ──
function openReportModal() {
  _stReportUsers = [];
  var modal = document.getElementById("st-report-modal");
  if (modal) modal.style.display = "flex";
  var taggedEl = document.getElementById("report-tagged");
  if (taggedEl) taggedEl.innerHTML = "";
  var searchEl = document.getElementById("report-search");
  if (searchEl) searchEl.value = "";
  var statusEl = document.getElementById("report-send-status");
  if (statusEl) statusEl.style.display = "none";
  // Load users
  apiFetch("users").then(function(r) {
    window._reportAllUsers = (r.data || []).filter(function(u) { return u.email; });
    renderReportDropdown(window._reportAllUsers);
  }).catch(function() {});
}

function closeReportModal() {
  var modal = document.getElementById("st-report-modal");
  if (modal) modal.style.display = "none";
}

function renderReportDropdown(users) {
  var dd = document.getElementById("report-dropdown");
  if (!dd) return;
  var h = "";
  users.forEach(function(u) {
    if (_stReportUsers.some(function(t) { return t.id === u.id; })) return;
    var initials = ((u.name || "").split(" ").map(function(w) { return w[0] || ""; }).join("")).toUpperCase().substring(0, 2);
    h += '<div class="tag-option" onclick="tagReportUser(' + u.id + ')">';
    h += '<div class="tag-avatar">' + initials + '</div>';
    h += '<div><div style="font-weight:600">' + esc(u.name) + '</div><div style="font-size:11px;color:#94a3b8">' + esc(u.email) + '</div></div>';
    h += '</div>';
  });
  if (!h) h = '<div style="padding:10px;color:#94a3b8;font-size:12px;text-align:center">No more team members</div>';
  dd.innerHTML = h;
}

function filterReportUsers() {
  var q = (document.getElementById("report-search").value || "").toLowerCase();
  var filtered = (window._reportAllUsers || []).filter(function(u) {
    return u.name.toLowerCase().indexOf(q) !== -1 || u.email.toLowerCase().indexOf(q) !== -1;
  });
  renderReportDropdown(filtered);
  var dd = document.getElementById("report-dropdown");
  if (dd) dd.classList.add("show");
}

function showReportDropdown() {
  renderReportDropdown(window._reportAllUsers || []);
  var dd = document.getElementById("report-dropdown");
  if (dd) dd.classList.add("show");
}

function tagReportUser(userId) {
  var user = (window._reportAllUsers || []).find(function(u) { return u.id === userId; });
  if (!user || _stReportUsers.some(function(t) { return t.id === userId; })) return;
  _stReportUsers.push(user);
  renderReportChips();
  renderReportDropdown(window._reportAllUsers || []);
  var inp = document.getElementById("report-search");
  if (inp) inp.value = "";
}

function removeReportTag(userId) {
  _stReportUsers = _stReportUsers.filter(function(t) { return t.id !== userId; });
  renderReportChips();
  renderReportDropdown(window._reportAllUsers || []);
}

function renderReportChips() {
  var el = document.getElementById("report-tagged");
  if (!el) return;
  var h = "";
  _stReportUsers.forEach(function(u) {
    h += '<span class="tagged-chip"><span>' + esc(u.name) + '</span><span class="chip-x" onclick="removeReportTag(' + u.id + ')">×</span></span>';
  });
  el.innerHTML = h;
}

function sendSubReport() {
  if (_stReportUsers.length === 0) { alert("Please select at least one recipient"); return; }
  var btn = document.getElementById("report-send-btn");
  var statusEl = document.getElementById("report-send-status");
  btn.textContent = "Sending...";
  btn.disabled = true;

  var recipients = _stReportUsers.map(function(u) { return { id: u.id, name: u.name, email: u.email }; });
  apiFetch("submission-report", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ recipients: recipients, from: _stFrom || undefined, to: _stTo || undefined })
  }).then(function(r) {
    statusEl.style.display = "block";
    if (r.success && r.sent > 0) {
      statusEl.style.background = "#f0fdf4";
      statusEl.style.color = "#16a34a";
      statusEl.style.border = "1px solid #bbf7d0";
      statusEl.innerHTML = '✅ Report sent to ' + r.sent + ' of ' + r.total + ' recipient' + (r.total > 1 ? 's' : '');
    } else {
      statusEl.style.background = "#fef2f2";
      statusEl.style.color = "#ef4444";
      statusEl.style.border = "1px solid #fecaca";
      statusEl.innerHTML = '⚠️ Failed to send report. Check email configuration.';
    }
    btn.textContent = "Send Report";
    btn.disabled = false;
  }).catch(function(e) {
    statusEl.style.display = "block";
    statusEl.style.background = "#fef2f2";
    statusEl.style.color = "#ef4444";
    statusEl.style.border = "1px solid #fecaca";
    statusEl.innerHTML = '⚠️ Error: ' + e.message;
    btn.textContent = "Send Report";
    btn.disabled = false;
  });
}

// Close report dropdown when clicking outside
document.addEventListener("click", function(e) {
  var picker = document.getElementById("report-tag-picker");
  var dd = document.getElementById("report-dropdown");
  if (dd && picker && !picker.contains(e.target)) dd.classList.remove("show");
});

/* ═══ SUBMISSION PIPELINE ═══ */
var _subPipeData = [];
var _subPipeStatuses = [];
var _subPipeSort = { col: "dateModifiedRaw", dir: "desc" };

function renderSubmissionPipeline(result) {
  _subPipeData = result.data || [];
  _subPipeStatuses = result.statuses || [];
  var total = result.total || _subPipeData.length;

  var h = '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px">';
  h += '<div style="font-size:14px;color:#64748b">' + total + ' submission' + (total !== 1 ? 's' : '') + '</div>';
  h += '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">';

  // Status filter
  h += '<select id="sub-pipe-status-filter" onchange="filterSubPipeline()" style="padding:6px 10px;border:1px solid #e2e8f0;border-radius:6px;font-size:12px;font-family:inherit">';
  h += '<option value="All"' + ((filters.status || "All") === "All" ? " selected" : "") + '>All Statuses</option>';
  _subPipeStatuses.forEach(function(s) {
    h += '<option value="' + esc(s) + '"' + (filters.status === s ? " selected" : "") + '>' + esc(s) + '</option>';
  });
  h += '</select>';

  // Export
  h += '<button onclick="exportSubPipeline()" style="padding:6px 12px;border-radius:6px;border:1px solid #e2e8f0;background:#fff;color:#176087;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit">Export CSV</button>';
  h += '</div></div>';

  // Status summary cards
  var statusCounts = {};
  _subPipeData.forEach(function(s) {
    statusCounts[s.status] = (statusCounts[s.status] || 0) + 1;
  });
  var activeStatuses = ["Internal Submission", "Client Submission", "Interview - Round 1", "Interview - Round 2", "Interview - Round 3", "Offer"];
  var closedStatuses = ["Placed", "Rejected - Not a Fit", "Client Declined", "Candidate Declined Offer", "Withdrawn"];
  h += '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">';
  activeStatuses.forEach(function(st) {
    var cnt = statusCounts[st] || 0;
    if (cnt === 0 && (filters.status || "All") !== "All") return;
    var colors = subPipeStatusColor(st);
    h += '<div onclick="filterSubPipelineByStatus(\'' + esc(st) + '\')" style="cursor:pointer;padding:8px 14px;border-radius:8px;background:' + colors.bg + ';border:1px solid ' + colors.border + ';text-align:center;min-width:80px">';
    h += '<div style="font-size:20px;font-weight:800;color:' + colors.color + '">' + cnt + '</div>';
    h += '<div style="font-size:10px;font-weight:600;color:' + colors.color + ';opacity:.8">' + esc(st) + '</div>';
    h += '</div>';
  });
  h += '</div>';

  // Table
  h += '<div style="overflow-x:auto"><table class="data-table" id="sub-pipe-table"><thead><tr>';
  var cols = [
    { key: "candidateName", label: "Candidate" },
    { key: "jobTitle", label: "Job" },
    { key: "client", label: "Client" },
    { key: "status", label: "Status" },
    { key: "submittedBy", label: "Submitted By" },
    { key: "dateAdded", label: "Submitted", sortKey: "dateAddedRaw" },
    { key: "dateModified", label: "Last Updated", sortKey: "dateModifiedRaw" },
    { key: "_actions", label: "" },
  ];
  cols.forEach(function(c) {
    var sk = c.sortKey || c.key;
    var arrow = "";
    if (_subPipeSort.col === sk) arrow = _subPipeSort.dir === "asc" ? " ▲" : " ▼";
    if (c.key === "_actions") {
      h += '<th style="width:40px"></th>';
    } else {
      h += '<th onclick="sortSubPipeline(\'' + sk + '\')" style="cursor:pointer;white-space:nowrap">' + c.label + arrow + '</th>';
    }
  });
  h += '</tr></thead><tbody>';

  // Sort
  var sorted = _subPipeData.slice().sort(function(a, b) {
    var ak = a[_subPipeSort.col], bk = b[_subPipeSort.col];
    if (typeof ak === "string") ak = ak.toLowerCase();
    if (typeof bk === "string") bk = bk.toLowerCase();
    if (ak < bk) return _subPipeSort.dir === "asc" ? -1 : 1;
    if (ak > bk) return _subPipeSort.dir === "asc" ? 1 : -1;
    return 0;
  });

  if (sorted.length === 0) {
    h += '<tr><td colspan="8" style="text-align:center;padding:32px;color:#94a3b8">No submissions found</td></tr>';
  } else {
    sorted.forEach(function(s) {
      var colors = subPipeStatusColor(s.status);
      h += '<tr>';
      h += '<td><span class="name-link" onclick="openDetail(' + s.candidateId + ')">' + esc(s.candidateName) + '</span></td>';
      h += '<td>' + esc(s.jobTitle) + '</td>';
      h += '<td>' + esc(s.client) + '</td>';
      // Status dropdown
      h += '<td><select onchange="updateSubStatus(' + s.id + ', this.value)" style="padding:4px 8px;border:1px solid ' + colors.border + ';border-radius:6px;background:' + colors.bg + ';color:' + colors.color + ';font-size:11px;font-weight:600;font-family:inherit;cursor:pointer">';
      _subPipeStatuses.forEach(function(st) {
        h += '<option value="' + esc(st) + '"' + (s.status === st ? ' selected' : '') + '>' + esc(st) + '</option>';
      });
      // Include current status if it's not in the standard list
      if (_subPipeStatuses.indexOf(s.status) === -1) {
        h += '<option value="' + esc(s.status) + '" selected>' + esc(s.status) + '</option>';
      }
      h += '</select></td>';
      h += '<td>' + esc(s.submittedBy) + '</td>';
      h += '<td>' + esc(s.dateAdded) + '</td>';
      h += '<td>' + esc(s.dateModified) + '</td>';
      h += '<td><span style="cursor:pointer;font-size:16px" title="View comments" onclick="showSubComments(' + s.id + ')">💬</span></td>';
      h += '</tr>';
    });
  }
  h += '</tbody></table></div>';

  // Comments/notes modal area (hidden)
  h += '<div id="sub-comments-modal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:1000;display:none;align-items:center;justify-content:center">';
  h += '<div style="background:#fff;border-radius:12px;padding:24px;max-width:500px;width:90%;max-height:80vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)">';
  h += '<div id="sub-comments-content"></div>';
  h += '</div></div>';

  return h;
}

    "Internal Submission": { color: "#176087", bg: "#e0f2fe", border: "#bae6fd" },
    "Client Submission": { color: "#7c3aed", bg: "#ede9fe", border: "#ddd6fe" },
    "First Interview": { color: "#0891b2", bg: "#ecfeff", border: "#a5f3fc" },
    "Second Interview": { color: "#0891b2", bg: "#ecfeff", border: "#a5f3fc" },
    "Third Interview": { color: "#0891b2", bg: "#ecfeff", border: "#a5f3fc" },
    "Interview - Round 1": { color: "#0891b2", bg: "#ecfeff", border: "#a5f3fc" },
    "Interview - Round 2": { color: "#0891b2", bg: "#ecfeff", border: "#a5f3fc" },
    "Interview - Round 3": { color: "#0891b2", bg: "#ecfeff", border: "#a5f3fc" },
    "Offer Extended": { color: "#16a34a", bg: "#f0fdf4", border: "#bbf7d0" },
    "Offer": { color: "#16a34a", bg: "#f0fdf4", border: "#bbf7d0" },
    "Offer Accepted": { color: "#059669", bg: "#ecfdf5", border: "#a7f3d0" },
    "Placed": { color: "#059669", bg: "#ecfdf5", border: "#a7f3d0" },
    "Client Rejected": { color: "#ef4444", bg: "#fef2f2", border: "#fecaca" },
    "Sales Rejected": { color: "#ef4444", bg: "#fef2f2", border: "#fecaca" },
    "Sales Rep Rejected": { color: "#ef4444", bg: "#fef2f2", border: "#fecaca" },
    "Consultant Rejected": { color: "#ef4444", bg: "#fef2f2", border: "#fecaca" },
    "Offer Rejected": { color: "#f59e0b", bg: "#fffbeb", border: "#fde68a" },
    "Withdrew": { color: "#64748b", bg: "#f1f5f9", border: "#e2e8f0" },
    "Candidate Withdrew": { color: "#64748b", bg: "#f1f5f9", border: "#e2e8f0" },

  };
  return map[status] || { color: "#64748b", bg: "#f1f5f9", border: "#e2e8f0" };

function sortSubPipeline(col) {
  if (_subPipeSort.col === col) {
    _subPipeSort.dir = _subPipeSort.dir === "asc" ? "desc" : "asc";
  } else {
    _subPipeSort.col = col;
    _subPipeSort.dir = "asc";
  }
  document.getElementById("content").innerHTML = renderSubmissionPipeline({ data: _subPipeData, statuses: _subPipeStatuses, total: _subPipeData.length });
}

function filterSubPipeline() {
  var sel = document.getElementById("sub-pipe-status-filter");
  filters.status = sel ? sel.value : "All";
  loadPage();
}

function filterSubPipelineByStatus(status) {
  filters.status = status;
  loadPage();
}

function updateSubStatus(subId, newStatus) {
  // Prompt for optional notes and notify
  var note = prompt("Add a note for this status change (optional):");
  apiFetch("submissions/" + subId + "/status", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ status: newStatus, comments: note || "" })
  }).then(function(r) {
    if (r.success) {
      // Update local data
      _subPipeData.forEach(function(s) { if (s.id === subId) { s.status = newStatus; s.dateModified = new Date().toLocaleDateString(); s.dateModifiedRaw = Date.now(); } });
      document.getElementById("content").innerHTML = renderSubmissionPipeline({ data: _subPipeData, statuses: _subPipeStatuses, total: _subPipeData.length });
    } else {
      alert("Failed to update status: " + (r.error || "Unknown error"));
      loadPage();
    }
  }).catch(function(e) {
    alert("Error updating status: " + e.message);
    loadPage();
  });
}

function showSubComments(subId) {
  var sub = _subPipeData.find(function(s) { return s.id === subId; });
  if (!sub) return;
  var modal = document.getElementById("sub-comments-modal");
  var content = document.getElementById("sub-comments-content");
  var h = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">';
  h += '<h3 style="margin:0;color:#0E2E47">Submission Details</h3>';
  h += '<span style="cursor:pointer;font-size:20px;color:#94a3b8" onclick="document.getElementById(\'sub-comments-modal\').style.display=\'none\'">✕</span>';
  h += '</div>';
  h += '<div style="margin-bottom:12px"><strong>Candidate:</strong> ' + esc(sub.candidateName) + '</div>';
  h += '<div style="margin-bottom:12px"><strong>Job:</strong> ' + esc(sub.jobTitle) + (sub.client ? ' — ' + esc(sub.client) : '') + '</div>';
  var colors = subPipeStatusColor(sub.status);
  h += '<div style="margin-bottom:12px"><strong>Status:</strong> <span style="padding:2px 10px;border-radius:10px;background:' + colors.bg + ';color:' + colors.color + ';font-weight:600;font-size:12px">' + esc(sub.status) + '</span></div>';
  h += '<div style="margin-bottom:12px"><strong>Submitted:</strong> ' + esc(sub.dateAdded) + ' by ' + esc(sub.submittedBy) + '</div>';
  if (sub.comments) {
    h += '<div style="margin-top:12px;padding:12px;background:#f8fafc;border-radius:8px;border:1px solid #e2e8f0"><strong>Notes:</strong><div style="margin-top:6px;white-space:pre-wrap;font-size:13px;color:#334155">' + esc(sub.comments) + '</div></div>';
  } else {
    h += '<div style="color:#94a3b8;font-size:13px">No notes on this submission</div>';

function exportSubPipeline() {

  var ss=["All","Active Account","Active","Prospect","Passive Account","Unqualified","Archive"];

  var cols=[
    {key:"name",label:"Company",render:function(r){return '<span class="name-link">'+esc(r.name)+'</span>';},exportVal:function(r){return r.name||"";}},
    {key:"owner",label:"Account Owner",render:function(r){return r.owner?'\uD83D\uDC64 '+esc(r.owner):'<span class="muted">\u2014</span>';},exportVal:function(r){return r.owner||"";}},
    {key:"location",label:"Location",render:function(r){return '\uD83D\uDCCD '+esc(r.location);},exportVal:function(r){return r.location||"";}},

function showContractEndMatches(){
  var mc=document.getElementById("content");
  if(!mc) return;

  apiFetch("contract-end-matches").then(function(r){

      h+='<div style="border:1px solid #e9eef4;border-radius:12px;padding:16px;margin-bottom:16px">';

      } else {

          h+='<div style="display:flex;gap:6px;flex-wrap:wrap">';

          h+='<span style="font-size:10px;padding:2px 6px;border-radius:4px;background:#176087;color:#fff">'+m.certOverlap+' cert'+(m.certOverlap!==1?'s':'')+' match</span>';
          h+='<span style="font-size:10px;padding:2px 6px;border-radius:4px;background:#f1f5f9;color:#64748b">'+m.openings+' opening'+(m.openings!==1?'s':'')+'</span>';

        });
        h+='</div>';
      }

    el.innerHTML=h;
  }).catch(function(e){

  // Tables container (re-rendered by filters)

function bdKpi(emoji,label,value,sub,color,key){
  color=color||"#176087";
  return '<div class="stat-card" style="cursor:pointer" onclick="openBdModal(\''+key+'\')">'
    +'<div class="stat-icon" style="background:'+color+'14">'+emoji+'</div>'
    +'<div><div class="stat-label">'+label+'</div><div class="stat-value">'+value+'</div>'
    +(sub?'<div class="stat-sub">'+sub+'</div>':'')
    +'</div></div>';
}

function getBizDevFilters() {
  return {
    owner: (document.getElementById("bd-filter-owner")||{}).value || "",
    client: (document.getElementById("bd-filter-client")||{}).value || "",
    cert: (document.getElementById("bd-filter-cert")||{}).value || "",
    status: (document.getElementById("bd-filter-status")||{}).value || "",
    days: (document.getElementById("bd-filter-date")||{}).value || "",
  };
}

function applyBizDevFilters() {
  var el = document.getElementById("bd-tables");
  if (!el || !_bizDevData) return;
  el.innerHTML = renderBizDevTables(_bizDevData, getBizDevFilters());
}

function resetBizDevFilters() {
  ["bd-filter-owner","bd-filter-client","bd-filter-cert","bd-filter-status"].forEach(function(id){
    var el=document.getElementById(id); if(el) el.value="";
  });
  var dateEl=document.getElementById("bd-filter-date"); if(dateEl) dateEl.value="30";
  applyBizDevFilters();
}

function bdFilterJobs(jobs, flt) {
  return jobs.filter(function(j) {
    if (flt.owner && j.owner !== flt.owner) return false;
    if (flt.client && j.client !== flt.client) return false;
    if (flt.days && j.daysOpen !== null && j.daysOpen > parseInt(flt.days)) return false;
    if (flt.status === "open" && j.status !== "Accepting Candidates" && j.status !== "Open") return false;
    if (flt.status === "closed" && j.status !== "Closed" && j.status !== "Filled" && j.status !== "Placed") return false;
    return true;
  });
}

function bdFilterConsultants(list, flt) {
  return list.filter(function(c) {
    if (flt.owner && c.owner !== flt.owner) return false;
    if (flt.cert && (c.primaryCert || "").indexOf(flt.cert) < 0) return false;
    return true;
  });
}

function bdFilterPlacements(list, flt) {
  return list.filter(function(p) {
    if (flt.client && p.client !== flt.client) return false;
    return true;
  });
}

function renderBizDevTables(d, flt) {
  var html = '';
  var activeFiltered = bdFilterJobs(d.activeOpportunities || [], flt);
  var closedFiltered = bdFilterJobs(d.closedOpportunities || [], flt);
  var newFiltered = (d.newOpportunities || []).filter(function(j) {
    if (flt.owner && j.owner !== flt.owner) return false;
    if (flt.client && j.client !== flt.client) return false;
    return true;
  });
  var topFiltered = bdFilterConsultants(d.topConsultants || [], flt);
  var expFiltered = bdFilterPlacements(d.expiringPlacements || [], flt);
  var startsFiltered = bdFilterPlacements(d.upcomingStarts || [], flt);

  // Show closed or active based on status filter
  var showClosed = flt.status === "closed";

  // ── Active Opportunities ──

      html+='<div style="padding:16px;text-align:center;color:#94a3b8;font-size:13px">No active opportunities match filters</div>';

    if(closedFiltered.length===0){
      html+='<div style="padding:16px;text-align:center;color:#94a3b8;font-size:13px">No closed jobs match filters</div>';

        html+='<td>'+esc(j.client)+'</td>';
        html+='<td>'+esc(j.owner||"\u2014")+'</td>';
        html+='<td>'+esc(j.type||"\u2014")+'</td>';
        html+='<td>'+esc(j.salary)+'</td>';
        html+='<td>'+esc(j.location||"\u2014")+'</td>';
        html+='<td>'+esc(j.dateAdded)+'</td>';
        html+='</tr>';
      });
      html+='</tbody></table></div>';
    }
    html+='</div>';
  }

  // Two-column grid
  html+='<div class="chart-grid">';

  // ── Top Consultants ──
  html+='<div class="chart-card"><h3 style="display:flex;align-items:center;justify-content:space-between">\u2B50 Top Consultants <span style="font-size:12px;font-weight:400;color:#94a3b8">Grade A & B ('+topFiltered.length+')</span></h3>';

      var gc=gradeColors[c.grade]||"#64748b";

      html+='<div style="width:32px;height:32px;border-radius:8px;background:'+gc+'14;display:flex;align-items:center;justify-content:center;font-weight:700;color:'+gc+';font-size:13px;flex-shrink:0">'+esc(c.grade)+'</div>';
      html+='<div style="flex:1;min-width:0">';
      html+='<div style="font-weight:600;font-size:13px;color:#176087;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(c.name)+'</div>';
      html+='<div style="font-size:12px;color:#64748b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">';
      if(c.primaryCert) html+=esc(c.primaryCert);
      if(c.epicRole) html+=' \u2022 '+esc(c.epicRole);

      html+='<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f1f5f9'+(p.urgency==="critical"?";background:#fef2f210":"")+'">';
      html+='<div style="width:40px;height:40px;border-radius:10px;background:'+uc+'14;display:flex;align-items:center;justify-content:center;font-weight:700;color:'+uc+';font-size:13px;flex-shrink:0">'+p.daysLeft+'d</div>';

      html+='</div>';

      html+='</div>';
    });
  }
  html+='</div>';

  html+='</div>'; // close chart-grid

  // ── Upcoming Starts ──
  html+='<div class="chart-card"><h3 style="display:flex;align-items:center;justify-content:space-between">\uD83D\uDE80 Upcoming Placement Starts <span style="font-size:12px;font-weight:400;color:#94a3b8">'+startsFiltered.length+' placements</span></h3>';
  if(startsFiltered.length===0){
    html+='<div style="padding:16px;text-align:center;color:#94a3b8;font-size:13px">No upcoming placement starts</div>';
  } else {
    html+='<div style="overflow-x:auto"><table class="data-table" style="width:100%;font-size:13px"><thead><tr>';

    html+='</tr></thead><tbody>';
    startsFiltered.forEach(function(p){
      var started=p.daysUntil!==null&&p.daysUntil<=0;
      html+='<tr>';
      html+='<td style="font-weight:600;'+(p.candidateId?"cursor:pointer;color:#176087":"")+'"'+(p.candidateId?' onclick="openDetail('+p.candidateId+',{})"':'')+'>'+esc(p.candidate)+'</td>';
      html+='<td>'+esc(p.job)+'</td>';
      html+='<td>'+esc(p.client||"\u2014")+'</td>';
      html+='<td>'+esc(p.startDate)+'</td>';
      html+='<td style="text-align:center;font-weight:600;color:'+(started?"#16a34a":"#176087")+'">'+(started?"\u2705 Started":(p.daysUntil!==null?p.daysUntil+"d":"\u2014"))+'</td>';

      html+='</tr>';
    });

function renderJobTable(jobs, showDaysOpen) {
  var h = '<div style="overflow-x:auto"><table class="data-table" style="width:100%;font-size:13px"><thead><tr>';
  h+='<th>Job Title</th><th>Client</th><th>Owner</th><th>Priority</th><th>Status</th><th>Type</th><th>Salary</th><th>Location</th><th>Openings</th><th>Subs</th>';
  if (showDaysOpen) h+='<th>Days Open</th>';
  h+='</tr></thead><tbody>';
  jobs.forEach(function(j){
    var prioColor=j.priority==="Urgent"?"#dc2626":j.priority==="Hot"?"#f59e0b":j.priority==="Warm"?"#f97316":"#64748b";
    var statusColor=j.status==="Closed"||j.status==="Filled"?"#64748b":j.status==="Accepting Candidates"?"#16a34a":"#176087";
    h+='<tr style="cursor:pointer" onclick="setPage(\'jobs\')">';
    h+='<td style="font-weight:600;color:#176087">'+esc(j.title)+'</td>';
    h+='<td>'+esc(j.client)+'</td>';
    h+='<td>'+esc(j.owner||"\u2014")+'</td>';
    h+='<td>'+(j.priority?'<span class="badge" style="background:'+prioColor+'14;color:'+prioColor+';border:1px solid '+prioColor+'40;font-weight:600">'+esc(j.priority)+'</span>':'\u2014')+'</td>';
    h+='<td><span class="badge" style="color:'+statusColor+'">'+esc(j.status)+'</span></td>';
    h+='<td>'+esc(j.type||"\u2014")+'</td>';
    h+='<td>'+esc(j.salary)+'</td>';
    h+='<td>'+esc(j.location||"\u2014")+'</td>';
    h+='<td style="text-align:center">'+j.openings+'</td>';
    h+='<td style="text-align:center">'+j.submissions+'</td>';
    if (showDaysOpen) {
      var doColor=j.daysOpen>30?"#dc2626":j.daysOpen>14?"#f59e0b":"#64748b";
      h+='<td style="text-align:center;color:'+doColor+';font-weight:600">'+(j.daysOpen!==null?j.daysOpen:"\u2014")+'</td>';
    }
    h+='</tr>';
  });
  h+='</tbody></table></div>';
  return h;
}

function openBdModal(key) {
  if (!_bizDevData) return;
  var d = _bizDevData;
  var title = "";
  var bodyHtml = "";

  if (key === "activeJobs") {
    title = "\uD83D\uDCBC Active Jobs (" + (d.activeOpportunities||[]).length + ")";
    bodyHtml = renderJobTable(d.activeOpportunities || [], true);
  } else if (key === "urgentJobs") {
    var urgent = (d.activeOpportunities||[]).filter(function(j){ return j.priority==="Urgent"||j.priority==="Hot"; });
    title = "\uD83D\uDD25 Urgent & Hot Jobs (" + urgent.length + ")";
    bodyHtml = renderJobTable(urgent, true);
  } else if (key === "newJobs") {
    title = "\uD83C\uDD95 New This Week (" + (d.newOpportunities||[]).length + ")";
    bodyHtml = renderJobTable(d.newOpportunities || [], true);
  } else if (key === "closedJobs") {
    title = "\u2705 Closed / Filled Jobs (" + (d.closedOpportunities||[]).length + ")";
    bodyHtml = renderJobTable((d.closedOpportunities||[]).slice(0,100), false);

    var tc = d.topConsultants || [];

      bodyHtml += '<td>'+esc(c.location||"\u2014")+'</td>';
      bodyHtml += '<td>'+esc(c.owner||"\u2014")+'</td>';
      bodyHtml += '</tr>';

      bodyHtml += '<td>'+esc(p.client||"\u2014")+'</td>';
      bodyHtml += '<td>'+esc(p.endDate)+'</td>';

      bodyHtml += '</tr>';

  } else if (key === "starts") {

function renderSmartMatch(){

function renderSmartMatchResults(r){

  if (r.job.roleLevel) matchDesc.push("Role: " + r.job.roleLevel);

    h+='<div style="margin-top:8px;padding:6px 12px;border-radius:6px;background:#f5f3ff;border:1px solid #ddd6fe;font-size:12px;color:#7c3aed;font-weight:500">👔 Leadership role detected — matching on role level, experience keywords, and profile depth in addition to certifications</div>';

  h+='</tr></thead><tbody>';

    h+='<td style="font-size:12px">'+(c.preferredRole?'<span style="padding:2px 8px;border-radius:10px;background:#ede9fe;color:#7c3aed;font-size:11px;font-weight:600">'+esc(c.preferredRole)+'</span>':'<span class="muted">\u2014</span>')+'</td>';
    h+='<td>'+(c.grade?'<span class="fw600" style="color:'+(gc[c.grade]||"#64748b")+'">'+esc(c.grade)+'</span>':'<span class="muted">\u2014</span>')+'</td>';
    h+='<td>'+(c.available&&c.available!=="\u2014"?'\uD83D\uDD52 '+esc(c.available):'<span class="muted">\u2014</span>')+'</td>';

    var factors = (c.matchFactors || []).slice(0, 3);

    else { h+='<span class="muted">\u2014</span>'; }

  });
  h+='</tbody></table></div>';

async function runSmartMatch(jobId){
  if(!jobId){_smResults=null;document.getElementById("sm-results").innerHTML=renderSmartMatch().match(/id="sm-results">([\s\S]*)/)[0];return;}
  document.getElementById("sm-loading").style.display="inline";
  try{
    var r=await apiFetch("smart-match/"+jobId);
    _smResults=r;
    document.getElementById("sm-results").innerHTML=renderSmartMatchResults(r);
  }catch(e){
    document.getElementById("sm-results").innerHTML=showLoadError("smart match",e.message);
  }
  document.getElementById("sm-loading").style.display="none";
}
async function populateJobDropdown(){
  try{
    var sel=document.getElementById("sm-job-select");
    if(!sel)return;
    var allJobs=[];
    var seen={};
    var statuses=["Accepting Candidates","Open"];
    for(var si=0;si<statuses.length;si++){
      try{
        var jr=await apiFetch("jobs",{status:statuses[si]});
        (jr.data||[]).forEach(function(j){
          if(!seen[j.id]){seen[j.id]=true;allJobs.push(j);}
        });
      }catch(e){}
    }
    if(allJobs.length===0){
      try{
        var jr2=await apiFetch("jobs",{status:"All"});
        (jr2.data||[]).forEach(function(j){
          if(!seen[j.id]){seen[j.id]=true;allJobs.push(j);}
        });
      }catch(e){}
    }
    var PRIO={"Urgent":"\uD83D\uDCA5","Hot":"\uD83D\uDD25","Warm":"\u2600\uFE0F","Cold":"\u2744\uFE0F"};
    allJobs.forEach(function(j){
      var opt=document.createElement("option");
      opt.value=j.id;
      opt.textContent=(PRIO[j.priority]||"")+' '+j.title+(j.client?" \u2014 "+j.client:"")+(j.status?" ["+j.status+"]":"");
      sel.appendChild(opt);
    });
    if(allJobs.length===0){
      var opt=document.createElement("option");
      opt.value="";opt.textContent="No jobs found — check Bullhorn sync";opt.disabled=true;
      sel.appendChild(opt);
    }
    // Auto-select if coming from dashboard
    if(window._smJobId){sel.value=window._smJobId;runSmartMatch(window._smJobId);window._smJobId=null;}
  }catch(e){}
}
function exportSmartMatch(){
  if(!_smResults)return;
  var cols=[
    {label:"Score",key:"score",exportVal:function(r){return String(r.score);}},
    {label:"Name",key:"name",exportVal:function(r){return r.firstName+" "+r.lastName;}},
    {label:"Primary Cert",key:"primaryCert",exportVal:function(r){return r.primaryCert||"";}},
    {label:"Grade",key:"grade",exportVal:function(r){return r.grade||"";}},
    {label:"Available",key:"available",exportVal:function(r){return r.available||"";}},
    {label:"Epic Role",key:"epicRole",exportVal:function(r){return r.epicRole||"";}},
    {label:"Location",key:"location",exportVal:function(r){return r.location||"";}},
    {label:"Email",key:"email",exportVal:function(r){return r.email||"";}},
    {label:"Phone",key:"phone",exportVal:function(r){return r.phone||"";}},
    {label:"Status",key:"status",exportVal:function(r){return r.status||"";}}

}

/* ═══ DATA QUALITY PAGE ═══ */
var _dqStatus="active";
var _dqFilter="all"; // all | critical | important | perfect
var _dqFieldFilter="all";
var _dqData=null;
function renderDataQuality(data){
  _dqData=data;
  var h='';
  // Status tabs
  h+='<div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap">';
  ["active","placed","all"].forEach(function(s){
    var label=s==="active"?"Active Candidates":s==="placed"?"Placed Consultants":"All Candidates";
    h+='<button class="chip'+(_dqStatus===s?" on":"")+'" onclick="_dqStatus=\''+s+'\';_dqFilter=\'all\';_dqFieldFilter=\'all\';loadPage()">'+label+'</button>';
  });

  if(!data||data.error){
    h+='<div class="empty-state"><div class="big">\u26A0\uFE0F</div><div class="title">Database Required</div><div class="sub">'+(data&&data.error?esc(data.error):"Data quality report requires local DB sync")+'</div></div>';

  }

  // Summary cards
  var healthColor=data.overallHealth>=80?"#059669":data.overallHealth>=60?"#d97706":"#dc2626";
  h+='<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px">';
  h+='<div class="stat-card"><div class="stat-label">Overall Health</div><div class="stat-num" style="color:'+healthColor+'">'+data.overallHealth+'%</div></div>';
  h+='<div class="stat-card"><div class="stat-label">Total Records</div><div class="stat-num">'+data.total+'</div></div>';
  h+='<div class="stat-card" style="cursor:pointer;'+ (_dqFilter==="perfect"?"outline:2px solid #059669":"") +'" onclick="_dqFilter=(_dqFilter===\'perfect\'?\'all\':\'perfect\');renderDQTable()"><div class="stat-label">\u2705 Complete</div><div class="stat-num" style="color:#059669">'+data.perfect+'</div></div>';
  h+='<div class="stat-card" style="cursor:pointer;'+ (_dqFilter==="critical"?"outline:2px solid #dc2626":"") +'" onclick="_dqFilter=(_dqFilter===\'critical\'?\'all\':\'critical\');renderDQTable()"><div class="stat-label">\uD83D\uDED1 Missing Critical</div><div class="stat-num" style="color:#dc2626">'+data.withCritical+'</div></div>';
  h+='<div class="stat-card" style="cursor:pointer;'+ (_dqFilter==="important"?"outline:2px solid #d97706":"") +'" onclick="_dqFilter=(_dqFilter===\'important\'?\'all\':\'important\');renderDQTable()"><div class="stat-label">\u26A0\uFE0F Important Only</div><div class="stat-num" style="color:#d97706">'+data.withImportantOnly+'</div></div>';
  h+='</div>';

  h+='<div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:16px 20px;margin-bottom:20px">';

  h+='<div style="display:flex;gap:10px;flex-wrap:wrap">';
  (data.fields||[]).forEach(function(f){
    var cnt=data.issuesByField[f.key]||0;
    if(cnt===0) return;
    var pct=data.total>0?Math.round((cnt/data.total)*100):0;
    var col=f.severity==="critical"?"#dc2626":"#d97706";

    h+='<div onclick="_dqFieldFilter=(_dqFieldFilter===\''+f.key+'\'?\'all\':\''+f.key+'\');renderDQTable()" style="cursor:pointer;background:'+(isActive?col+"15":"#fff")+';border:1px solid '+(isActive?col:"#e2e8f0")+';border-radius:8px;padding:8px 14px;text-align:center">';

function renderDQTable(){
  if(!_dqData) return;
  var cands=_dqData.candidates||[];
  // Apply filters
  var filtered=cands;
  if(_dqFilter==="critical") filtered=cands.filter(function(c){return c.missingCritical>0;});
  else if(_dqFilter==="important") filtered=cands.filter(function(c){return c.missingImportant>0&&c.missingCritical===0;});
  else if(_dqFilter==="perfect") filtered=cands.filter(function(c){return c.issues.length===0;});
  // Field filter
  if(_dqFieldFilter!=="all"){
    filtered=filtered.filter(function(c){
      return c.issues.some(function(i){
        var fieldKey=i.field.toLowerCase().replace(/[^a-z]/g,"");
        var filterKey=_dqFieldFilter.toLowerCase().replace(/[^a-z]/g,"");
        // Map field labels to keys
        var labelMap={"email":"email","cellphone":"phone","availabilitydate":"dateavailable","primarycertification":"primarycert","epicrole":"epicrole","grade":"grade","citystate":"address","titleoccupation":"occupation","ownerrecruiter":"owner"};
        var matchKey=labelMap[fieldKey]||fieldKey;
        return matchKey===_dqFieldFilter||fieldKey===_dqFieldFilter.replace(/[^a-z]/g,"");
      });
    });
  }
  var label=document.getElementById("dq-count-label");
  if(label) label.textContent="Showing "+filtered.length+" of "+_dqData.total+" candidates";

  var h='<div class="table-wrap"><table><thead><tr>';
  h+='<th>Name</th><th>Status</th><th>Owner</th><th>Health</th><th>Critical Missing</th><th>Other Missing</th><th>Issues</th>';
  h+='</tr></thead><tbody>';
  filtered.forEach(function(c){
    var hColor=c.health>=80?"#059669":c.health>=60?"#d97706":"#dc2626";
    h+='<tr onclick="openDetail('+c.id+')" style="cursor:pointer">';
    h+='<td><span class="name-link">'+esc(c.firstName+" "+c.lastName)+'</span></td>';
    h+='<td>'+esc(c.status)+'</td>';
    h+='<td>'+esc(c.owner||"—")+'</td>';
    h+='<td><span style="font-weight:700;color:'+hColor+'">'+c.health+'%</span></td>';
    h+='<td style="color:#dc2626;font-weight:600">'+(c.missingCritical>0?c.missingCritical:"—")+'</td>';
    h+='<td style="color:#d97706">'+(c.missingImportant>0?c.missingImportant:"—")+'</td>';
    h+='<td style="font-size:12px;max-width:300px;white-space:normal">';
    c.issues.forEach(function(iss){
      var col=iss.severity==="critical"?"#dc2626":"#d97706";
      var icon=iss.severity==="critical"?"\uD83D\uDED1":"\u26A0\uFE0F";
      h+='<span style="color:'+col+';margin-right:6px" title="'+esc(iss.type)+'">'+icon+' '+esc(iss.field)+'</span>';
    });
    if(c.issues.length===0) h+='<span style="color:#059669">\u2705 Complete</span>';
    h+='</td></tr>';
  });
  if(filtered.length===0) h+='<tr><td colspan="7" style="text-align:center;padding:40px;color:#94a3b8">No candidates match this filter</td></tr>';
  h+='</tbody></table></div>';
  var wrap=document.getElementById("dq-table-wrap");
  if(wrap) wrap.innerHTML=h;
}
function exportDQReport(){
  if(!_dqData||!_dqData.candidates) return;
  var cands=_dqData.candidates.filter(function(c){return c.issues.length>0;});
  var cols=[
    {key:"lastName",label:"Last Name"},
    {key:"firstName",label:"First Name"},
    {key:"status",label:"Status"},
    {key:"owner",label:"Owner"},
    {key:"health",label:"Health %"},
    {key:"missingCritical",label:"Critical Missing"},
    {key:"missingImportant",label:"Important Missing"},
    {key:"issueList",label:"Issues"}
  ];
  var rows=cands.map(function(c){
    var copy={};
    for(var k in c) copy[k]=c[k];
    copy.issueList=c.issues.map(function(i){return i.field+" ("+i.type+")";}).join("; ");
    return copy;
  });
  exportCSV("data-quality-report.csv",cols,rows);
}

/* ═══ PIPELINE ═══ */
var _pipeData = null;
var _pipeStage = null;
var _pipeDays = 90;
var _pipeView = "candidate"; // "candidate" | "job"

function loadPipeline(days) {
  _pipeDays = days || 90;
  return apiFetch("pipeline", { days: _pipeDays });
}

function pipeSetStage(stage) {
  _pipeStage = (_pipeStage === stage) ? null : stage;
  pipeRerender();
}
function pipeSetView(view) {
  _pipeView = view;
  pipeRerender();
}
function pipeSetDays(days) {
  _pipeDays = parseInt(days) || 90;
  var container = document.getElementById("content");
  if (container) container.innerHTML = '<div style="padding:48px;text-align:center"><span class="loading-spinner"></span> Loading pipeline…</div>';
  loadPipeline(_pipeDays).then(function(data) {
    _pipeData = data;
    _pipeStage = null;
    pipeRerender();
  }).catch(function(e) {
    if (container) container.innerHTML = showLoadError("pipeline", e.message);
  });
}
function pipeRerender() {
  if (_pipeData) {
    var container = document.getElementById("content");
    if (container) container.innerHTML = renderPipeline(_pipeData);
  }
}

function renderPipeline(data) {
  _pipeData = data;
  var stages = data.stages || {};
  var summary = data.summary || {};
  var total = data.total || 0;

  var html = '<div class="stats-row">';
  html += statCard("\uD83D\uDD04", "Pipeline Activity", total, "Last " + _pipeDays + " days", "#176087");
  var convRate = summary.placed && summary.submitted ? Math.round((summary.placed / summary.submitted) * 100) : 0;
  html += statCard("\uD83C\uDFAF", "Conversion Rate", convRate + "%", "Submitted → Placed", "#16a34a");
  var interviewRate = summary.interviewed && summary.submitted ? Math.round((summary.interviewed / summary.submitted) * 100) : 0;
  html += statCard("\uD83D\uDDE3\uFE0F", "Interview Rate", interviewRate + "%", "Submitted → Interviewed", "#7c3aed");
  html += '</div>';

  // Funnel stages
  var stageOrder = ["submitted","interviewed","offered","placed","rejected","declined","other"];
  var bgColors = {submitted:"#eff6ff",interviewed:"#f5f3ff",offered:"#ecfeff",placed:"#f0fdf4",rejected:"#fef2f2",declined:"#fffbeb",other:"#f8fafc"};

  html += '<div class="pipe-funnel">';
  stageOrder.forEach(function(key) {
    var s = stages[key];
    if (!s) return;
    var count = s.items ? s.items.length : 0;
    var pct = total > 0 ? Math.round((count / total) * 100) : 0;
    var isActive = _pipeStage === key;
    html += '<div class="pipe-stage' + (isActive ? ' active' : '') + '" style="background:' + bgColors[key] + ';color:' + s.color + '" onclick="pipeSetStage(\'' + key + '\')">';
    html += '<div class="ps-num">' + count + '</div>';
    html += '<div class="ps-lbl">' + esc(s.label) + '</div>';
    html += '<div class="ps-pct">' + pct + '% of total</div>';
    html += '</div>';
  });
  html += '</div>';

  // Time range + view toggle toolbar
  html += '<div class="pipe-toolbar">';
  html += '<select class="pipe-time-select" onchange="pipeSetDays(this.value)">';
  [30,60,90,180,365].forEach(function(d) {
    html += '<option value="' + d + '"' + (d === _pipeDays ? ' selected' : '') + '>' + (d === 365 ? 'Last 12 months' : 'Last ' + d + ' days') + '</option>';
  });
  html += '</select>';
  if (_pipeStage) {
    html += '<div class="pipe-toggle" style="margin-left:auto">';
    html += '<button class="' + (_pipeView === "candidate" ? "active" : "") + '" onclick="pipeSetView(\'candidate\')">By Candidate</button>';
    html += '<button class="' + (_pipeView === "job" ? "active" : "") + '" onclick="pipeSetView(\'job\')">By Job</button>';
    html += '</div>';
  }
  html += '</div>';

  // Drill-down table
  if (_pipeStage && stages[_pipeStage]) {
    var stageData = stages[_pipeStage];
    var items = stageData.items || [];

    html += '<h3 style="font-size:16px;font-weight:700;color:' + stageData.color + ';margin-bottom:12px">' + esc(stageData.label) + ' (' + items.length + ')</h3>';

    if (_pipeView === "job") {
      // Group by job
      var jobGroups = {};
      items.forEach(function(item) {

var EPIC_MODULES = {
  "Access & Revenue Cycle": ["Resolute PB (Professional Billing)","Resolute HB (Hospital Billing)","PB Claims","HB Claims","RTE","Eligibility","Charge Router","Financial Assistance","Benefits Engine","Tapestry","Patient Access","Cadence","Prelude / ADT","Grand Central","Referrals","ASAP"],

};

function slBuildRoleLists(lists) {
  var ROLE_LEVELS = ["Executive","Director","PM","Manager"];
  var roleLists = {};
  ROLE_LEVELS.forEach(function(r) { roleLists[r] = { name: r, candidates: [] }; });
  var seen = {};
  (lists || []).forEach(function(l) {
    (l.candidates || []).forEach(function(c) {
      var roles = (c.preferredRole || "").split(",").map(function(s){return s.trim();}).filter(Boolean);
      roles.forEach(function(role) {
        if (roleLists[role] && !seen[role + "_" + c.id]) {
          seen[role + "_" + c.id] = true;
          roleLists[role].candidates.push(c);
        }
      });
    });
  });
  return ROLE_LEVELS.map(function(r){return roleLists[r];}).filter(function(l){return l.candidates.length > 0;});
}

function slBuildModuleLists(lists) {
  var moduleMap = {};
  Object.keys(EPIC_MODULES).forEach(function(mod) { moduleMap[mod] = { name: mod, candidates: [], certs: [] }; });
  // Build reverse lookup: cert name → module
  var certToModule = {};
  Object.keys(EPIC_MODULES).forEach(function(mod) {
    EPIC_MODULES[mod].forEach(function(cert) { certToModule[cert.toLowerCase()] = mod; });
  });

  // "Director & Above" is role-based, not cert-based
  var directorSeen = {};
  var LEADER_ROLES = ["Executive","Director","PM","Manager"];

  (lists || []).forEach(function(l) {
    var certName = l.name;
    var matchedModule = null;
    // Try exact match first
    if (certToModule[certName.toLowerCase()]) {
      matchedModule = certToModule[certName.toLowerCase()];
    } else {
      // Fuzzy: check if cert name contains a known module cert
      Object.keys(certToModule).forEach(function(known) {
        if (!matchedModule && certName.toLowerCase().indexOf(known) !== -1) matchedModule = certToModule[known];
      });
    }
    if (!matchedModule) matchedModule = "Other";
    if (!moduleMap[matchedModule]) moduleMap[matchedModule] = { name: matchedModule, candidates: [], certs: [] };
    if (moduleMap[matchedModule].certs.indexOf(certName) === -1) moduleMap[matchedModule].certs.push(certName);

    var seen = {};
    l.candidates.forEach(function(c) {
      if (!seen[c.id]) {
        seen[c.id] = true;
        // Check if already in this module (from another cert in same module)
        var alreadyIn = moduleMap[matchedModule].candidates.some(function(ex){return ex.id===c.id;});
        if (!alreadyIn) moduleMap[matchedModule].candidates.push(c);
      }
      // Also check for Director & Above
      var roles = (c.preferredRole || "").split(",").map(function(s){return s.trim();}).filter(Boolean);
      var isLeader = roles.some(function(r){ return LEADER_ROLES.indexOf(r) !== -1 && r !== "Analyst"; });
      if (isLeader && !directorSeen[c.id]) {
        directorSeen[c.id] = true;
        moduleMap["Director & Above"].candidates.push(c);
      }
    });
  });

  // Sort modules: Director & Above first, then by count
  var result = Object.values(moduleMap).filter(function(m){return m.candidates.length > 0;});
  result.sort(function(a,b) {
    if (a.name === "Director & Above") return -1;
    if (b.name === "Director & Above") return 1;
    return b.candidates.length - a.candidates.length;
  });
  return result;
}

function slApplyDrillFilters(candidates) {
  var filtered = candidates;
  if (_slFilterGrade) { filtered = filtered.filter(function(c){ return c.grade === _slFilterGrade; }); }
  if (_slFilterStatus) { filtered = filtered.filter(function(c){ return c.status === _slFilterStatus; }); }
  if (_slFilterRole) { filtered = filtered.filter(function(c){ var allText = ((c.preferredRole||"")+" "+(c.epicRole||"")+" "+(c.title||"")).toLowerCase(); return allText.indexOf(_slFilterRole.toLowerCase()) !== -1; }); }
  return filtered;
}
