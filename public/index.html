<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anura Connect Dashboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f8fafc;color:#334155;display:flex;height:100vh;overflow:hidden}
aside{width:240px;background:#0E2E47;display:flex;flex-direction:column;flex-shrink:0}
aside .logo{padding:24px 20px 20px;border-bottom:1px solid #163a56;display:flex;align-items:center;gap:10px}
aside .logo-icon{width:36px;height:36px;border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center}
aside .logo-icon img{width:100%;height:100%;object-fit:cover}
aside .logo-text{font-size:16px;font-weight:700;color:#fff}
aside .logo-sub{font-size:11px;color:#64748b;font-weight:500}
aside nav{flex:1;padding:12px 10px}
aside nav button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 14px;border-radius:8px;border:none;margin-bottom:2px;font-size:14px;cursor:pointer;font-family:inherit;transition:background .15s}
aside nav button.active{background:#176087;color:#fff;font-weight:600}
aside nav button:not(.active){background:transparent;color:#94a3b8;font-weight:400}
aside nav button:not(.active):hover{background:#163a56}
aside .user-box{padding:16px 10px;border-top:1px solid #163a56}
aside .user-card{display:flex;align-items:center;gap:10px;padding:8px 14px;border-radius:8px;background:#163a56}
aside .avatar{width:32px;height:32px;border-radius:8px;background:#176087;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff}
aside .uname{font-size:13px;font-weight:600;color:#e2e8f0}
aside .urole{font-size:11px;color:#64748b}
main{flex:1;overflow:auto;display:flex;flex-direction:column}
header.top-bar{padding:20px 32px;background:#fff;border-bottom:1px solid #f1f5f9;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
header.top-bar h1{font-size:22px;font-weight:700;color:#0f172a}
.top-btns{display:flex;align-items:center;gap:8px}
.btn-outline{padding:8px 16px;border-radius:8px;border:1px solid #e2e8f0;background:#fff;font-size:13px;font-weight:500;color:#475569;cursor:pointer;font-family:inherit}
.btn-outline:hover{background:#f8fafc}
.btn-primary{padding:8px 16px;border-radius:8px;border:none;background:#176087;font-size:13px;font-weight:600;color:#fff;cursor:pointer;font-family:inherit}
.btn-primary:hover{background:#0E2E47}
.btn-export{padding:6px 12px;border-radius:8px;border:1px solid #e2e8f0;background:#fff;font-size:12px;font-weight:500;color:#475569;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:4px}
.btn-export:hover{background:#eff6ff;border-color:#53A2BE;color:#176087}
.content{padding:32px;flex:1;overflow:auto}
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.stat-card{background:#fff;border-radius:12px;padding:20px 24px;display:flex;align-items:center;gap:16px;box-shadow:0 1px 3px rgba(0,0,0,.06);border:1px solid #f1f5f9}
.stat-icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px}
.stat-label{font-size:13px;color:#64748b;margin-bottom:2px}
.stat-value{font-size:24px;font-weight:700;color:#0f172a}
.stat-sub{font-size:12px;color:#94a3b8;margin-top:2px}
.toolbar{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.search-wrap{position:relative;flex:1;max-width:480px}
.search-wrap span.ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:16px;color:#94a3b8}
.search-wrap input{width:100%;padding:10px 14px 10px 42px;border-radius:10px;border:1px solid #e2e8f0;font-size:14px;background:#fff;box-sizing:border-box;font-family:inherit}
.search-wrap input:focus{border-color:#176087;outline:none}
.chips{display:flex;gap:6px}
.chip{padding:6px 14px;border-radius:8px;font-size:13px;font-weight:500;white-space:nowrap;cursor:pointer;border:1px solid #e2e8f0;background:#fff;color:#475569;font-family:inherit}
.chip.on{border-color:#176087;background:#176087;color:#fff}
.sep{width:1px;height:24px;background:#e2e8f0}
.count-line{font-size:13px;color:#94a3b8;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.table-wrap{background:#fff;border-radius:12px;border:1px solid #f1f5f9;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;padding:10px 14px;color:#64748b;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;border-bottom:2px solid #f1f5f9;position:relative;min-width:60px}
th .col-resize{position:absolute;right:0;top:0;width:6px;height:100%;cursor:col-resize;background:transparent;z-index:2}
th .col-resize:hover,th .col-resize.active{background:#176087;opacity:.3;border-radius:2px}
td{padding:12px 14px;color:#334155;white-space:nowrap;border-bottom:1px solid #f8fafc;overflow:hidden;text-overflow:ellipsis;max-width:300px}
tbody tr{cursor:pointer;transition:background .1s}
tbody tr:hover{background:#eff6ff}
.badge{display:inline-block;padding:2px 10px;border-radius:9999px;font-size:12px;font-weight:600}
.name-link{font-weight:600;color:#176087}
.fw600{font-weight:600}
.muted{color:#94a3b8}
.green{color:#10b981}
.stars{display:inline-flex;gap:1px;font-size:14px}
.empty-state{padding:48px;text-align:center;color:#94a3b8}
.empty-state .big{font-size:32px;margin-bottom:8px;opacity:.5}
.empty-state .title{font-size:15px;font-weight:500}
.empty-state .sub{font-size:13px;margin-top:4px}
/* Advanced filters */
.adv-filters{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:16px 20px;margin-bottom:16px;display:none}
.adv-filters.open{display:block}
.adv-filters .row{display:flex;gap:16px;flex-wrap:wrap;align-items:end}
.adv-filters label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.03em}
.adv-filters input,.adv-filters select{padding:8px 12px;border:1px solid #e2e8f0;border-radius:8px;font-size:13px;font-family:inherit;color:#334155;min-width:140px}
.adv-filters input:focus,.adv-filters select:focus{border-color:#176087;outline:none}
.filter-toggle{padding:6px 12px;border-radius:8px;border:1px solid #e2e8f0;background:#fff;font-size:12px;font-weight:500;color:#475569;cursor:pointer;font-family:inherit}
.filter-toggle.has-filters{border-color:#176087;color:#176087;background:#eff6ff}
/* Detail panel */
.detail-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.3);z-index:100;display:none}
.detail-overlay.open{display:block}
.detail-panel{position:fixed;top:0;right:0;bottom:0;width:560px;background:#fff;z-index:101;box-shadow:-4px 0 24px rgba(0,0,0,.12);overflow-y:auto;transform:translateX(100%);transition:transform .25s ease}
.detail-panel.open{transform:translateX(0)}
.detail-header{padding:24px;border-bottom:1px solid #f1f5f9;display:flex;align-items:start;justify-content:space-between}
.detail-close{width:32px;height:32px;border-radius:8px;border:1px solid #e2e8f0;background:#fff;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;color:#64748b;flex-shrink:0}
.detail-close:hover{background:#f8fafc}
.detail-name{font-size:20px;font-weight:700;color:#0f172a}
.detail-title{font-size:14px;color:#64748b;margin-top:2px}
.detail-section{padding:20px 24px;border-bottom:1px solid #f1f5f9}
.detail-section h4{font-size:12px;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.detail-field{font-size:13px}
.detail-field .lbl{color:#94a3b8;font-size:11px;margin-bottom:2px}
.detail-field .val{color:#0f172a;font-weight:500}
.note-card{background:#f8fafc;border-radius:8px;padding:12px;margin-bottom:8px}
.note-card .note-meta{font-size:11px;color:#94a3b8;margin-bottom:4px}
.note-card .note-action{font-weight:600;color:#176087}
.note-card .note-text{font-size:13px;color:#334155;line-height:1.5}
/* Charts */
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
.chart-card{background:#fff;border-radius:12px;padding:24px;border:1px solid #f1f5f9}
.chart-card h3{font-size:15px;font-weight:600;color:#0f172a;margin-bottom:16px}
.legend{display:flex;gap:16px;margin-bottom:12px;font-size:12px}
.legend-dot{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:middle}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.bar-label{width:100px;font-size:13px;color:#64748b;text-align:right;flex-shrink:0}
.bar-track{flex:1;height:28px;background:#f1f5f9;border-radius:6px;overflow:hidden;position:relative}
.bar-fill{height:100%;border-radius:6px;transition:width .5s ease}
.bar-val{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:12px;font-weight:600;color:#475569}
.stacked-bar{display:flex;height:100%;border-radius:6px;overflow:hidden}
.stats-row-5{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:28px}
.loading-spinner{display:inline-block;width:16px;height:16px;border:2px solid #e2e8f0;border-top-color:#176087;border-radius:50%;animation:spin .6s linear infinite;margin-right:8px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
/* Tearsheet */
.ts-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;justify-content:center;align-items:flex-start;padding:40px;overflow-y:auto}
.ts-overlay.open{display:flex}
.ts-sheet{background:#fff;max-width:700px;width:100%;border-radius:16px;padding:48px;box-shadow:0 20px 60px rgba(0,0,0,.15);position:relative}
.ts-sheet .ts-close{position:absolute;top:16px;right:16px;background:none;border:none;font-size:20px;cursor:pointer;color:#94a3b8;padding:8px}
.ts-sheet .ts-close:hover{color:#0f172a}
.ts-brand{display:flex;align-items:center;gap:12px;margin-bottom:24px;padding-bottom:16px;border-bottom:3px solid #176087}
.ts-brand .ts-logo{font-size:24px;font-weight:800;color:#176087}
.ts-brand .ts-sub{font-size:12px;color:#94a3b8;text-transform:uppercase;letter-spacing:.08em}
.ts-name{font-size:28px;font-weight:700;color:#0E2E47;margin-bottom:4px}
.ts-title{font-size:16px;color:#64748b;margin-bottom:16px}
.ts-section{margin-bottom:24px}
.ts-section h4{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:#176087;font-weight:700;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid #e2e8f0}
.ts-row{display:grid;grid-template-columns:1fr 1fr;gap:8px 24px;font-size:14px}
.ts-row .ts-label{color:#94a3b8;font-size:12px}
.ts-row .ts-val{color:#0f172a;font-weight:500;margin-bottom:8px}
.ts-notes{font-size:13px;color:#334155;line-height:1.7;white-space:pre-wrap}
.ts-actions{display:flex;gap:10px;margin-top:24px;padding-top:16px;border-top:1px solid #e2e8f0}
.ts-actions button{padding:8px 20px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
/* Smart Lists */
.sl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.sl-card{background:#fff;border-radius:12px;border:1px solid #e2e8f0;padding:20px;cursor:pointer;transition:box-shadow .15s,border-color .15s}
.sl-card:hover{box-shadow:0 4px 12px rgba(0,0,0,.08);border-color:#176087}
.sl-card .sl-name{font-size:16px;font-weight:700;color:#0E2E47;margin-bottom:4px}
.sl-card .sl-count{font-size:28px;font-weight:800;color:#176087}
.sl-card .sl-sub{font-size:12px;color:#94a3b8;margin-top:4px}
/* Ask Anura chat */
.ask-container{max-width:800px;margin:0 auto}
.ask-messages{min-height:200px;max-height:520px;overflow-y:auto;margin-bottom:16px;display:flex;flex-direction:column;gap:12px}
.ask-msg{padding:14px 18px;border-radius:14px;max-width:85%;font-size:14px;line-height:1.6;word-wrap:break-word}
.ask-msg.user{background:#176087;color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.ask-msg.bot{background:#fff;color:#334155;align-self:flex-start;border:1px solid #e2e8f0;border-bottom-left-radius:4px}
.ask-msg.bot strong{color:#0E2E47}
.ask-input-row{display:flex;gap:10px}
.ask-input-row input{flex:1;padding:12px 18px;border-radius:12px;border:1px solid #e2e8f0;font-size:14px;font-family:inherit}
.ask-input-row input:focus{border-color:#176087;outline:none}
.ask-input-row button{padding:12px 24px;border-radius:12px;border:none;background:#176087;color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.ask-input-row button:hover{background:#0E2E47}
.ask-suggestions{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.ask-sug{padding:8px 14px;border-radius:20px;border:1px solid #e2e8f0;background:#fff;font-size:12px;color:#475569;cursor:pointer;font-family:inherit;transition:all .15s}
.ask-sug:hover{border-color:#176087;background:#eff6ff;color:#176087}
.ask-data-table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}
.ask-data-table th{text-align:left;padding:8px 10px;background:#f8fafc;color:#64748b;font-weight:600;font-size:11px;text-transform:uppercase;border-bottom:2px solid #e2e8f0}
.ask-data-table td{padding:8px 10px;border-bottom:1px solid #f1f5f9}
/* Touch report */
.touch-tabs{display:flex;gap:4px;margin-bottom:20px}
.touch-tab{padding:10px 20px;border-radius:10px 10px 0 0;border:1px solid #e2e8f0;border-bottom:none;background:#f8fafc;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;color:#64748b}
.touch-tab.on{background:#fff;color:#176087;font-weight:600;border-color:#e2e8f0}
.urgency-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.urgency-high{background:#ef4444}
.urgency-med{background:#f59e0b}
.urgency-low{background:#10b981}
@media(max-width:900px){.chart-grid{grid-template-columns:1fr} aside{width:200px} .detail-panel{width:100%}}
</style>
</head>
<body>
<!-- Sidebar -->
<aside>
  <div class="logo">
    <div class="logo-icon"><img src="https://images.squarespace-cdn.com/content/v1/671fb0d9fec6997ddc5025cd/79107203-ad2e-4d39-96a6-5faa3f2f70bf/fulllogo_transparent_nobuffer.png" alt="Anura"></div>
    <div><div class="logo-text">Anura Connect</div><div class="logo-sub">Bullhorn Dashboard</div></div>
  </div>
  <nav id="nav"></nav>
  <div class="user-box" id="user-box">
    <div class="user-card" style="cursor:pointer" onclick="window.location.href='/auth/login'">
      <div class="avatar" style="background:#334155">?</div>
      <div><div class="uname">Sign In</div><div class="urole">with Bullhorn</div></div>
    </div>
  </div>
</aside>
<!-- Main -->
<main>
  <header class="top-bar">
    <h1 id="page-title">Candidates</h1>
    <div class="top-btns">
      <span id="api-status" style="font-size:12px;padding:6px 12px;border-radius:8px;margin-right:4px"></span>
      <button id="save-search-btn" class="btn-outline" style="display:none" onclick="saveCurrentSearch()">&#x1F516; Save Search</button>
      <button class="btn-outline" onclick="loadPage()">&#x1F504; Sync</button>
    </div>
  </header>
  <div id="sync-banner" style="display:none;align-items:center;gap:8px;padding:8px 32px;font-size:12px;font-weight:500;border-bottom:1px solid #bbf7d0"></div>
  <div class="content" id="content"></div>
</main>
<!-- Detail panel -->
<div class="detail-overlay" id="detail-overlay" onclick="closeDetail()"></div>
<div class="detail-panel" id="detail-panel">
  <div id="detail-content"></div>
</div>
<!-- Tearsheet overlay -->
<div class="ts-overlay" id="ts-overlay" onclick="if(event.target===this)closeTearsheet()">
  <div class="ts-sheet" id="ts-content"></div>
</div>

<script>
/* ═══ API + DATA LAYER ═══ */
var API_BASE = "";
var apiConnected = false;
var currentUser = null; // { name, firstName, lastName, email, id }
var _lastData = { candidates:[], jobs:[], placements:[], clients:[] };

async function apiFetch(endpoint, opts) {
  // If opts has method/body/headers, treat as fetch options (POST/PUT)
  if (opts && (opts.method || opts.body)) {
    var res = await fetch(API_BASE + "/api/" + endpoint, opts);
    if (!res.ok) {
      var errText = ""; try { errText = (await res.json()).error || ""; } catch(e) {}
      throw new Error("API " + res.status + (errText ? ": " + errText : ""));
    }
    return res.json();
  }
  // Otherwise treat as GET with query params
  var qs = opts ? "?" + new URLSearchParams(opts).toString() : "";
  var res = await fetch(API_BASE + "/api/" + endpoint + qs);
  if (!res.ok) throw new Error("API " + res.status);
  return res.json();
}
var dbSyncStatus = null;
async function checkConnection() {
  try {
    var r = await apiFetch("status");
    apiConnected = r.connected;
    if (r.user) { currentUser = r.user; } else { currentUser = null; }
    if (r.db) { dbSyncStatus = r.db; }
  } catch(e) { apiConnected = false; currentUser = null; }
  updateStatusBadge();
  updateUserBox();
  updateSyncBanner();
}
function updateSyncBanner() {
  var el = document.getElementById("sync-banner");
  if (!el) return;
  if (!dbSyncStatus || !dbSyncStatus.enabled) { el.style.display = "none"; return; }
  var ls = dbSyncStatus.lastSync;
  if (!ls || !ls.time) { el.style.display = "none"; return; }
  var ago = Math.round((Date.now() - new Date(ls.time).getTime()) / 60000);
  var agoText = ago < 1 ? "just now" : ago + "m ago";
  if (ls.success) {
    el.style.display = "flex";
    el.style.background = "#f0fdf4"; el.style.borderColor = "#bbf7d0"; el.style.color = "#166534";
    el.innerHTML = "\uD83D\uDDD8 Data synced " + agoText + " &mdash; " + esc(ls.message);
  } else {
    el.style.display = "flex";
    el.style.background = "#fefce8"; el.style.borderColor = "#fef08a"; el.style.color = "#854d0e";
    el.innerHTML = "\u26A0\uFE0F Sync issue " + agoText + " &mdash; " + esc(ls.message);
  }
}
function updateUserBox() {
  var box = document.getElementById("user-box");
  if (!box) return;
  if (currentUser) {
    var initials = ((currentUser.firstName||"").charAt(0) + (currentUser.lastName||"").charAt(0)).toUpperCase();
    box.innerHTML = '<div class="user-card">'
      + '<div class="avatar">' + initials + '</div>'
      + '<div><div class="uname">' + esc(currentUser.name) + '</div><div class="urole" style="cursor:pointer" onclick="window.location.href=\'/auth/logout\'">Sign Out</div></div>'
      + '</div>';
  } else {
    box.innerHTML = '<div class="user-card" style="cursor:pointer" onclick="window.location.href=\'/auth/login\'">'
      + '<div class="avatar" style="background:#334155">?</div>'
      + '<div><div class="uname">Sign In</div><div class="urole">with Bullhorn</div></div>'
      + '</div>';
  }
}
function updateStatusBadge() {
  var el = document.getElementById("api-status");
  if (!el) return;
  if (apiConnected) { el.style.background="#dcfce7"; el.style.color="#176087"; el.textContent="\uD83D\uDFE2 Connected to Bullhorn"; }
  else { el.style.background="#fef2f2"; el.style.color="#dc2626"; el.textContent="\uD83D\uDD34 Not Connected"; }
}
function showConnectionError() {
  return '<div style="background:#fef2f2;border:1px solid #fecaca;border-radius:12px;padding:32px;text-align:center;margin:20px 0">'
    + '<div style="font-size:28px;margin-bottom:8px">\u26A0\uFE0F</div>'
    + '<div style="font-size:16px;font-weight:600;color:#dc2626;margin-bottom:4px">Not Connected to Bullhorn</div>'
    + '<div style="font-size:13px;color:#64748b;max-width:400px;margin:0 auto">Make sure the server is running (<code>npm start</code>) and your Bullhorn credentials are configured in the .env file.</div>'
    + '<button class="btn-primary" style="margin-top:16px" onclick="checkConnection().then(function(){loadPage();})">\uD83D\uDD04 Retry Connection</button>'
    + '</div>';
}
function showLoadError(entity, errMsg) {
  return '<div style="background:#fef2f2;border:1px solid #fecaca;border-radius:12px;padding:24px;text-align:center;margin:20px 0">'
    + '<div style="font-size:22px;margin-bottom:6px">\u26A0\uFE0F</div>'
    + '<div style="font-size:15px;font-weight:600;color:#dc2626;margin-bottom:4px">Failed to load ' + entity + '</div>'
    + '<div style="font-size:12px;color:#94a3b8;font-family:monospace;margin-bottom:12px">' + esc(errMsg) + '</div>'
    + '<button class="btn-outline" onclick="loadPage()">\uD83D\uDD04 Retry</button>'
    + '</div>';
}

/* ═══ ASYNC DATA LOADERS ═══ */
async function loadCandidates(q,status,loc,cert,avail,grade,epicRole){
  if(!apiConnected) throw new Error("Not connected");

/* ═══ HELPERS ═══ */
function badge(s){var c=SC[s]||"#94a3b8";return '<span class="badge" style="background:'+c+'18;color:'+c+';border:1px solid '+c+'40">'+s+'</span>';}
function ptBadge(t){var d=t==="Direct Hire";return '<span class="badge" style="background:'+(d?"#dbeafe":"#fce7f3")+';color:'+(d?"#2563eb":"#db2777")+';border:1px solid '+(d?"#93c5fd":"#f9a8d4")+'">'+t+'</span>';}
function stars(n){var s="";for(var i=1;i<=5;i++)s+='<span style="color:'+(i<=n?"#f59e0b":"#d1d5db")+'">'+(i<=n?"\u2605":"\u2606")+'</span>';return '<span class="stars">'+s+'</span>';}
function esc(s){return s==null?"":String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

var _sortCol=null,_sortDir="asc";
function sortTable(colKey){
  if(_sortCol===colKey){_sortDir=_sortDir==="asc"?"desc":"asc";}else{_sortCol=colKey;_sortDir="asc";}
  render();
}
function applySorting(rows,cols){
  if(!_sortCol)return rows;
  var col=null;for(var i=0;i<cols.length;i++){if(cols[i].key===_sortCol){col=cols[i];break;}}
  if(!col)return rows;
  var sorted=rows.slice().sort(function(a,b){
    var av=col.exportVal?col.exportVal(a):(a[col.key]||"");
    var bv=col.exportVal?col.exportVal(b):(b[col.key]||"");
    var an=parseFloat(String(av).replace(/[^0-9.\-]/g,"")),bn=parseFloat(String(bv).replace(/[^0-9.\-]/g,""));
    if(!isNaN(an)&&!isNaN(bn))return _sortDir==="asc"?an-bn:bn-an;
    av=String(av).toLowerCase();bv=String(bv).toLowerCase();
    if(av<bv)return _sortDir==="asc"?-1:1;if(av>bv)return _sortDir==="asc"?1:-1;return 0;
  });
  return sorted;
}
var _hiddenCols={};
function isColVisible(key){
  var hidden=_hiddenCols[currentPage]||{};
  return !hidden[key];
}
function toggleColVisibility(key){
  if(!_hiddenCols[currentPage])_hiddenCols[currentPage]={};
  _hiddenCols[currentPage][key]=!_hiddenCols[currentPage][key];
  loadPage();
}
function makeColToggle(cols){
  var h='<div style="position:relative;display:inline-block">';
  h+='<button onclick="var d=this.nextElementSibling;d.style.display=d.style.display===\'block\'?\'none\':\'block\'" style="background:none;border:1px solid #e2e8f0;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:13px;color:#64748b" title="Show/hide columns">\u2699\uFE0F Columns</button>';
  h+='<div style="display:none;position:absolute;right:0;top:100%;background:#fff;border:1px solid #e2e8f0;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.1);padding:8px 0;z-index:100;min-width:180px;max-height:300px;overflow-y:auto">';
  cols.forEach(function(c){
    var vis=isColVisible(c.key);
    h+='<label style="display:flex;align-items:center;gap:8px;padding:6px 14px;cursor:pointer;font-size:12px;white-space:nowrap;hover:background:#f8fafc">';
    h+='<input type="checkbox" '+(vis?"checked":"")+' onchange="toggleColVisibility(\''+c.key+'\')">';
    h+=esc(c.label)+'</label>';
  });
  h+='</div></div>';
  return h;
}
function makeTable(cols,rows,onRowClick){
  if(!rows.length)return '<div class="empty-state"><div class="big">\u26A0</div><div class="title">No results found</div><div class="sub">Try adjusting your search or filters</div></div>';
  var visCols=cols.filter(function(c){return isColVisible(c.key);});
  var sorted=applySorting(rows,visCols);
  var tid='tbl-'+Date.now();
  var h='<table id="'+tid+'"><thead><tr>';
  visCols.forEach(function(c){
    var arrow=_sortCol===c.key?(_sortDir==="asc"?" \u25B2":" \u25BC"):"";
    h+='<th style="cursor:pointer;user-select:none" onclick="sortTable(\''+c.key+'\')">'+c.label+arrow+'<div class="col-resize"></div></th>';
  });
  h+='</tr></thead><tbody>';
  sorted.forEach(function(r,idx){
    var origIdx=rows.indexOf(r);
    var click=onRowClick?' onclick="'+onRowClick+'('+(origIdx>=0?origIdx:idx)+')"':'';
    h+='<tr'+click+'>';
    visCols.forEach(function(c){h+='<td>'+(c.render?c.render(r):esc(r[c.key]))+'</td>';});
    h+='</tr>';
  });
  h+='</tbody></table>';
  setTimeout(function(){initColResize(tid);},50);
  return h;
}
var _savedColWidths={};
function initColResize(tableId){
  var tbl=document.getElementById(tableId);
  if(!tbl)return;
  tbl.style.tableLayout='fixed';
  var ths=tbl.querySelectorAll('thead th');
  // Restore saved widths or use auto sizing
  var saved=_savedColWidths[tableId];
  ths.forEach(function(th,i){
    if(saved&&saved[i]){th.style.width=saved[i]+'px';}
    else{th.style.width=th.offsetWidth+'px';}
  });
  tbl.style.width='100%';
  ths.forEach(function(th,colIdx){
    var handle=th.querySelector('.col-resize');
    if(!handle)return;
    var startX,startW;
    handle.addEventListener('mousedown',function(e){
      e.preventDefault();e.stopPropagation();
      startX=e.pageX;startW=th.offsetWidth;
      handle.classList.add('active');
      function onMove(ev){
        var newW=Math.max(40,startW+(ev.pageX-startX));
        th.style.width=newW+'px';
        // Save width so it persists across re-renders
        if(!_savedColWidths[tableId])_savedColWidths[tableId]={};
        _savedColWidths[tableId][colIdx]=newW;
      }
      function onUp(){handle.classList.remove('active');document.removeEventListener('mousemove',onMove);document.removeEventListener('mouseup',onUp);}
      document.addEventListener('mousemove',onMove);
      document.addEventListener('mouseup',onUp);
    });
  });
}

/* ═══ CSV EXPORT ═══ */
function exportCSV(filename, cols, rows) {
  var csv = cols.map(function(c){return '"'+c.label+'"';}).join(",") + "\n";
  rows.forEach(function(r){
    csv += cols.map(function(c){
      var v = c.exportVal ? c.exportVal(r) : (r[c.key]==null?"":String(r[c.key]));
      return '"' + v.replace(/"/g,'""') + '"';
    }).join(",") + "\n";
  });
  var blob = new Blob([csv], {type:"text/csv;charset=utf-8;"});
  var link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = filename;
  link.click();
}

function openDetail(candidateId, candidateData) {
  var p = document.getElementById("detail-panel");
  var o = document.getElementById("detail-overlay");
  var dc = document.getElementById("detail-content");

  // Show panel with loading state
  dc.innerHTML = '<div style="padding:48px;text-align:center"><span class="loading-spinner"></span> Loading candidate details...</div>';
  p.classList.add("open");
  o.classList.add("open");

  if (apiConnected) {
    apiFetch("candidates/" + candidateId).then(function(d) {
      dc.innerHTML = renderDetailContent(d);
      loadSubmissions(candidateId);
    }).catch(function(e) {
      dc.innerHTML = renderDetailContent(candidateData);
    });
  } else {
    dc.innerHTML = renderDetailContent(candidateData);
  }
}
function loadSubmissions(candidateId) {
  apiFetch("candidates/" + candidateId + "/submissions").then(function(r) {
    var el = document.getElementById("detail-submissions");
    if (!el) return;
    var subs = r.data || [];
    var h = '<h4>Submissions (' + subs.length + ')</h4>';
    if (subs.length === 0) {
      h += '<div style="color:#94a3b8;font-size:13px;padding:8px 0">No submissions yet</div>';
    } else {
      subs.forEach(function(s) {
        h += '<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f1f5f9">';
        h += '<div style="flex:1"><div style="font-weight:600;font-size:13px;color:#176087">' + esc(s.job) + '</div>';
        h += '<div style="font-size:11px;color:#94a3b8">' + esc(s.date) + (s.submittedBy ? ' by ' + esc(s.submittedBy) : '') + '</div></div>';
        h += badge(s.status);
        h += '</div>';
      });
    }
    el.innerHTML = h;
  }).catch(function(e) {
    var el = document.getElementById("detail-submissions");
    if (el) el.innerHTML = '<h4>Submissions</h4><div style="color:#94a3b8;font-size:12px">Could not load submissions</div>';
  });
}

function closeDetail() {
  document.getElementById("detail-panel").classList.remove("open");
  document.getElementById("detail-overlay").classList.remove("open");
}

function dField(label, value, isHtml, style) {
  var v = isHtml ? (value||"—") : esc(value||"—");

// ── DETAIL PANEL ACTIONS ──
function showAddNoteForm() {
  var el = document.getElementById("detail-add-note");
  if(el) { el.style.display = "block"; el.scrollIntoView({behavior:"smooth"}); }
}

function submitNote() {
  var c = window._lastDetailCandidate;
  if(!c) return;
  var action = document.getElementById("note-action-select").value;
  var comments = document.getElementById("note-comments-input").value;
  if(!comments.trim()) { alert("Please enter note text"); return; }

  var btn = event.target;
  btn.textContent = "Saving...";
  btn.disabled = true;

  apiFetch("candidates/" + c.id + "/notes", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ action: action, comments: comments })
  }).then(function(r) {
    btn.textContent = "Saved!";
    btn.style.background = "#16a34a";
    document.getElementById("note-comments-input").value = "";
    // Refresh the detail panel after a beat
    setTimeout(function() { openDetail(c.id, c); }, 800);
  }).catch(function(e) {
    btn.textContent = "Error";
    btn.style.background = "#dc2626";
    alert("Failed to save note: " + e.message);
    setTimeout(function() { btn.textContent = "Save Note"; btn.disabled = false; btn.style.background = "#16a34a"; }, 2000);
  });
}

function showSubmitForm() {
  var el = document.getElementById("detail-submit-job");
  if(el) { el.style.display = "block"; el.scrollIntoView({behavior:"smooth"}); }
  // Load open jobs into the dropdown
  var sel = document.getElementById("submit-job-select");
  if(sel) {
    sel.innerHTML = '<option value="">Loading jobs...</option>';
    apiFetch("jobs?status=Accepting+Candidates").then(function(r) {
      var jobs = r.data || [];
      if(jobs.length === 0) {
        // Try "Open" as fallback
        return apiFetch("jobs?status=Open").then(function(r2) { return r2.data || []; });
      }
      return jobs;
    }).then(function(jobs) {
      var opts = '<option value="">Select a job...</option>';
      jobs.forEach(function(j) {
        opts += '<option value="'+j.id+'">'+esc(j.title||"Job #"+j.id)+' — '+esc(j.client||"")+(j.status?' ['+esc(j.status)+']':'')+'</option>';
      });
      sel.innerHTML = opts;
    }).catch(function(e) {
      sel.innerHTML = '<option value="">Failed to load jobs</option>';
    });
  }
}

function submitToJob() {
  var c = window._lastDetailCandidate;
  if(!c) return;
  var jobId = document.getElementById("submit-job-select").value;
  var comments = document.getElementById("submit-comments-input").value;
  if(!jobId) { alert("Please select a job"); return; }

  var btn = event.target;
  btn.textContent = "Submitting...";
  btn.disabled = true;

  apiFetch("submissions", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ candidateId: c.id, jobId: parseInt(jobId), comments: comments })
  }).then(function(r) {
    btn.textContent = "Submitted!";
    btn.style.background = "#7c3aed";
    document.getElementById("submit-comments-input").value = "";
    // Refresh submissions list
    setTimeout(function() { openDetail(c.id, c); }, 800);
  }).catch(function(e) {
    btn.textContent = "Error";
    btn.style.background = "#dc2626";
    alert("Failed to submit: " + e.message);
    setTimeout(function() { btn.textContent = "Submit Candidate"; btn.disabled = false; btn.style.background = "#7c3aed"; }, 2000);
  });
}

function detailSendEmail() {
  var c = window._lastDetailCandidate;
  if(!c || !c.email) return;
  window.open("mailto:" + c.email + "?subject=" + encodeURIComponent("Anura Connect — " + (c.firstName||"") + " " + (c.lastName||"")), "_blank");
}

async function populateJobDropdown(){
  try{
    var sel=document.getElementById("sm-job-select");
    if(!sel)return;
    var allJobs=[];
    var seen={};
    var statuses=["Accepting Candidates","Open"];
    for(var si=0;si<statuses.length;si++){
      try{
        var jr=await apiFetch("jobs",{status:statuses[si]});
        (jr.data||[]).forEach(function(j){
          if(!seen[j.id]){seen[j.id]=true;allJobs.push(j);}
        });
      }catch(e){}
    }
    if(allJobs.length===0){
      try{
        var jr2=await apiFetch("jobs",{status:"All"});
        (jr2.data||[]).forEach(function(j){
          if(!seen[j.id]){seen[j.id]=true;allJobs.push(j);}
        });
      }catch(e){}
    }
    var PRIO={"Urgent":"\uD83D\uDCA5","Hot":"\uD83D\uDD25","Warm":"\u2600\uFE0F","Cold":"\u2744\uFE0F"};
    allJobs.forEach(function(j){
      var opt=document.createElement("option");
      opt.value=j.id;
      opt.textContent=(PRIO[j.priority]||"")+' '+j.title+(j.client?" \u2014 "+j.client:"")+(j.status?" ["+j.status+"]":"");
      sel.appendChild(opt);
    });
    if(allJobs.length===0){
      var opt=document.createElement("option");
      opt.value="";opt.textContent="No jobs found — check Bullhorn sync";opt.disabled=true;

    }

async function askQuestion(presetQ) {
  var input = document.getElementById("ask-input");
  var q = presetQ || (input ? input.value.trim() : "");
  if (!q) return;
  if (input) input.value = "";

  _askHistory.push({ role: "user", html: esc(q) });
  renderAskMessages();

  // Show loading
  _askHistory.push({ role: "bot", html: '<span class="loading-spinner"></span> Thinking\u2026' });
  renderAskMessages();

  try {
    var r = await apiFetch("ask", { q: q });
    _askHistory.pop(); // remove loading

    var responseHtml = (r.answer || "").replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/\n/g, "<br>");

    // If there's data, render a table
    if (r.data && r.data.length > 0) {
      var keys = Object.keys(r.data[0]).filter(function(k) { return k !== "id"; });
      var askId = "ask-table-" + Date.now();
      var total = r.data.length;
      var previewCount = Math.min(20, total);
      responseHtml += '<table class="ask-data-table" id="' + askId + '"><thead><tr>';
      keys.forEach(function(k) {
        responseHtml += '<th>' + k.replace(/([A-Z])/g, " $1").replace(/^./, function(s){return s.toUpperCase();}) + '</th>';
      });
      responseHtml += '</tr></thead><tbody>';
      r.data.forEach(function(row, idx) {
        var hidden = idx >= previewCount ? ' style="display:none" class="ask-extra-row"' : '';
        var clickAttr = row.id ? ' style="cursor:pointer'+(idx >= previewCount ? ';display:none':'')+ '" class="'+(idx >= previewCount ? 'ask-extra-row':'')+'" onclick="openDetail('+row.id+')"' : hidden;
        responseHtml += '<tr' + clickAttr + '>';
        keys.forEach(function(k) { responseHtml += '<td>' + esc(String(row[k] || "\u2014")) + '</td>'; });
        responseHtml += '</tr>';
      });
      responseHtml += '</tbody></table>';
      if (total > previewCount) {
        responseHtml += '<div style="display:flex;gap:8px;align-items:center;margin-top:8px">';
        responseHtml += '<span style="font-size:12px;color:#94a3b8">Showing ' + previewCount + ' of ' + total + ' results</span>';
        responseHtml += '<button style="font-size:12px;padding:4px 12px;border-radius:6px;border:1px solid #176087;background:#fff;color:#176087;cursor:pointer;font-weight:600" onclick="this.parentElement.querySelector(\'span\').textContent=\'Showing all ' + total + ' results\';this.style.display=\'none\';document.querySelectorAll(\'#' + askId + ' .ask-extra-row\').forEach(function(r){r.style.display=\'\'})">View All ' + total + '</button>';
        responseHtml += '<button style="font-size:12px;padding:4px 12px;border-radius:6px;border:1px solid #10b981;background:#10b981;color:#fff;cursor:pointer;font-weight:600" onclick="exportAskData(\''+askId+'\')">Export CSV</button>';
        responseHtml += '</div>';
      }
      // Store data for CSV export
      window['_askExport_'+askId] = {keys:keys, data:r.data};
    }

    _askHistory.push({ role: "bot", html: responseHtml });
  } catch (e) {
    _askHistory.pop();
    _askHistory.push({ role: "bot", html: '\u26A0\uFE0F Sorry, something went wrong: ' + esc(e.message) });
  }
  renderAskMessages();
}

function exportAskData(tableId) {
  var exp = window['_askExport_'+tableId];
  if (!exp) return;
  var csv = exp.keys.map(function(k){return '"'+k.replace(/([A-Z])/g," $1").replace(/^./,function(s){return s.toUpperCase();})+'"';}).join(",")+"\n";
  exp.data.forEach(function(row){
    csv += exp.keys.map(function(k){return '"'+String(row[k]||"").replace(/"/g,'""')+'"';}).join(",")+"\n";
  });
  var blob = new Blob([csv],{type:"text/csv"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "ask-anura-results.csv";
  a.click();
}

function exportTouches() {
  // Export current touch tab as CSV
  var el = document.querySelector(".table-wrap table");
  if (!el) return;
  var rows = Array.from(el.querySelectorAll("tr"));
  var csv = rows.map(function(r) {
    return Array.from(r.querySelectorAll("th,td")).map(function(c) { return '"' + c.textContent.replace(/"/g, '""') + '"'; }).join(",");
  }).join("\n");
  var blob = new Blob([csv], { type: "text/csv" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "touch-report-" + _touchTab + ".csv";
  a.click();
}

function highlightConfigTmpl(label){
  var all=label.parentElement.querySelectorAll("label");
  for(var i=0;i<all.length;i++) all[i].style.borderColor="#e2e8f0";
  label.style.borderColor="#176087";
  label.querySelector("input").checked=true;
}

async function savePortalConfig(){
  var statusEl=document.getElementById("config-save-status");
  if(statusEl) statusEl.textContent="Saving...";

  var templateEl=document.querySelector('input[name="config-template"]:checked');
  var sectionEls=document.querySelectorAll('input[name="config-section"]:checked');
  var sections=[];
  for(var i=0;i<sectionEls.length;i++) sections.push(sectionEls[i].value);

  var config={
    templateId:templateEl?templateEl.value:"",
    sections:sections,
    referenceCount:parseInt(document.getElementById("config-ref-count").value)||3,
    defaults:{
      vmsProvider:(document.getElementById("config-vmsProvider").value||"").trim(),
      billRate:(document.getElementById("config-billRate").value||"").trim(),
      payRate:(document.getElementById("config-payRate").value||"").trim(),
      vmsFee:(document.getElementById("config-vmsFee").value||"").trim(),
    },
    notes:(document.getElementById("config-notes").value||"").trim(),
  };

  try{
    var resp=await fetch("/api/portal/client-config/"+_portalSelectedClient,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(config)
    });
    if(!resp.ok) throw new Error("Save failed");
    var res=await resp.json();
    _portalClientConfig=config;
    _portalClientConfig.configured=true;
    if(statusEl) statusEl.textContent="Saved!";
    setTimeout(function(){ if(statusEl) statusEl.textContent=""; },3000);
  }catch(e){
    if(statusEl){ statusEl.textContent="Error: "+e.message; statusEl.style.color="#ef4444"; }
  }
}

async function loadPrefillFields(templateId){
  var container=document.getElementById("portal-prefill-fields");

  if(!templateId){ container.innerHTML='<p style="font-size:13px;color:#94a3b8">Select a template first.</p>'; return; }

    _portalPrefillFields=await apiFetch("portal/prefill-fields",{templateId:templateId});

      container.innerHTML='<p style="font-size:13px;color:#94a3b8;font-style:italic">No pre-fillable fields for this template.</p>';

    var defaults=(_portalClientConfig&&_portalClientConfig.defaults)||{};
    var html='<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">';
    var currentSection="";
    for(var i=0;i<_portalPrefillFields.length;i++){

      if(f.section!==currentSection){

        html+='<div style="grid-column:1/-1;font-size:11px;font-weight:600;color:#94a3b8;text-transform:uppercase;letter-spacing:.05em;margin-top:'+(currentSection?'8':'0')+'px;padding-bottom:4px;border-bottom:1px solid #f1f5f9">'+esc(f.section)+'</div>';
        currentSection=f.section;
      }
      var defVal=defaults[f.name]||"";
      var borderColor=f.locked?"#f59e0b":"#e2e8f0";
      var bgColor=f.locked?"#fffbeb":"#fff";
      html+='<div style="display:flex;flex-direction:column;gap:3px">';
      html+='<label style="font-size:12px;font-weight:500;color:#475569">'+esc(f.label);

      html+='</label>';

      if(f.locked) html+='<span style="font-size:10px;color:#94a3b8">Consultant cannot edit this field</span>';

async function generatePortalLink(){
  var templateEl=document.querySelector('input[name="gen-template"]:checked');
  var templateId=templateEl?templateEl.value:"";

  if(!_portalSelectedClient||!templateId){
    document.getElementById("portal-link-output").innerHTML='<div style="color:#ef4444;font-size:13px">Please select both a client and a template.</div>';
    return;
  }

  // Gather pre-fill values
  var prefill={};
  for(var i=0;i<_portalPrefillFields.length;i++){
    var f=_portalPrefillFields[i];
    var input=document.querySelector('input[name="prefill_'+f.name+'"]');
    if(input&&input.value.trim()) prefill[f.name]=input.value.trim();
  }

  // Gather extra notification emails
  var extraEmails=[];
  var emailInputs=document.querySelectorAll(".portal-extra-email");
  for(var i=0;i<emailInputs.length;i++){
    var val=emailInputs[i].value.trim();
    if(val) extraEmails.push(val);
  }

  try{
    var resp=await fetch("/api/portal/generate-link",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({clientId:_portalSelectedClient,templateId:templateId,prefill:prefill,extraEmails:extraEmails})
    });
    if(!resp.ok) throw new Error("Failed to generate link");
    var res=await resp.json();
    _portalGeneratedLink=res.link;
    renderPortalLink();
  }catch(e){
    document.getElementById("portal-link-output").innerHTML='<div style="color:#ef4444;font-size:13px">Error: '+esc(e.message)+'</div>';
  }
}

function renderPortalLink(){
  var el=document.getElementById("portal-link-output");
  if(!el) return;
  if(!_portalGeneratedLink){ el.innerHTML=''; return; }

  var html='<div style="background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:16px">';
  html+='<div style="font-size:12px;font-weight:600;color:#176087;margin-bottom:8px">&#9989; Link Generated — Ready to Share</div>';
  html+='<div style="display:flex;gap:8px;align-items:center">';
  html+='<input type="text" value="'+esc(_portalGeneratedLink)+'" readonly style="flex:1;padding:10px 14px;border:1px solid #e2e8f0;border-radius:8px;font-size:13px;font-family:inherit;background:#fff;color:#334155" id="portal-link-input">';
  html+='<button class="btn-primary" style="padding:10px 20px;font-size:13px;white-space:nowrap;border-radius:8px" onclick="copyPortalLink()">&#128203; Copy</button>';
  html+='</div>';
  html+='<div style="margin-top:10px"><a href="'+esc(_portalGeneratedLink)+'" target="_blank" style="font-size:12px;color:#176087;text-decoration:none;font-weight:500">&#128065; Preview Form</a></div>';
  html+='</div>';
  el.innerHTML=html;
}

function copyPortalLink(){
  var input=document.getElementById("portal-link-input");
  if(input){
    input.select();
    document.execCommand("copy");
    var btn=input.parentElement.querySelector(".btn-primary");
    if(btn){ var orig=btn.innerHTML; btn.innerHTML="&#10003; Copied!"; setTimeout(function(){btn.innerHTML=orig;},2000); }
  }
}

async function populateAIJobDropdown(){
  try{
    var sel=document.getElementById("ai-job-select");
    if(!sel)return;
    // Try Accepting Candidates first, then also grab Open jobs
    var allJobs=[];
    var seen={};
    var statuses=["Accepting Candidates","Open"];
    for(var si=0;si<statuses.length;si++){
      try{
        var jr=await apiFetch("jobs",{status:statuses[si]});
        (jr.data||[]).forEach(function(j){
          if(!seen[j.id]){seen[j.id]=true;allJobs.push(j);}
        });
      }catch(e){}
    }
    // If still empty, try fetching ALL jobs (no status filter)
    if(allJobs.length===0){
      try{
        var jr2=await apiFetch("jobs",{status:"All"});
        (jr2.data||[]).forEach(function(j){
          if(!seen[j.id]){seen[j.id]=true;allJobs.push(j);}
        });
      }catch(e){}
    }
    var PRIO={"Urgent":"\uD83D\uDCA5","Hot":"\uD83D\uDD25","Warm":"\u2600\uFE0F","Cold":"\u2744\uFE0F"};
    allJobs.forEach(function(j){
      var opt=document.createElement("option");
      opt.value=j.id;
      opt.textContent=(PRIO[j.priority]||"")+" "+j.title+(j.client?" \u2014 "+j.client:"")+(j.status?" ["+j.status+"]":"");
      sel.appendChild(opt);
    });
    if(allJobs.length===0){
      var opt=document.createElement("option");
      opt.value="";opt.textContent="No jobs found — check Bullhorn sync";opt.disabled=true;
      sel.appendChild(opt);
    }
    if(_aiMatchJobId) sel.value=_aiMatchJobId;
  }catch(e){console.error("AI dropdown error:",e);}
}

  h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-top:16px">';
  h+='<div style="font-size:11px;color:#94a3b8">Generated '+esc(data.generatedAt?new Date(data.generatedAt).toLocaleString():"—")+' from your placement data</div>';
  h+='<a href="'+apiBase+'/export/revenue-report" target="_blank" style="display:inline-flex;align-items:center;gap:6px;background:#059669;color:#fff;padding:6px 14px;border-radius:6px;text-decoration:none;font-size:12px;font-weight:600">\uD83D\uDCE5 Export Revenue CSV</a>';
  h+='</div>';
  return h;
}

var _goLiveCache=[];
function showGoLiveForm(prefill){
  var m=document.getElementById("gl-modal");
  if(!m)return;
  m.style.display="flex";
  document.getElementById("gl-form-title").textContent=prefill?"Edit Hospital":"Add Hospital";
  document.getElementById("gl-id").value=prefill?prefill.id:"";
  document.getElementById("gl-hospital").value=prefill?prefill.hospital_name||"":"";
  document.getElementById("gl-system").value=prefill?prefill.health_system||"":"";
  document.getElementById("gl-city").value=prefill?prefill.city||"":"";
  document.getElementById("gl-state").value=prefill?prefill.state||"":"";
  var phSel=document.getElementById("gl-phase");
  if(phSel&&prefill)phSel.value=prefill.phase||"Planning";
  document.getElementById("gl-date").value=prefill?prefill.go_live_date||"":"";
  document.getElementById("gl-modules").value=prefill?prefill.modules||"":"";
  document.getElementById("gl-source").value=prefill?prefill.source||"":"";
  document.getElementById("gl-source-url").value=prefill?prefill.source_url||"":"";
  document.getElementById("gl-contact-name").value=prefill?prefill.contact_name||"":"";
  document.getElementById("gl-contact-title").value=prefill?prefill.contact_title||"":"";
  document.getElementById("gl-contact-email").value=prefill?prefill.contact_email||"":"";
  document.getElementById("gl-contact-phone").value=prefill?prefill.contact_phone||"":"";
  var oppSel=document.getElementById("gl-opp-status");
  if(oppSel&&prefill)oppSel.value=prefill.opportunity_status||"Not Started";
  document.getElementById("gl-owner").value=prefill?prefill.owner_name||"":"";
  document.getElementById("gl-value").value=prefill&&prefill.estimated_value?prefill.estimated_value:"";
  document.getElementById("gl-notes").value=prefill?prefill.notes||"":"";
}
function closeGLModal(){
  var m=document.getElementById("gl-modal");
  if(m)m.style.display="none";
}
async function saveGoLive(){
  var id=document.getElementById("gl-id").value;
  var body={
    hospitalName:document.getElementById("gl-hospital").value,
    healthSystem:document.getElementById("gl-system").value,
    city:document.getElementById("gl-city").value,
    state:document.getElementById("gl-state").value,
    phase:document.getElementById("gl-phase").value,
    goLiveDate:document.getElementById("gl-date").value,
    modules:document.getElementById("gl-modules").value,
    source:document.getElementById("gl-source").value,
    sourceUrl:document.getElementById("gl-source-url").value,
    contactName:document.getElementById("gl-contact-name").value,
    contactTitle:document.getElementById("gl-contact-title").value,
    contactEmail:document.getElementById("gl-contact-email").value,
    contactPhone:document.getElementById("gl-contact-phone").value,
    opportunityStatus:document.getElementById("gl-opp-status").value,
    ownerName:document.getElementById("gl-owner").value,
    estimatedValue:document.getElementById("gl-value").value||null,
    notes:document.getElementById("gl-notes").value
  };
  if(!body.hospitalName){alert("Hospital name is required");return;}
  try{
    var url=apiBase+(id?"/golives/"+id:"/golives");
    var resp=await fetch(url,{method:id?"PUT":"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    if(!resp.ok)throw new Error("Save failed");
    closeGLModal();
    loadPage();
  }catch(e){alert("Error saving: "+e.message);}
}
async function editGoLive(id){
  try{
    var data=await apiFetch("golives");
    var rec=(data.data||[]).find(function(g){return g.id===id;});
    if(rec)showGoLiveForm(rec);
  }catch(e){alert("Error loading record");}
}
async function seedGoLives(){
  try{
    var btn=event.target;btn.disabled=true;btn.textContent="Loading...";
    var resp=await fetch(apiBase+"/golives/seed",{method:"POST"});
    var result=await resp.json();
    btn.textContent="\u2705 "+result.inserted+" added";
    setTimeout(function(){btn.textContent="\uD83C\uDF31 Load 2026 Data";btn.disabled=false;loadPage();},2000);
  }catch(e){alert("Error: "+e.message);}
}
async function deleteGoLive(id){
  if(!confirm("Delete this hospital record?"))return;
  try{
    await fetch(apiBase+"/golives/"+id,{method:"DELETE"});
    loadPage();
  }catch(e){alert("Error deleting: "+e.message);}
}

function timeSince(date){
  var s=Math.floor((new Date()-date)/1000);
  if(s<60)return "just now";
  var m=Math.floor(s/60);if(m<60)return m+"m ago";
  var hr=Math.floor(m/60);if(hr<24)return hr+"h ago";
  var d=Math.floor(hr/24);if(d<30)return d+"d ago";
  return date.toLocaleDateString();
}

function selectOutreachTemplate(tmplId){
  _outreachSelectedTemplate=tmplId;
  if(tmplId==="custom"){
    document.getElementById("outreach-subject").value="";
    document.getElementById("outreach-body").value="";
    return;
  }
  var tmpl=_outreachTemplates.find(function(t){return t.id===tmplId;});
  if(!tmpl)return;
  var vars={
    firstName:_outreachRecipient.firstName||"",
    lastName:_outreachRecipient.lastName||"",
    senderName:currentUser?currentUser.firstName+" "+currentUser.lastName:"Rachel Neill",
    certifications:"your Epic certifications",
    hospitalName:"your hospital",
    modules:"multiple Epic modules"
  };
  var subject=tmpl.subject;
  var body=tmpl.body;
  Object.keys(vars).forEach(function(k){
    var re=new RegExp("\\{\\{"+k+"\\}\\}","g");
    subject=subject.replace(re,vars[k]);
    body=body.replace(re,vars[k]);
  });
  document.getElementById("outreach-subject").value=subject;
  document.getElementById("outreach-body").value=body;
}

  if(data.rateTrends&&data.rateTrends.length>0){
    h+='<div class="stat-card" style="flex-direction:column;align-items:stretch;padding:20px;margin-bottom:20px">';
    h+='<div style="font-size:15px;font-weight:700;margin-bottom:12px">\uD83D\uDCB0 Rate Trends (Contract Placements by Month)</div>';
    h+='<div class="table-wrap"><table><thead><tr><th>Month</th><th>Avg Bill Rate</th><th>Avg Pay Rate</th><th>Avg Margin</th><th>Placements</th></tr></thead><tbody>';
    data.rateTrends.slice(-12).forEach(function(rt){
      h+='<tr><td style="font-weight:600">'+esc(rt.month)+'</td>';
      h+='<td>$'+rt.avgBillRate+'/hr</td>';
      h+='<td>$'+rt.avgPayRate+'/hr</td>';
      h+='<td style="color:#059669;font-weight:600">$'+rt.avgMargin+'/hr</td>';
      h+='<td>'+rt.placements+'</td></tr>';
    });
    h+='</tbody></table></div></div>';
  }
  // Geographic demand + placement velocity side by side
  h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px">';
  if(data.geoDemand&&data.geoDemand.length>0){
    h+='<div class="stat-card" style="flex-direction:column;align-items:stretch;padding:20px">';
    h+='<div style="font-size:15px;font-weight:700;margin-bottom:12px">\uD83D\uDDFA\uFE0F Geographic Demand</div>';
    data.geoDemand.slice(0,10).forEach(function(g){
      var maxG=data.geoDemand[0]?data.geoDemand[0].openJobs:1;
      var pct=Math.round((g.openJobs/maxG)*100);
      h+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">';
      h+='<span style="font-size:13px;min-width:40px;font-weight:600">'+esc(g.state)+'</span>';
      h+='<div style="flex:1;height:18px;background:#f1f5f9;border-radius:4px;overflow:hidden"><div style="width:'+pct+'%;height:100%;background:linear-gradient(90deg,#059669,#34d399);border-radius:4px"></div></div>';
      h+='<span style="font-size:12px;font-weight:700;min-width:30px;text-align:right">'+g.openJobs+'</span>';
      h+='</div>';
    });
    h+='</div>';
  }
  if(data.velocityTrends&&data.velocityTrends.length>0){
    h+='<div class="stat-card" style="flex-direction:column;align-items:stretch;padding:20px">';
    h+='<div style="font-size:15px;font-weight:700;margin-bottom:12px">\uD83D\uDE80 Placement Velocity (by Month)</div>';
    data.velocityTrends.slice(-12).forEach(function(v){
      var maxV=Math.max.apply(null,data.velocityTrends.slice(-12).map(function(x){return x.placements;}));
      var pct=Math.round((v.placements/maxV)*100);
      h+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">';
      h+='<span style="font-size:12px;min-width:60px;font-weight:500">'+esc(v.month)+'</span>';
      h+='<div style="flex:1;height:16px;background:#f1f5f9;border-radius:4px;overflow:hidden"><div style="width:'+pct+'%;height:100%;background:linear-gradient(90deg,#7c3aed,#a78bfa);border-radius:4px"></div></div>';
      h+='<span style="font-size:12px;font-weight:700;min-width:24px;text-align:right">'+v.placements+'</span>';
      h+='</div>';
    });
    h+='</div>';
  }
  h+='</div>';
  // Pipeline snapshot
  if(data.pipeline&&data.pipeline.length>0){
    h+='<div class="stat-card" style="flex-direction:column;align-items:stretch;padding:20px;margin-bottom:20px">';
    h+='<div style="font-size:15px;font-weight:700;margin-bottom:12px">\uD83D\uDCC9 Opportunity Pipeline</div>';
    h+='<div class="table-wrap"><table><thead><tr><th>Status</th><th>Count</th><th>Total Value</th></tr></thead><tbody>';
    data.pipeline.forEach(function(p){
      h+='<tr><td style="font-weight:600">'+esc(p.status||"Unknown")+'</td>';
      h+='<td>'+p.count+'</td>';
      h+='<td>$'+(p.totalValue||0).toLocaleString()+'</td></tr>';
    });
    h+='</tbody></table></div></div>';
  }
  h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-top:16px">';
  h+='<div style="font-size:11px;color:#94a3b8">Generated '+esc(data.generatedAt?new Date(data.generatedAt).toLocaleString():"—")+' from your Bullhorn data</div>';
  h+='<a href="'+apiBase+'/export/market-report" target="_blank" style="display:inline-flex;align-items:center;gap:6px;background:#176087;color:#fff;padding:6px 14px;border-radius:6px;text-decoration:none;font-size:12px;font-weight:600">\uD83D\uDCE5 Export Market Report CSV</a>';
  h+='</div>';
  return h;
}

/* ═══ RENDER ═══ */
var _debounceTimer=null;
function render(){
  clearTimeout(_debounceTimer);
  _debounceTimer=setTimeout(function(){loadPage();},apiConnected?300:50);
  renderNav();
  document.getElementById("page-title").textContent=(getNav().find(function(n){return n.key===currentPage;})||{}).label||"Dashboard";
}
async function loadPage(){
  renderNav();
  document.getElementById("page-title").textContent=(getNav().find(function(n){return n.key===currentPage;})||{}).label||"Dashboard";
  if(!apiConnected){document.getElementById("content").innerHTML=showConnectionError();return;}
  // Show loading state
  document.getElementById("content").innerHTML='<div style="padding:48px;text-align:center"><span class="loading-spinner"></span> Loading from Bullhorn\u2026</div>';
  var q=getQ(),sf=filters.status||"All",tf=filters.type||"All",loc=filters.location||"";
  var h="";
  try{
    switch(currentPage){
      case "home":
        var dash=await apiFetch("dashboard");
        h=renderHome(dash);break;
      case "mydash":
        var myD=await apiFetch("my-dashboard");
        h=renderMyDash(myD);break;
      case "candidates":
        var cr=await loadCandidates(q,sf,loc,filters.cert||"",filters.avail||"",filters.grade||"",filters.epicRole||"");
        h=renderCandidates(cr.data,cr.total);break;
      case "consultants":
        var conr=await loadCandidates(q,"Placed","","","","","");
        h=renderConsultants(conr.data,conr.total);break;
      case "jobs":
        var pf=filters.priority||"All";
        var jr=await loadJobs(q,sf,pf==="All"?"":pf);
        h=renderJobs(jr.data,jr.total);break;
      case "smartmatch":
        h=renderSmartMatch();break;
      case "placements":
        var pr=await loadPlacements(q,sf,tf);
        h=renderPlacements(pr.data,pr.total);break;
      case "clients":
        var clr=await loadClients(q,sf);
        h=renderClients(clr.data,clr.total);break;
      case "touches":
        var touchR=await apiFetch("touch-report",{days:_touchDays});
        h=renderTouches(touchR);break;
      case "ask":
        h=renderAsk();break;
      case "reports":
        var st=await loadStats();
        var placR=await loadPlacements("","All","All");
        _lastData.placements=placR.data;
        var candR=await loadCandidates("","All","","","","","");
        _lastData.candidates=candR.data;
        h=renderReports(st);break;
      case "smartlists":
        var slr=await apiFetch("smart-lists");
        h=renderSmartLists(slr);break;
      case "portal":
        h=await renderPortal();break;
      case "aimatch":
        h=renderAIMatch();break;
      case "relationships":
        var relData=await apiFetch("relationship-scores",{type:_relTab||"candidates",sort:_relSort||"risk",limit:200});
        h=renderRelationships(relData);break;
      case "trends":
        var trendData=await apiFetch("trends");
        h=renderTrends(trendData);break;
      case "revenue":
        var revData=await apiFetch("revenue");
        h=renderRevenue(revData);break;
      case "golives":
        var glData=await apiFetch("golives",{phase:_glPhase||"All",oppStatus:_glOppStatus||"All",q:_glSearch||""});
        h=renderGoLives(glData);break;
      case "intel":
        var intelData=await apiFetch("intel",{source:_intelSource||"All",q:_intelSearch||"",starred:_intelStarred?"true":"",actionable:_intelActionable?"true":"",limit:150});
        h=renderIntel(intelData);break;
      case "outreach":
        h=await renderOutreach();break;
    }
  }catch(e){
    console.error(e);
    h=showLoadError(currentPage, e.message);
  }
  document.getElementById("content").innerHTML=h;
  // Post-render hooks
  if(currentPage==="smartmatch") populateJobDropdown();
  if(currentPage==="aimatch") populateAIJobDropdown();
  if(currentPage==="portal"&&_portalTab==="generate"&&_portalSelectedClient){
    var genTmpl=document.querySelector('input[name="gen-template"]:checked');
    if(genTmpl) loadPrefillFields(genTmpl.value);
  }
  // Show/hide save search button
  var saveBtn=document.getElementById("save-search-btn");
  if(saveBtn){
    var showSave=(currentPage==="candidates"||currentPage==="jobs")&&Object.keys(filters).some(function(k){return filters[k]&&filters[k]!=="All";});
    saveBtn.style.display=showSave?"inline-block":"none";
  }
}

// Keyboard shortcut: Escape closes detail panel
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeDetail();});

// GO
checkConnection().then(function(){
  // Show auth error if redirected back with one
  var urlParams=new URLSearchParams(window.location.search);
  if(urlParams.get("auth_error")){
    alert("Sign-in failed: "+urlParams.get("auth_error"));
    history.replaceState(null,"","/");
  }
  // If logged in, default to My Dashboard
  if(currentUser && currentPage==="home") currentPage="mydash";
  loadPage();
});
</script>
