<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anura Connect Cards</title>
<link rel="icon" type="image/jpeg" href="/fulllogo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0A2239;--blue:#176087;--sky:#53A2BE;--ink:#1A2533;--muted:#566B7A;--line:#D7E1E8;--fog:#EEF3F6;--paper:#fff;--ok:#1F7A55;--bad:#B42318;--warn:#8A5300;
  --display:Poppins,"Trebuchet MS",system-ui,sans-serif;--serif:"Source Sans 3","Segoe UI",system-ui,sans-serif;--sans:"Source Sans 3","Segoe UI",system-ui,-apple-system,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);background:var(--fog);color:var(--ink);font-size:14px;line-height:1.45}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
header{background:var(--navy);color:#fff;padding:14px 28px;display:flex;align-items:center;gap:14px}
header img{height:32px;border-radius:6px;background:#fff}
header h1{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.01em}
header a{color:#C9DCE6;margin-left:auto;font-size:13px;text-decoration:none}
header a:hover{color:#fff}
.wrap{max-width:1240px;margin:0 auto;padding:26px 28px 70px;display:grid;grid-template-columns:320px 1fr;gap:26px;align-items:start}
.panel{background:var(--paper);border-radius:16px;padding:20px 22px;box-shadow:0 1px 0 var(--line),0 10px 28px -24px rgba(7,24,42,.5)}
.panel+.panel{margin-top:18px}
h2{font-family:var(--display);font-weight:700;font-size:18px;color:var(--ink);margin-bottom:12px;letter-spacing:-.01em}
h3{font-size:13px;font-weight:700;color:var(--blue);margin:26px 0 10px;padding-top:20px;border-top:1px solid var(--line)}
input[type=search],input[type=text],textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:14px;color:var(--ink);background:#fff}
textarea{resize:vertical;font-size:15px}
input:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(23,96,135,.15)}
.list{list-style:none;margin-top:6px}
.list li{padding:10px 0;border-bottom:1px solid var(--fog);display:flex;justify-content:space-between;gap:8px;align-items:center}
.list li:last-child{border-bottom:0}
.list button.pick{background:none;border:0;font:inherit;font-size:15px;color:var(--blue);font-weight:600;cursor:pointer;text-align:left;padding:0}
.muted{color:var(--muted);font-size:12.5px}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--fog);color:var(--muted)}
.pill.active{background:#E3F4EB;color:var(--ok)}.pill.expired{background:var(--fog);color:var(--muted)}.pill.revoked{background:#FDECEA;color:var(--bad)}.pill.submitted{background:#FFF1D6;color:var(--warn)}
.btn{display:inline-block;font:inherit;font-weight:600;font-size:13px;padding:8px 13px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--blue);cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--sky)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:var(--navy)}
.btn.danger{color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.fieldbox{margin-bottom:14px}
.fieldbox label{font-weight:600;font-size:13px;display:block;margin-bottom:5px}
.fieldbox .err{color:var(--bad);font-size:12.5px;margin-top:4px}
.same{color:var(--muted);font-size:12.5px;margin-top:4px}
.photo{width:96px;height:114px;border-radius:10px;object-fit:cover;border:1px solid var(--line);background:var(--fog)}
.who{display:flex;gap:18px;align-items:center;margin-bottom:4px}
.who .photo{width:84px;height:100px}
.who .initials{width:84px;height:100px;border-radius:10px;background:var(--fog);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:30px;color:var(--blue)}
.who h2{font-size:28px;margin:0;font-weight:800;letter-spacing:-.02em}
.who .sub{color:var(--muted);font-size:14px;margin-top:2px}
.who .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12.5px;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);background:#F7FAFB}
td{padding:12px 10px;border-bottom:1px solid var(--fog);vertical-align:top}
.linkbox{background:var(--fog);border-radius:8px;padding:10px 12px;word-break:break-all;font-size:13px;margin:8px 0}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 20px;border-radius:10px;display:none;box-shadow:0 10px 30px -10px rgba(0,0,0,.4)}
.empty{color:var(--muted);padding:8px 0}
.sys-head{display:flex;align-items:center;gap:16px;margin-bottom:6px}
.sys-head .logo{height:54px;max-width:200px;object-fit:contain}
.sys-head .ph{width:54px;height:54px;border-radius:12px;background:var(--fog);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;color:var(--blue)}
.swatch{display:flex;align-items:center;gap:10px}
.swatch input[type=color]{width:44px;height:36px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:2px}
.mgr{display:grid;grid-template-columns:auto 1fr 1fr;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--fog)}
.mgr:last-child{border-bottom:0}
.mgr .n b{display:block}
.mgr input[type=text]{padding:7px 9px;font-size:14px}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
.liveform{margin-top:6px}
.liveform > summary{list-style:none;display:inline-block}
.liveform > summary::-webkit-details-marker{display:none}
.liveform[open] > summary{margin-bottom:10px}
.liveinner{background:#F7FAFB;border-radius:12px;padding:16px 18px}
.grp{font-family:var(--display);font-weight:700;font-size:15px;color:var(--navy);margin:16px 0 8px}
.grp:first-child{margin-top:0}
.more{margin:4px 0 12px}
.more summary{cursor:pointer;color:var(--blue);font-weight:600;font-size:14px;margin-bottom:8px}
@media (max-width:900px){.wrap{grid-template-columns:1fr;padding:18px 16px 60px}.grid2{grid-template-columns:1fr}.who{flex-wrap:wrap}.who .acts{margin-left:0}}
</style>
</head>
<body>
<header><img src="/fulllogo.jpg" alt=""><h1>Candidate Cards</h1><a href="/">Back to dashboard</a></header>
<div class="wrap">
  <div>
    <div class="panel">
      <h2>Find a candidate</h2>
      <input type="search" id="q" placeholder="Name" aria-label="Search candidates">
      <ul class="list" id="results"></ul>
    </div>
    <div class="panel">
      <h2>Health systems</h2>
      <input type="search" id="sq" placeholder="Client name" aria-label="Search health systems">
      <ul class="list" id="sresults"></ul>
    </div>
    <div class="panel">
      <h2>Waiting for your review</h2>
      <ul class="list" id="pending"><li class="empty">Loading…</li></ul>
    </div>
  </div>
  <div>
    <div class="panel" id="detail"><h2>Recent Card links</h2><div id="recent" class="empty">Loading…</div></div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
(function () {
  "use strict";
  var schema = [];
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function when(d) { return d ? new Date(d).toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) : ""; }
  function toast(t) { var n = $("toast"); n.textContent = t; n.style.display = "block"; clearTimeout(n._t); n._t = setTimeout(function () { n.style.display = "none"; }, 2600); }
  function call(method, url, body, raw) {
    var opts = { method: method, headers: {} };
    if (raw) { opts.body = raw; opts.headers["Content-Type"] = raw.type || "image/jpeg"; }
    else if (body) { opts.body = JSON.stringify(body); opts.headers["Content-Type"] = "application/json"; }
    return fetch(url, opts).then(function (r) {
      if (r.status === 401) { location.href = "/login?next=" + encodeURIComponent(location.pathname + location.search); throw new Error("Sign in"); }
      return r.json().then(function (b) { if (!r.ok) { var e = new Error(b.error || "Request failed"); e.body = b; throw e; } return b; });
    });
  }

  function linksTable(links, withCandidate) {
    if (!links.length) return '<p class="empty">No Card links yet. They are created when Submittal Forge drafts an email.</p>';
    return '<table><thead><tr>' + (withCandidate ? '<th>Candidate</th>' : '') + '<th>Job</th><th>Sent to</th><th>Opens</th><th>Rate</th><th></th></tr></thead><tbody>' +
      links.map(function (l) {
        return '<tr>' + (withCandidate ? '<td><button class="btn" data-cand="' + l.candidateId + '">' + esc(l.candidateName) + '</button></td>' : '') +
          '<td>' + esc(l.jobTitle) + '<div class="muted">' + esc(l.clientName) + ' &middot; created ' + esc(when(l.createdAt)) + '</div></td>' +
          '<td>' + esc(l.contactEmail || "—") + '</td>' +
          '<td>' + (l.views || 0) + (l.lastViewedAt ? '<div class="muted">last ' + esc(when(l.lastViewedAt)) + '</div>' : '') + '</td>' +
          '<td>' + esc(l.billDisplay || "—") + '</td>' +
          '<td><span class="pill ' + l.state + '">' + l.state + '</span>' +
          (l.state === "active" ? '<div class="row" style="margin-top:6px"><a class="btn" href="/cards/preview/' + l.id + '" target="_blank" rel="noopener">Preview as client</a><button class="btn" data-rate="' + l.id + '">Use Bullhorn rate</button><button class="btn danger" title="Pulls this candidate from the client\'s Card and comparison" data-revoke="' + l.id + '">Turn off</button></div>' : '') +
          '</td></tr>' +
          (!withCandidate && l.references && l.references.length && l.state === "active" ? '<tr><td colspan="5" style="background:#f8fafc"><div class="muted" style="margin-bottom:4px">References on this Card</div>' +
            l.references.map(function (r, i) {
              return '<div style="margin:6px 0"><b>' + esc([r.role, r.organization].filter(Boolean).join(", ")) + '</b> <button class="btn danger" data-refrm="' + l.id + ':' + i + '">Remove</button><div>' + esc(r.text) + '</div></div>';
            }).join("") + '</td></tr>' : '');
      }).join("") + '</tbody></table>';
  }

  function bindLinkButtons(root, reload) {
    root.querySelectorAll("[data-cand]").forEach(function (b) { b.onclick = function () { openCandidate(b.getAttribute("data-cand")); }; });
    root.querySelectorAll("[data-revoke]").forEach(function (b) {
      b.onclick = function () {
        if (!confirm("Turn off this link? The client will see that the Card is closed.")) return;
        call("POST", "/api/cards/links/" + b.getAttribute("data-revoke") + "/revoke").then(function () { toast("Link turned off"); reload(); }).catch(function (e) { toast(e.message); });
      };
    });
    root.querySelectorAll("[data-refrm]").forEach(function (b) {
      b.onclick = function () {
        var parts = b.getAttribute("data-refrm").split(":");
        if (!confirm("Take this reference off the Card?")) return;
        call("POST", "/api/cards/links/" + parts[0] + "/references/" + parts[1] + "/remove").then(function () { toast("Reference removed"); reload(); }).catch(function (e) { toast(e.message); });
      };
    });
    root.querySelectorAll("[data-rate]").forEach(function (b) {
      b.onclick = function () {
        call("POST", "/api/cards/links/" + b.getAttribute("data-rate") + "/use-bullhorn-rate").then(function (r) { toast("Card rate now " + (r.billDisplay || "blank") + " (read from Bullhorn)"); reload(); }).catch(function (e) { toast(e.message); });
      };
    });
  }

  function overview() {
    call("GET", "/api/cards/overview").then(function (o) {
      $("pending").innerHTML = o.pending.length ? o.pending.map(function (p) {
        return '<li><button class="pick" data-cand="' + p.candidateId + '">' + esc(p.name) + '</button><span class="muted">' + esc(when(p.submittedAt)) + (p.photoChanged ? " &middot; new photo" : "") + '</span></li>';
      }).join("") : '<li class="empty">Nothing waiting.</li>';
      bindLinkButtons($("pending"), overview);
      if (!new URLSearchParams(location.search).get("candidate") && !new URLSearchParams(location.search).get("system")) {
        $("detail").innerHTML = '<h2>Recent Card links</h2>' + linksTable(o.links, true);
        bindLinkButtons($("detail"), overview);
      }
    }).catch(function (e) { $("pending").innerHTML = '<li class="empty">' + esc(e.message) + '</li>'; });
  }

  var searchTimer;
  $("q").addEventListener("input", function () {
    clearTimeout(searchTimer);
    var q = this.value.trim();
    searchTimer = setTimeout(function () {
      if (q.length < 2) { $("results").innerHTML = ""; return; }
      call("GET", "/api/cards/search?q=" + encodeURIComponent(q)).then(function (r) {
        $("results").innerHTML = r.data.length ? r.data.map(function (c) { return '<li><button class="pick" data-cand="' + c.id + '">' + esc(c.name) + '</button><span class="muted">' + esc(c.epicRole) + '</span></li>'; }).join("") : '<li class="empty">No match.</li>';
        bindLinkButtons($("results"), overview);
      });
    }, 250);
  });

  function fieldInputs(prefix, fields, errors, only) {
    return schema.filter(function (f) { return !only || only(f); }).map(function (f) {
      var v = fields[f.key] || "";
      var input = f.max <= 90 ? '<input type="text" id="' + prefix + f.key + '" maxlength="' + f.max + '" value="' + esc(v) + '">' : '<textarea id="' + prefix + f.key + '" rows="3" maxlength="' + f.max + '">' + esc(v) + '</textarea>';
      return '<div class="fieldbox"><label for="' + prefix + f.key + '">' + esc(f.label) + '</label>' + input + (errors && errors[f.key] ? '<div class="err">' + esc(errors[f.key]) + '</div>' : '') + '</div>';
    }).join("");
  }
  function readInputs(prefix) {
    var out = {};
    schema.forEach(function (f) { var n = $(prefix + f.key); if (n) out[f.key] = n.value; });
    return out;
  }
  function errorText(e) {
    var errs = e.body && e.body.errors ? Object.keys(e.body.errors).map(function (k) { return k + ": " + e.body.errors[k]; }).join(" ") : "";
    return e.message + (errs ? " " + errs : "");
  }

  function openCandidate(raw) {
    var id = String(raw == null ? "" : raw);
    if (!/^\d{1,10}$/.test(id)) { history.replaceState(null, "", "/cards"); return; }
    history.replaceState(null, "", "/cards?candidate=" + id);
    $("detail").innerHTML = '<p class="empty">Loading…</p>';
    call("GET", "/api/cards/candidate/" + id).then(function (d) {
      schema = d.schema;
      var c = d.candidate, live = d.live, draft = d.draft;
      var pendingReview = draft && draft.status === "submitted";
      var activeLink = d.links.filter(function (l) { return l.state === "active"; })[0];
      var h = '<div class="who">' + (live.hasPhoto ? '<img class="photo" src="/api/cards/candidate/' + id + '/photo?v=' + Date.now() + '" alt="">' : '<div class="initials">' + esc((c.name || "?").split(/\s+/).map(function (x) { return x[0] || ""; }).slice(0, 2).join("")) + '</div>') +
        '<div><h2>' + esc(c.name) + '</h2><div class="sub">' + esc(c.epicRole) + (c.certs.length ? ", " + esc(c.certs.join(", ")) : "") + '</div></div>' +
        '<div class="acts">' + (activeLink ? '<a class="btn primary" href="/cards/preview/' + activeLink.id + '" target="_blank" rel="noopener">Open and edit Card</a>' : '') + '<button class="btn" id="back">All links</button></div></div>' +
        (activeLink ? '' : '<p class="muted" style="margin-top:8px">No live client link yet. The Card opens for editing once Forge sends this candidate to a client. You can still set their photo and story below.</p>');

      if (pendingReview) {
        h += '<h3>Candidate sent changes ' + esc(when(draft.submittedAt)) + '</h3><div class="grid2"><div>' +
          (draft.photoChanged ? '<p class="muted">New photo' + (draft.photoSource === "linkedin" ? " (from LinkedIn)" : "") + '</p>' + (draft.hasPhoto ? '<img class="photo" src="/api/cards/candidate/' + id + '/photo?draft=1&v=' + Date.now() + '" alt="New photo">' : '<p>Photo removed</p>') +
            (draft.photoNote ? '<p class="' + (/match|Small/.test(draft.photoNote) ? 'err' : 'muted') + '" style="max-width:260px;margin-top:6px;color:' + (/match|Small/.test(draft.photoNote) ? '#b45309' : '#64748b') + '">' + esc(draft.photoNote) + '</p>' : '') : '<p class="same">Photo unchanged</p>') +
          '</div><div>' + (live.hasPhoto ? '<p class="muted">Current photo</p><img class="photo" src="/api/cards/candidate/' + id + '/photo?v=' + Date.now() + '" alt="Current photo">' : '<p class="same">No current photo</p>') + '</div></div>' +
          '<p class="muted" style="margin:12px 0 6px">What they filled in. Changed answers are marked; tidy the wording here before approving if you need to.</p>' +
          schema.filter(function (f) { return (draft.fields[f.key] || live.fields[f.key]); }).map(function (f) {
            var nv = draft.fields[f.key] || "", ov = live.fields[f.key] || "";
            var changed = nv !== ov;
            var input = f.max <= 90 ? '<input type="text" id="rv-' + f.key + '" maxlength="' + f.max + '" value="' + esc(nv) + '">' : '<textarea id="rv-' + f.key + '" rows="3" maxlength="' + f.max + '">' + esc(nv) + '</textarea>';
            return '<div class="fieldbox"><label for="rv-' + f.key + '">' + esc(f.label) + (changed ? ' <span class="pill submitted">changed</span>' : '') + '</label>' + input +
              (changed && ov ? '<div class="same">Was: ' + esc(ov) + '</div>' : '') + (draft.errors[f.key] ? '<div class="err">' + esc(draft.errors[f.key]) + '</div>' : '') + '</div>';
          }).join("") +
          '<div class="row"><button class="btn primary" id="approve">Approve and publish</button><input type="text" id="sendBackNote" placeholder="What should they change?" style="flex:1;min-width:200px"><button class="btn" id="sendBack">Send back</button></div>';
      }

      h += '<h3>Live on the Card' + (live.approvedAt ? ' <span class="muted">approved ' + esc(when(live.approvedAt)) + ' by ' + esc(live.approvedBy) + '</span>' : '') + '</h3>' +
        '<div class="row" style="margin-bottom:12px">' + (live.hasPhoto ? '<img class="photo" src="/api/cards/candidate/' + id + '/photo?v=' + Date.now() + '" alt="Live photo">' : '<div class="photo"></div>') +
        '<div><input type="file" id="recPhoto" accept="image/jpeg,image/png,image/webp" style="display:none"><button class="btn" id="recPhotoBtn">' + (live.hasPhoto ? "Replace photo" : "Add photo") + '</button> ' +
        (live.hasPhoto ? '<button class="btn danger" id="recPhotoRm">Remove</button>' : '') +
        '<div class="muted" style="margin-top:6px">' + (live.photoSource === "recruiter" ? "Added by a recruiter. " : "") + 'Best when the candidate adds it themselves.</div></div></div>' +
        (function () {
          var lf = live.fields;
          var prompts = schema.filter(function (f) { return f.kind === "prompt" && lf[f.key]; });
          var facts = schema.filter(function (f) { return f.kind === "fact" && lf[f.key]; });
          var summary = [lf.headline ? "Headline" : null, lf.intro ? "intro" : null, prompts.length ? prompts.length + " culture prompt" + (prompts.length > 1 ? "s" : "") : null, facts.length ? facts.length + " quick fact" + (facts.length > 1 ? "s" : "") : null].filter(Boolean);
          return '<p class="muted" style="margin:4px 0 10px">' + (summary.length ? "On the Card: " + esc(summary.join(", ")) + "." : "Nothing in their own words yet. Send them an edit link below, or fill it in yourself.") + '</p>' +
            '<details class="liveform"><summary class="btn">Edit their story here</summary><div class="liveinner">' +
            '<p class="grp">Headline and intro</p>' + fieldInputs("lv-", lf, live.errors, function (f) { return f.kind === "about"; }) +
            '<p class="grp">Culture corner <span class="muted">(up to 4 prompts show)</span></p>' + fieldInputs("lv-", lf, live.errors, function (f) { return f.kind === "prompt" && lf[f.key]; }) +
            '<details class="more"><summary>More prompts</summary>' + fieldInputs("lv-", lf, live.errors, function (f) { return f.kind === "prompt" && !lf[f.key]; }) + '</details>' +
            '<p class="grp">Quick facts</p><div class="grid2">' + fieldInputs("lv-", lf, live.errors, function (f) { return f.kind === "fact"; }) + '</div>' +
            (live.errors && live.errors._prompts ? '<div class="err">' + esc(live.errors._prompts) + '</div>' : '') +
            '<button class="btn primary" id="saveLive">Save</button></div></details>';
        })();

      h += '<h3>Candidate edit link</h3><p class="muted">Lets ' + esc(c.firstName || "them") + ' add a photo and edit the fields above. Lasts 14 days. You approve every change.</p>' +
        '<div id="editLinkOut"></div><div class="row" style="margin-top:8px"><button class="btn primary" id="mkEdit">Create edit link</button></div>' +
        (d.editLinks.length ? '<ul class="list" style="margin-top:8px">' + d.editLinks.map(function (e) {
          var expired = e.revoked || new Date(e.expiresAt) < new Date();
          return '<li><span>Created ' + esc(when(e.createdAt)) + ' by ' + esc(e.createdBy) + (e.lastUsedAt ? ' <span class="muted">opened ' + esc(when(e.lastUsedAt)) + '</span>' : '') + '</span>' +
            (expired ? '<span class="pill expired">' + (e.revoked ? "turned off" : "expired") + '</span>' : '<button class="btn danger" data-editrevoke="' + e.id + '">Turn off</button>') + '</li>';
        }).join("") + '</ul>' : '');

      h += '<h3>Client links</h3>' + linksTable(d.links, false);
      $("detail").innerHTML = h;

      $("back").onclick = function () { history.replaceState(null, "", "/cards"); overview(); };
      bindLinkButtons($("detail"), function () { openCandidate(id); });
      $("detail").querySelectorAll("[data-editrevoke]").forEach(function (b) {
        b.onclick = function () { call("POST", "/api/cards/edit-links/" + b.getAttribute("data-editrevoke") + "/revoke").then(function () { toast("Edit link turned off"); openCandidate(id); }); };
      });
      if (pendingReview) {
        $("approve").onclick = function () {
          call("POST", "/api/cards/candidate/" + id + "/approve", { fields: readInputs("rv-"), version: draft.version }).then(function () { toast("Approved. Clients see it now."); openCandidate(id); overview(); }).catch(function (e) { toast(errorText(e)); });
        };
        $("sendBack").onclick = function () {
          call("POST", "/api/cards/candidate/" + id + "/send-back", { note: $("sendBackNote").value }).then(function () { toast("Sent back. They'll see your note on their edit page."); openCandidate(id); overview(); }).catch(function (e) { toast(e.message); });
        };
      }
      $("saveLive").onclick = function () {
        call("PUT", "/api/cards/candidate/" + id + "/live", readInputs("lv-")).then(function () { toast("Live Card saved"); openCandidate(id); }).catch(function (e) { toast(errorText(e)); });
      };
      $("recPhotoBtn").onclick = function () { $("recPhoto").click(); };
      $("recPhoto").onchange = function () {
        var f = this.files[0]; if (!f) return;
        shrink(f).then(function (blob) { return call("POST", "/api/cards/candidate/" + id + "/photo", null, blob); }).then(function () { toast("Photo saved"); openCandidate(id); }).catch(function (e) { toast(e.message); });
      };
      if ($("recPhotoRm")) $("recPhotoRm").onclick = function () { call("DELETE", "/api/cards/candidate/" + id + "/photo").then(function () { toast("Photo removed"); openCandidate(id); }); };
      $("mkEdit").onclick = function () {
        call("POST", "/api/cards/candidate/" + id + "/edit-link").then(function (r) {
          var body = "Hi " + (r.firstName || "there") + ",\n\nWhen we put you forward for a role, hiring managers get a one-page profile of you along with your résumé. Here's a link to add a photo and a few lines in your own words:\n\n" + r.url +
            "\n\nIt takes about five minutes and works on your phone. I review everything before any client sees it. The link works for two weeks.\n\nThanks!";
          var mail = "mailto:" + encodeURIComponent(r.candidateEmail || "") + "?subject=" + encodeURIComponent("Your Anura Connect profile") + "&body=" + encodeURIComponent(body);
          $("editLinkOut").innerHTML = '<div class="linkbox">' + esc(r.url) + '</div><div class="row"><button class="btn" id="copyEdit">Copy link</button><a class="btn primary" href="' + esc(mail) + '">Email it to ' + esc(r.firstName || "them") + '</a></div>';
          $("copyEdit").onclick = function () { navigator.clipboard.writeText(r.url).then(function () { toast("Copied"); }); };
        }).catch(function (e) { toast(e.message); });
      };
    }).catch(function (e) { $("detail").innerHTML = '<p class="empty">' + esc(e.message) + '</p>'; });
  }

  function shrink(file) {
    return new Promise(function (resolve, reject) {
      var img = new Image(), url = URL.createObjectURL(file);
      img.onload = function () {
        var scale = Math.min(1, 900 / Math.max(img.naturalWidth, img.naturalHeight));
        var c = document.createElement("canvas");
        c.width = Math.round(img.naturalWidth * scale); c.height = Math.round(img.naturalHeight * scale);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        c.toBlob(function (b) { b ? resolve(b) : reject(new Error("That photo couldn't be read.")); }, "image/jpeg", 0.86);
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error("Use a JPG, PNG or WebP photo.")); };
      img.src = url;
    });
  }

  /* ── Health systems ── */
  var sysTimer;
  $("sq").addEventListener("input", function () {
    clearTimeout(sysTimer);
    var q = this.value.trim();
    sysTimer = setTimeout(function () {
      if (q.length < 2) { $("sresults").innerHTML = ""; return; }
      call("GET", "/api/cards/systems/search?q=" + encodeURIComponent(q)).then(function (r) {
        $("sresults").innerHTML = r.data.length ? r.data.map(function (c) { return '<li><button class="pick" data-sys="' + c.id + '">' + esc(c.name) + '</button><span class="muted">' + esc(c.place) + '</span></li>'; }).join("") : '<li class="empty">No match.</li>';
        $("sresults").querySelectorAll("[data-sys]").forEach(function (b) { b.onclick = function () { openSystem(b.getAttribute("data-sys")); }; });
      });
    }, 250);
  });

  /* Pick a brand color from a logo: the most common saturated color, ignoring white, black and grays. */
  function logoAccent(blob) {
    return new Promise(function (resolve) {
      var img = new Image(), url = URL.createObjectURL(blob);
      img.onload = function () {
        var c = document.createElement("canvas"); c.width = 64; c.height = 64;
        var g = c.getContext("2d"); g.drawImage(img, 0, 0, 64, 64);
        var px = g.getImageData(0, 0, 64, 64).data, buckets = {};
        for (var i = 0; i < px.length; i += 4) {
          if (px[i + 3] < 200) continue;
          var r = px[i], gg = px[i + 1], b = px[i + 2], mx = Math.max(r, gg, b), mn = Math.min(r, gg, b);
          if (mx < 40 || mn > 215 || (mx - mn) < 40) continue;
          var key = (r >> 4) + "," + (gg >> 4) + "," + (b >> 4);
          var e = buckets[key] || (buckets[key] = { n: 0, r: 0, g: 0, b: 0 });
          e.n++; e.r += r; e.g += gg; e.b += b;
        }
        URL.revokeObjectURL(url);
        var best = null; Object.keys(buckets).forEach(function (k) { if (!best || buckets[k].n > best.n) best = buckets[k]; });
        if (!best) return resolve("");
        var hex = "#" + [best.r, best.g, best.b].map(function (v) { return ("0" + Math.round(v / best.n).toString(16)).slice(-2); }).join("");
        resolve(hex);
      };
      img.onerror = function () { URL.revokeObjectURL(url); resolve(""); };
      img.src = url;
    });
  }

  function openSystem(raw) {
    var id = String(raw == null ? "" : raw);
    if (!/^\d{1,9}$/.test(id)) return;
    history.replaceState(null, "", "/cards?system=" + id);
    $("detail").innerHTML = '<p class="empty">Loading…</p>';
    call("GET", "/api/cards/systems/" + id).then(function (d) {
      var st = d.settings, name = st.displayName || d.client.name;
      var hiddenSet = {}; d.contacts.forEach(function (c) { if (c.hidden) hiddenSet[c.id] = true; });
      var shownIds = d.managers.map(function (m) { return m.id; });
      var addedIds = [];
      var h = '<div class="sys-head">' + (st.hasLogo ? '<img class="logo" src="/api/cards/systems/' + id + '/logo?v=' + Date.now() + '" alt="">' : '<div class="ph">' + esc(name.slice(0, 2).toUpperCase()) + '</div>') +
        '<div style="flex:1"><h2 style="margin:0">' + esc(name) + '</h2><div class="muted">Health system page</div></div>' +
        '<a class="btn primary" href="/cards/system/' + id + '/preview" target="_blank" rel="noopener">Preview as client</a></div>';
      h += '<h3>Branding</h3><div class="grid2"><div>' +
        '<div class="fieldbox"><label>Logo</label><input type="file" id="sysLogo" accept="image/png,image/jpeg,image/webp" style="display:none">' +
        '<div class="row"><button class="btn" id="sysLogoBtn">' + (st.hasLogo ? "Replace logo" : "Upload logo") + '</button>' + (st.hasLogo ? '<button class="btn danger" id="sysLogoRm">Remove</button>' : '') + '</div>' +
        '<div class="muted" style="margin-top:6px">PNG with a transparent background looks best. We pick the brand color from it.</div></div>' +
        '<div class="fieldbox"><label for="sysColor">Accent color</label><div class="swatch"><input type="color" id="sysColor" value="' + esc(st.accent || "#53A2BE") + '"><span class="muted" id="sysColorHex">' + esc(st.accent || "Anura blue (default)") + '</span></div></div>' +
        '</div><div>' +
        '<div class="fieldbox"><label for="sysName">Name on the page</label><input type="text" id="sysName" maxlength="120" value="' + esc(st.displayName) + '" placeholder="' + esc(d.client.name) + '"></div>' +
        '<div class="fieldbox"><label for="sysIntro">Welcome line <span class="muted">(optional)</span></label><textarea id="sysIntro" rows="3" maxlength="600" placeholder="Everyone we\'ve put forward for your open roles, side by side.">' + esc(st.intro) + '</textarea></div>' +
        '<label class="check"><input type="checkbox" id="sysOnsite"' + (st.showConsultants ? " checked" : "") + '> Show Anura consultants on site</label>' +
        '</div></div>';
      h += '<h3>Managers we work with</h3><p class="muted" style="margin-bottom:8px">Pulled from Bullhorn: contacts on our jobs here. Untick to hide, edit a title if Bullhorn\'s is wrong. Emails and phones never show.</p>' +
        '<div id="mgrList">' + (d.managers.length ? d.managers.map(function (m) {
          return '<div class="mgr"><input type="checkbox" data-mgr="' + esc(m.id) + '" checked aria-label="Show ' + esc(m.name) + '"><div class="n"><b>' + esc(m.name) + '</b><span class="muted">' + esc(m.department || "") + (m.hiringFor.length ? (m.department ? ", " : "") + "hiring " + esc(m.hiringFor.join(", ")) : "") + '</span></div>' +
            '<input type="text" data-title="' + esc(m.id) + '" maxlength="120" value="' + esc(m.title) + '" aria-label="Title"></div>';
        }).join("") : '<p class="empty">No hiring managers on Anura jobs here yet.</p>') + '</div>' +
        '<div class="row" style="margin-top:8px"><select id="mgrAdd" style="flex:1;padding:8px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:14px"><option value="">Add someone else from ' + esc(name) + '…</option>' +
        d.contacts.filter(function (c) { return shownIds.indexOf(c.id) < 0; }).map(function (c) { return '<option value="' + esc(c.id) + '">' + esc(c.name) + (c.title ? " (" + esc(c.title) + ")" : "") + (c.hidden ? " [hidden]" : "") + '</option>'; }).join("") + '</select></div>';
      h += '<div class="row" style="margin-top:18px"><button class="btn primary" id="sysSave">Save</button><span class="muted" id="sysStatus"></span></div>';
      h += '<h3>Client link</h3><p class="muted">One link for everyone at ' + esc(name) + '. It shows open roles here, nothing from other clients. Turn it off anytime.</p><div id="sysLinkOut"></div>' +
        '<div class="row" style="margin-top:8px"><button class="btn primary" id="sysMk">Create link</button></div>' +
        (d.links.length ? '<ul class="list" style="margin-top:8px">' + d.links.map(function (l) {
          return '<li><span>Created ' + esc(when(l.createdAt)) + ' by ' + esc(l.createdBy) + ' <span class="muted">' + (l.views || 0) + ' opens' + (l.lastViewedAt ? ", last " + esc(when(l.lastViewedAt)) : "") + '</span></span>' +
            (l.revoked ? '<span class="pill revoked">off</span>' : '<button class="btn danger" data-sysrevoke="' + l.id + '">Turn off</button>') + '</li>';
        }).join("") + '</ul>' : '');
      $("detail").innerHTML = h;

      $("sysColor").oninput = function () { $("sysColorHex").textContent = this.value; this.dataset.touched = "1"; };
      $("sysLogoBtn").onclick = function () { $("sysLogo").click(); };
      $("sysLogo").onchange = function () {
        var f = this.files[0]; if (!f) return;
        if (f.size > 5 * 1024 * 1024) { toast("Use a logo under 5 MB."); return; }
        logoAccent(f).then(function (hex) {
          if (hex && !$("sysColor").dataset.touched) { $("sysColor").value = hex; $("sysColorHex").textContent = hex + " (from the logo)"; $("sysColor").dataset.touched = "1"; }
          return call("POST", "/api/cards/systems/" + id + "/logo", null, f);
        }).then(function () { toast("Logo saved. Save to keep the color."); }).catch(function (e) { toast(e.message); });
      };
      if ($("sysLogoRm")) $("sysLogoRm").onclick = function () { call("DELETE", "/api/cards/systems/" + id + "/logo").then(function () { toast("Logo removed"); openSystem(id); }); };
      $("mgrAdd").onchange = function () {
        var cid = this.value; if (!cid) return;
        var c = d.contacts.filter(function (x) { return x.id === cid; })[0];
        addedIds.push(cid); delete hiddenSet[cid];
        var row = document.createElement("div"); row.className = "mgr";
        row.innerHTML = '<input type="checkbox" data-mgr="' + esc(cid) + '" checked><div class="n"><b>' + esc(c.name) + '</b><span class="muted">' + esc(c.department || "") + '</span></div><input type="text" data-title="' + esc(cid) + '" maxlength="120" value="' + esc(c.title) + '">';
        var list = $("mgrList"); if (list.querySelector(".empty")) list.innerHTML = "";
        list.appendChild(row);
        this.querySelector('option[value="' + cid + '"]').remove(); this.value = "";
      };
      $("sysSave").onclick = function () {
        var hidden = Object.keys(hiddenSet), order = [], titles = {};
        document.querySelectorAll("[data-mgr]").forEach(function (cb) {
          var cid = cb.getAttribute("data-mgr");
          if (cb.checked) { order.push(cid); hidden = hidden.filter(function (x) { return x !== cid; }); }
          else if (hidden.indexOf(cid) < 0) hidden.push(cid);
          var t = document.querySelector('[data-title="' + cid + '"]');
          var orig = (d.contacts.filter(function (x) { return x.id === cid; })[0] || {}).title || "";
          if (t && t.value !== orig) titles[cid] = t.value;
        });
        call("PUT", "/api/cards/systems/" + id, {
          displayName: $("sysName").value, intro: $("sysIntro").value, showConsultants: $("sysOnsite").checked,
          accent: $("sysColor").dataset.touched || st.accent ? $("sysColor").value : "",
          hidden: hidden, added: order, order: order, titles: titles,
        }).then(function () { toast("Saved"); openSystem(id); }).catch(function (e) { $("sysStatus").textContent = errorText(e); });
      };
      $("sysMk").onclick = function () {
        call("POST", "/api/cards/systems/" + id + "/link").then(function (r) {
          $("sysLinkOut").innerHTML = '<div class="linkbox">' + esc(r.url) + '</div><button class="btn" id="sysCopy">Copy link</button>';
          $("sysCopy").onclick = function () { navigator.clipboard.writeText(r.url).then(function () { toast("Copied"); }); };
        }).catch(function (e) { toast(e.message); });
      };
      $("detail").querySelectorAll("[data-sysrevoke]").forEach(function (b) {
        b.onclick = function () { call("POST", "/api/cards/system-links/" + b.getAttribute("data-sysrevoke") + "/revoke").then(function () { toast("Link turned off"); openSystem(id); }); };
      });
    }).catch(function (e) { $("detail").innerHTML = '<p class="empty">' + esc(e.message) + '</p>'; });
  }

  overview();
  var start = new URLSearchParams(location.search).get("candidate");
  if (start) openCandidate(start);
  var startSys = new URLSearchParams(location.search).get("system");
  if (startSys) openSystem(startSys);
})();
</script>
</body>
